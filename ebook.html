      var hex = Array.prototype.map.call(new Uint8Array(h), function(x){ return ('0' + x.toString(16)).slice(-2); }).join('');
      check('sha=' + hex, hex);
    });
  }
  function paintVerify(){
    app.innerHTML = '<h1>' + esc(t('cH')) + '</h1><p class="sub">' + esc(t('cS')) + '</p>' +
      '<div class="fld"><span>' + esc(t('cCode')) + '</span></div><div class="row" style="margin-top:6px"><input type="text" id="vc" maxlength="12" placeholder="EB-XXXXXX" value="' + esc(vcode) + '"><button class="btn" id="vgo" type="button">' + esc(t('cBtn')) + '</button></div>' +
      '<div class="or">' + esc(t('cOr')) + '</div>' +
      '<label class="drop" id="vd"><b>⇪</b>' + esc(t('cDrop')) + '<br><span style="font-size:12px">' + esc(t('cDrop2')) + '</span><input type="file" id="vf" accept="application/pdf,.pdf" hidden></label>' +
      '<div id="vr">' + resHTML() + '</div>' +
      '<a class="btn" style="display:block;text-align:center;text-decoration:none;margin-top:18px;background:none;border:1px solid var(--line);color:var(--text)" href="' + SITE + '">' + esc(t('visit')) + '</a>';
    var inp = document.getElementById('vc'), dz = document.getElementById('vd');
    function go(){ vcode = inp.value.trim().toUpperCase(); if(vcode) check('code=' + encodeURIComponent(vcode)); }
    document.getElementById('vgo').onclick = go; inp.onkeydown = function(e){ if(e.key === 'Enter') go(); };
    document.getElementById('vf').onchange = function(){ if(this.files[0]) hashFile(this.files[0]); };
    dz.ondragover = function(e){ e.preventDefault(); dz.classList.add('on'); }; dz.ondragleave = function(){ dz.classList.remove('on'); };
    dz.ondrop = function(e){ e.preventDefault(); dz.classList.remove('on'); var f = e.dataTransfer.files[0]; if(f) hashFile(f); };
  }
  document.getElementById('lang').onclick = function(){ lang = lang === 'th' ? 'en' : 'th'; paint(); };
  var mode = (q.id && q.t) ? 'accept' : 'verify';
  if(mode === 'verify'){ paint(); if(vcode) check('code=' + encodeURIComponent(vcode)); return; }
  fetch(WORKER + '/api/ebook/terms?id=' + encodeURIComponent(q.id) + '&t=' + encodeURIComponent(q.t)).then(function(r){ return r.json().then(function(d){ d.__s = r.status; return d; }); }).then(function(d){
    if(!d.ok){ err('nf'); return; }
    rec = d.ebook; lang = rec.lang === 'en' ? 'en' : 'th'; paint();
  }).catch(function(){ err('net'); });
})();
</script>
