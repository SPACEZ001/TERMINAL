ch other."}, {"id": "b", "letter": "B", "text": "Wave 5 becomes structurally impossible under Elliott's rules."}, {"id": "c", "letter": "C", "text": "Wave 3 must also extend, always becoming the longest wave regardless."}, {"id": "d", "letter": "D", "text": "Wave 3 must retrace 100% of wave 1."}], "correct": ["a"], "expEn": "When wave 1 is the extended wave — a relatively uncommon pattern — waves 3 and 5 tend to move toward equality in length with each other, and the alternation guideline may apply between them instead of between waves 2 and 4.", "expTh": "เมื่อคลื่น 1 เป็นคลื่นที่ยืดออก (ซึ่งพบได้ไม่บ่อยนัก) คลื่น 3 และคลื่น 5 มักมีแนวโน้มยาวใกล้เคียงกัน และแนวทาง alternation อาจนำมาใช้ระหว่างคลื่น 3 กับ 5 แทนที่จะเป็นระหว่างคลื่น 2 กับ 4 ตามปกติ"}, {"id": "v2q18", "text": "In advanced wave counting, when a proposed count is ambiguous, which tool provides the strongest CONFIRMING (not primary) evidence?", "choices": [{"id": "a", "letter": "A", "text": "News headlines, which directly determine the correct wave labels."}, {"id": "b", "letter": "B", "text": "Randomly selected retracement levels chosen after the fact."}, {"id": "c", "letter": "C", "text": "Astrology-based cycle timing, which overrides all Elliott rules."}, {"id": "d", "letter": "D", "text": "Momentum/oscillator divergence at prospective wave endpoints, used to support — not replace — compliance with Elliott's rules."}], "correct": ["d"], "expEn": "Momentum indicators are valuable as secondary, confirming evidence — divergence at a prospective wave 3 or wave 5 endpoint strengthens a count's credibility — but they never override the three hard rules of impulse structure, which always take priority.", "expTh": "ตัวชี้วัดโมเมนตัมมีประโยชน์ในฐานะหลักฐานยืนยันรอง กล่าวคือสัญญาณ divergence ที่จุดปลายของคลื่น 3 หรือคลื่น 5 ที่คาดการณ์ไว้ จะช่วยเพิ่มความน่าเชื่อถือของการนับคลื่น แต่จะไม่มีวันมีน้ำหนักเหนือกฎเหล็กทั้งสามข้อของโครงสร้าง impulse ซึ่งยังคงมีความสำคัญสูงสุดเสมอ"}, {"id": "v2q19", "text": "Socionomics, as developed within the Elliott Wave community (notably by Robert Prechter), proposes that:", "choices": [{"id": "a", "letter": "A", "text": "Economic events and news headlines are the primary cause of shifts in social mood."}, {"id": "b", "letter": "B", "text": "Social mood, which follows a patterned (fractal) progression, drives social and economic events — rather than events driving mood."}, {"id": "c", "letter": "C", "text": "Stock prices are driven exclusively by rational analysis of corporate fundamentals."}, {"id": "d", "letter": "D", "text": "Elliott Wave patterns only apply to financial markets and have no bearing on broader social trends."}], "correct": ["b"], "expEn": "Socionomic theory reverses the conventional assumption of causality: it argues that patterned, endogenously-generated shifts in aggregate social mood (visible in financial market fractals) are what drive social and economic events, rather than the other way around.", "expTh": "ทฤษฎี socionomics พลิกกลับสมมติฐานเรื่องเหตุและผลแบบเดิม โดยเสนอว่าการเปลี่ยนแปลงของ social mood โดยรวมที่เกิดขึ้นเองภายในตามรูปแบบแฟร็กทัล (ซึ่งสังเกตได้จากรูปแบบในตลาดการเงิน) เป็นสิ่งที่ขับเคลื่อนเหตุการณ์ทางสังคมและเศรษฐกิจ มิใช่ในทางกลับกัน"}, {"id": "v2q20", "text": "According to socionomic theory, aggregate social mood as reflected in financial markets is theorized to correlate with which broader social phenomena?", "choices": [{"id": "a", "letter": "A", "text": "Trends in phenomena such as popular culture, political outcomes, and societal risk tolerance."}, {"id": "b", "letter": "B", "text": "Only foreign exchange rates between major currencies."}, {"id": "c", "letter": "C", "text": "Only weather patterns and agricultural cycles."}, {"id": "d", "letter": "D", "text": "Nothing beyond the specific stock index being measured."}], "correct": ["a"], "expEn": "Socionomists argue that the same fractal mood waves visible in stock indices also correlate with trends across popular culture, political outcomes, fashion, and societal risk tolerance, since all are theorized to be downstream expressions of the same underlying collective mood.", "expTh": "นักทฤษฎี socionomics เสนอว่าคลื่นอารมณ์แบบแฟร็กทัลเดียวกันที่ปรากฏในดัชนีหุ้น ยังมีความสัมพันธ์กับแนวโน้มด้านวัฒนธรรมสมัยนิยม ผลการเลือกตั้งทางการเมือง แฟชั่น และระดับความยอมรับความเสี่ยงของสังคม เนื่องจากปรากฏการณ์เหล่านี้ล้วนถูกมองว่าเป็นผลลัพธ์ปลายทางของอารมณ์ร่วมของสังคมชุดเดียวกัน"}], "v3": [{"id": "v3q01", "text": "Which of the following are valid ABSOLUTE RULES (not guidelines) of standard Elliott impulse-wave structure?", "choices": [{"id": "a", "letter": "A", "text": "Wave 5 always exceeds the length of wave 3."}, {"id": "b", "letter": "B", "text": "Wave 3 is never the shortest of waves 1, 3, and 5."}, {"id": "c", "letter": "C", "text": "Wave 2 never retraces more than 100% of wave 1."}, {"id": "d", "letter": "D", "text": "Wave 4 never enters the price territory of wave 1 (in non-leveraged cash markets)."}], "correct": ["b", "c", "d"], "expEn": "Elliott's three hard rules are: wave 2 cannot retrace beyond wave 1's start, wave 3 cannot be the shortest actionable wave, and wave 4 cannot overlap wave 1's territory in standard impulses. Wave 5 exceeding wave 3 is common but not required — truncation is a recognized, valid exception.", "expTh": "กฎเหล็กสามข้อของเอลเลียตคือ คลื่น 2 ห้ามย้อนกลับเกินจุดเริ่มต้นของคลื่น 1, คลื่น 3 ห้ามสั้นที่สุดในบรรดาคลื่น 1, 3, 5 และคลื่น 4 ห้ามทับซ้อนอาณาเขตราคาของคลื่น 1 ใน impulse แบบมาตรฐาน ส่วนการที่คลื่น 5 ยาวเกินคลื่น 3 นั้นพบได้บ่อยแต่ไม่ใช่ข้อบังคับ เพราะ truncation เป็นข้อยกเว้นที่ได้รับการยอมรับว่าถูกต้อง"}, {"id": "v3q02", "text": "A chart shows a five-wave rally where the middle wave (candidate wave 3) is the SHORTEST of the three actionable waves, and its own internal subdivision shows only three sub-waves. Which conclusions are valid?", "choices": [{"id": "a", "letter": "A", "text": "The count violates the rule that wave 3 can never be the shortest actionable wave."}, {"id": "b", "letter": "B", "text": "This is a normal, valid impulse count that requires no changes."}, {"id": "c", "letter": "C", "text": "The three-wave internal subdivision suggests this middle wave may actually be corrective rather than a valid motive wave 3."}, {"id": "d", "letter": "D", "text": "This is an acceptable diagonal triangle appearing in the wave 3 position."}], "correct": ["a", "c"], "expEn": "Both the length violation (wave 3 shortest) and the structural mismatch (three sub-waves instead of five) point to the same conclusion: this cannot be a valid wave 3. Diagonals never appear in the wave 3 position, so that explanation is invalid too.", "expTh": "ทั้งการละเมิดกฎเรื่องความยาว (คลื่น 3 สั้นที่สุด) และความไม่สอดคล้องเชิงโครงสร้าง (มีเพียง 3 คลื่นย่อยแทนที่จะเป็น 5) ล้วนชี้ไปที่ข้อสรุปเดียวกันคือ นี่ไม่สามารถเป็นคลื่น 3 ที่ถูกต้องได้ และ diagonal triangle ก็ไม่มีวันปรากฏในตำแหน่งคลื่น 3 ด้วยเช่นกัน จึงไม่ใช่คำอธิบายที่ถูกต้อง"}, {"id": "v3q03", "text": "A correction retraces 100% of the prior impulse's final wave, and its internal structure shows a clear 5-3-5 subdivision. Which statements are consistent with valid Elliott Wave interpretation?", "choices": [{"id": "a", "letter": "A", "text": "A zigzag correction can legally retrace 100% or more of the preceding impulse, since it is not itself bound by the wave-2 retracement rule."}, {"id": "b", "letter": "B", "text": "The 5-3-5 subdivision indicates this must be a flat correction."}, {"id": "c", "letter": "C", "text": "A correction can never retrace more than 61.8% of the prior move regardless of its position."}, {"id": "d", "letter": "D", "text": "The 5-3-5 subdivision is consistent with zigzag structure."}], "correct": ["a", "d"], "expEn": "The wave-2 100% rule applies only to a wave literally labeled '2' within an impulse; a standalone A-B-C correction following a completed impulse is not bound by that rule and can retrace fully or more. A 5-3-5 subdivision is the signature of a zigzag, not a flat (which is 3-3-5).", "expTh": "กฎย้อนกลับ 100% ของคลื่น 2 ใช้บังคับเฉพาะกับคลื่นที่ถูกกำกับว่าเป็น '2' ภายใน impulse เท่านั้น ส่วนคลื่นปรับฐาน A-B-C เดี่ยวที่เกิดหลัง impulse จบสมบูรณ์แล้ว ไม่ได้ถูกผูกด้วยกฎนี้ จึงสามารถย้อนกลับเต็มหรือมากกว่าได้ และโครงสร้าง 5-3-5 คือลายเซ็นของ zigzag ไม่ใช่ flat ซึ่งมีโครงสร้าง 3-3-5"}, {"id": "v3q04", "text": "Which of the following are legitimate Fibonacci relationships commonly overlaid to build a price-confluence zone for a prospective wave 5 top?", "choices": [{"id": "a", "letter": "A", "text": "External retracement of wave 4, projected at 1.618 × wave 4's own length."}, {"id": "b", "letter": "B", "text": "Wave 5 = the length of wave 1 (equality)."}, {"id": "c", "letter": "C", "text": "Wave 5 = 0.618 × the length of waves 1 through 3."}, {"id": "d", "letter": "D", "text": "Wave 5 always equals exactly 3.618 × wave 2, with no exceptions."}], "correct": ["a", "b", "c"], "expEn": "The first three are all standard, well-documented Fibonacci projection techniques used in combination to build confluence zones for wave 5. The fourth is a fabricated, overly rigid relationship with no basis in Elliott Wave literature.", "expTh": "สามข้อแรกล้วนเป็นเทคนิคการฉายภาพ Fibonacci มาตรฐานที่มีการบันทึกไว้อย่างดี และมักนำมาใช้ร่วมกันเพื่อสร้างโซนบรรจบสำหรับเป้าหมายคลื่น 5 ส่วนข้อสุดท้ายเป็นความสัมพันธ์ที่ตายตัวเกินไปและไม่มีที่มาจากตำราคลื่นเอลเลียตแต่อย่างใด"}, {"id": "v3q05", "text": "Which of the following are hallmarks of a genuine wave 3 rally, as opposed to a corrective B-wave rally?", "choices": [{"id": "a", "letter": "A", "text": "Frequently the longest and steepest wave of the entire sequence."}, {"id": "b", "letter": "B", "text": "Expanding volume and broad participation across the advancing market."}, {"id": "c", "letter": "C", "text": "A choppy, overlapping structure with fading momentum as the rally progresses."}, {"id": "d", "letter": "D", "text": "Strong follow-through with minimal overlap between sub-waves."}], "correct": ["a", "b", "d"], "expEn": "Wave 3 typically shows broad-based strength: expanding volume, clean non-overlapping sub-waves, and the steepest, longest advance of the sequence. A choppy structure with fading momentum instead describes the deceptive character typical of a wave B rally.", "expTh": "คลื่น 3 มักแสดงความแข็งแกร่งในวงกว้าง ปริมาณการซื้อขายที่ขยายตัว คลื่นย่อยที่สะอาดไม่ทับซ้อนกัน และเป็นคลื่นที่ยาวและชันที่สุดในลำดับ ในขณะที่โครงสร้างที่แกว่งตัวทับซ้อนพร้อมโมเมนตัมที่อ่อนแรงลงเรื่อย ๆ กลับเป็นลักษณะหลอกลวงที่พบได้ทั่วไปในคลื่น B มากกว่า"}, {"id": "v3q06", "text": "A triangle appears to be forming in the wave 4 position of an impulse. Which observations would be CONSISTENT with a valid contracting triangle interpretation?", "choices": [{"id": "a", "letter": "A", "text": "Wave E moves well beyond the extreme of wave C without respecting either boundary trendline."}, {"id": "b", "letter": "B", "text": "The A-C and B-D trendlines are converging toward each other."}, {"id": "c", "letter": "C", "text": "Each of the five sub-waves (A through E) subdivides into three waves."}, {"id": "d", "letter": "D", "text": "Volume and volatility tend to contract as the pattern progresses."}], "correct": ["b", "c", "d"], "expEn": "A valid contracting triangle has five three-wave sub-legs, converging A-C/B-D trendlines, and typically diminishing volatility. Wave E moving far beyond wave C while ignoring the boundary trendlines would actually invalidate the triangle interpretation, since it contradicts the defining convergence.", "expTh": "triangle แบบ contracting ที่ถูกต้องจะมีคลื่นย่อย 5 คลื่นที่แบ่งเป็น 3 คลื่นย่อยแต่ละคลื่น เส้นแนวโน้ม A-C และ B-D บรรจบเข้าหากัน และความผันผวนมักลดลงเรื่อย ๆ ส่วนกรณีที่คลื่น E เคลื่อนที่เลยจุดสุดขั้วของคลื่น C ไปมากโดยไม่สนใจเส้นขอบทั้งสองฝั่งเลย จะกลับกลายเป็นการหักล้างการตีความว่าเป็น triangle เนื่องจากขัดแย้งกับลักษณะการบรรจบกันซึ่งเป็นคุณสมบัติหลักของรูปแบบนี้"}, {"id": "v3q07", "text": "Which of the following statements about Elliott Wave degree labeling are TRUE?", "choices": [{"id": "a", "letter": "A", "text": "Corrective waves are never assigned a formal degree label; only motive waves are."}, {"id": "b", "letter": "B", "text": "Degree is assigned based on a wave's structural position in the fractal hierarchy, not a fixed calendar duration."}, {"id": "c", "letter": "C", "text": "A Minute-degree wave must always complete within exactly one trading day."}, {"id": "d", "letter": "D", "text": "The same 1-2-3-4-5 / A-B-C numbering can repeat at different degrees, distinguished by different symbol styles (e.g., circled vs. plain numbers)."}], "correct": ["b", "d"], "expEn": "Degree labeling is purely structural and relative — the same numbering repeats fractally across degrees, distinguished only by notation style, and no degree is tied to a fixed calendar duration. Corrective waves are assigned degree labels just as motive waves are (e.g., a Minor-degree wave 4 correction).", "expTh": "การกำกับดีกรีเป็นเรื่องเชิงโครงสร้างและสัมพัทธ์ล้วน ๆ ป้ายกำกับ 1-2-3-4-5 / A-B-C แบบเดียวกันซ้ำกันตามลักษณะแฟร็กทัลในทุกดีกรี แยกแยะกันด้วยรูปแบบสัญลักษณ์เท่านั้น และไม่มีดีกรีใดที่ผูกกับระยะเวลาปฏิทินที่ตายตัว คลื่นปรับฐานก็ได้รับการกำกับดีกรีเช่นเดียวกับคลื่น motive (เช่น คลื่นปรับฐาน 4 ดีกรี Minor)"}, {"id": "v3q08", "text": "An analyst identifies what looks like an ending diagonal completing wave 5 of a Minor-degree impulse. Which follow-through observations would SUPPORT this interpretation?", "choices": [{"id": "a", "letter": "A", "text": "Waves 1 and 4 of the diagonal overlap in price."}, {"id": "b", "letter": "B", "text": "Price reverses sharply and retraces the entire diagonal in a fraction of the time it took to form."}, {"id": "c", "letter": "C", "text": "The five internal sub-waves each subdivide into three waves (3-3-3-3-3)."}, {"id": "d", "letter": "D", "text": "The pattern shows expanding, widening trendlines rather than converging ones."}], "correct": ["a", "b", "c"], "expEn": "A classic ending diagonal has a 3-3-3-3-3 subdivision, overlapping waves 1 and 4, converging (not expanding) trendlines, and is typically followed by a fast, sharp reversal that retraces the pattern quickly — all consistent with the first three observations.", "expTh": "ending diagonal แบบคลาสสิกมีการแบ่งย่อยแบบ 3-3-3-3-3 คลื่น 1 กับ 4 ทับซ้อนกัน เส้นแนวโน้มบรรจบเข้าหากัน (ไม่ใช่ขยายออก) และมักตามมาด้วยการกลับตัวอย่างรวดเร็วรุนแรงที่ย้อนกลับทั้งรูปแบบในเวลาอันสั้น ซึ่งสอดคล้องกับสามข้อสังเกตแรก"}, {"id": "v3q09", "text": "Which of the following are valid reasons an analyst might REJECT a proposed Elliott Wave count?", "choices": [{"id": "a", "letter": "A", "text": "The count requires wave 3 to be the shortest of waves 1, 3, and 5."}, {"id": "b", "letter": "B", "text": "The count shows wave 5 slightly exceeding the price extreme of wave 3."}, {"id": "c", "letter": "C", "text": "The count requires wave 4 to overlap wave 1 in a standard (non-diagonal) impulse."}, {"id": "d", "letter": "D", "text": "The count requires wave 2 to retrace more than 100% of wave 1."}], "correct": ["a", "c", "d"], "expEn": "The first three all break one of Elliott's three hard rules and are valid grounds for rejecting a count. Wave 5 exceeding wave 3, even slightly, is entirely normal and expected — it is not grounds for rejection.", "expTh": "สามข้อแรกล้วนละเมิดกฎเหล็กข้อใดข้อหนึ่งในสามข้อของเอลเลียต จึงเป็นเหตุผลที่ถูกต้องในการปฏิเสธการนับคลื่นนั้น ส่วนกรณีที่คลื่น 5 เคลื่อนเลยจุดสุดขั้วของคลื่น 3 ไปเพียงเล็กน้อยนั้น ถือเป็นเรื่องปกติและเป็นที่คาดหมายได้ ไม่ใช่เหตุผลในการปฏิเสธแต่อย่างใด"}, {"id": "v3q10", "text": "Which projections are appropriately used together when building a Fibonacci price-confluence target for a prospective wave 4?", "choices": [{"id": "a", "letter": "A", "text": "A 2.618 extension of wave 2, measured from the wave 1 low."}, {"id": "b", "letter": "B", "text": "A 0.382 retracement of wave 3."}, {"id": "c", "letter": "C", "text": "A 1.618 extension of wave 1, measured from the wave 3 high."}, {"id": "d", "letter": "D", "text": "A 0.236 retracement of wave 3."}], "correct": ["b", "d"], "expEn": "Wave 4 targets are conventionally built from shallow retracements of wave 3 (23.6% and 38.2%). The 1.618 and 2.618 extension techniques listed are used for projecting wave 5 or wave 3 targets, not wave 4, making them inappropriate here.", "expTh": "เป้าหมายของคลื่น 4 ตามธรรมเนียมปฏิบัติสร้างจากการย้อนกลับตื้น ๆ ของคลื่น 3 (23.6% และ 38.2%) ส่วนเทคนิคการฉายภาพแบบ 1.618 และ 2.618 ที่ระบุไว้นั้น ใช้สำหรับประเมินเป้าหมายของคลื่น 5 หรือคลื่น 3 ไม่ใช่คลื่น 4 จึงไม่เหมาะสมที่จะนำมาใช้ในกรณีนี้"}, {"id": "v3q11", "text": "Which statements correctly describe the alternation guideline?", "choices": [{"id": "a", "letter": "A", "text": "If wave 2 is a sharp correction (e.g., a zigzag), wave 4 is more likely to be a sideways correction (e.g., a flat or triangle)."}, {"id": "b", "letter": "B", "text": "Alternation is a strict rule that, if violated, automatically invalidates the wave count."}, {"id": "c", "letter": "C", "text": "Alternation can also be observed in the relative complexity between waves 1 and 3."}, {"id": "d", "letter": "D", "text": "Alternation guarantees that wave 4 will always specifically be a triangle."}], "correct": ["a", "c"], "expEn": "Alternation is a guideline, not a rule — violating it does not by itself invalidate a count, and it does not force wave 4 into any single specific pattern type. It simply suggests waves 2 and 4 (and sometimes 1 and 3) will tend to differ in character.", "expTh": "alternation เป็นเพียงแนวทาง ไม่ใช่กฎ การละเมิด alternation ไม่ได้ทำให้การนับคลื่นเป็นโมฆะโดยอัตโนมัติ และไม่ได้บังคับว่าคลื่น 4 จะต้องเป็น triangle เสมอไป เพียงแค่บ่งชี้ว่าคลื่น 2 กับ 4 (และบางครั้งคลื่น 1 กับ 3) มักมีแนวโน้มที่มีลักษณะแตกต่างกัน"}, {"id": "v3q12", "text": "A corrective decline shows: wave A subdividing into five waves, wave B retracing 105% of wave A (moving beyond wave A's starting point), and wave C moving well beyond the end of wave A. Which statements are consistent with this description?", "choices": [{"id": "a", "letter": "A", "text": "This matches the definition of a running flat correction."}, {"id": "b", "letter": "B", "text": "Wave B exceeding the start of wave A is a defining feature of the expanded flat variant."}, {"id": "c", "letter": "C", "text": "This structure violates Elliott Wave rules and must be considered invalid."}, {"id": "d", "letter": "D", "text": "This matches the definition of an expanded (irregular) flat correction."}], "correct": ["b", "d"], "expEn": "Wave B exceeding wave A's origin, combined with wave C extending beyond wave A's terminus, is the textbook definition of an expanded flat. A running flat would instead show a truncated wave C that fails to reach wave A's extreme — the opposite of what is described here. Neither scenario violates any Elliott rule.", "expTh": "การที่คลื่น B เคลื่อนเลยจุดเริ่มต้นของคลื่น A ไป ประกอบกับคลื่น C ขยายออกไปเลยจุดสิ้นสุดของคลื่น A คือนิยามตามตำราของ expanded flat ส่วน running flat จะมีลักษณะตรงข้ามคือคลื่น C เกิด truncated ไปไม่ถึงจุดสุดขั้วของคลื่น A ทั้งสองกรณีไม่ได้ละเมิดกฎใด ๆ ของเอลเลียตแต่อย่างใด"}, {"id": "v3q13", "text": "Which of the following are TRUE regarding double and triple combination corrections?", "choices": [{"id": "a", "letter": "A", "text": "The individual component patterns can include any mix of zigzags, flats, and triangles."}, {"id": "b", "letter": "B", "text": "A connecting wave X separates each component pattern from the next."}, {"id": "c", "letter": "C", "text": "A triple combination may end with a triangle as its final component."}, {"id": "d", "letter": "D", "text": "Combinations must always consist of exactly two zigzags and no other pattern types."}], "correct": ["a", "b", "c"], "expEn": "Combinations are flexible: their components can be any mix of simple corrective patterns, always separated by X waves, and frequently terminate in a triangle. There is no requirement that they consist specifically of two zigzags.", "expTh": "รูปแบบผสมมีความยืดหยุ่นสูง องค์ประกอบภายในอาจเป็นการผสมกันของรูปแบบปรับฐานเดี่ยวชนิดใดก็ได้ โดยแยกจากกันด้วยคลื่น X เสมอ และมักจบลงด้วย triangle บ่อยครั้ง ไม่มีข้อกำหนดว่าต้องประกอบด้วย zigzag สองชุดโดยเฉพาะแต่อย่างใด"}, {"id": "v3q14", "text": "For channeling technique, which practices are considered correct methodology?", "choices": [{"id": "a", "letter": "A", "text": "Treating channel lines as an absolute rule that price can never close beyond."}, {"id": "b", "letter": "B", "text": "Ignoring the channel entirely once wave 1 completes."}, {"id": "c", "letter": "C", "text": "Redrawing/adjusting the channel using the waves 2 and 4 endpoints once wave 4 completes, to help project wave 5."}, {"id": "d", "letter": "D", "text": "Drawing an initial trendline connecting the ends of waves 1 and 3, then a parallel line through the end of wave 2."}], "correct": ["c", "d"], "expEn": "Correct channeling methodology involves the initial 1-3 trendline with a parallel line through wave 2, later refined using waves 2 and 4 once available. Channel lines are guidelines for probable termination zones, not rules that price cannot violate, and the technique is used throughout the impulse, not abandoned after wave 1.", "expTh": "วิธีการทำ channeling ที่ถูกต้องคือการลากเส้นแนวโน้มเริ่มต้นเชื่อมคลื่น 1 กับ 3 แล้วลากเส้นขนานผ่านปลายคลื่น 2 จากนั้นปรับปรุงใหม่โดยใช้จุดปลายของคลื่น 2 และ 4 เมื่อคลื่น 4 ก่อตัวเสร็จแล้ว เส้นช่องแนวโน้มเป็นเพียงแนวทางสำหรับโซนสิ้นสุดที่เป็นไปได้ ไม่ใช่กฎที่ราคาห้ามละเมิด และเทคนิคนี้ใช้ตลอดทั้ง impulse ไม่ได้ถูกทิ้งไปหลังจากคลื่น 1 จบ"}, {"id": "v3q15", "text": "Which momentum/oscillator observations are commonly cited as CONFIRMING (not primary) evidence for a completed wave 5 top?", "choices": [{"id": "a", "letter": "A", "text": "Declining volume on the wave 5 advance relative to wave 3."}, {"id": "b", "letter": "B", "text": "Momentum failing to confirm the marginal new price high of wave 5."}, {"id": "c", "letter": "C", "text": "Bearish divergence between price making a new high and the oscillator making a lower high."}, {"id": "d", "letter": "D", "text": "The oscillator reaching its all-time highest reading exactly at the wave 5 peak."}], "correct": ["a", "b", "c"], "expEn": "Divergence, declining volume, and unconfirmed marginal highs are all classic warning signs supporting a wave 5 top interpretation. An oscillator reaching an all-time high exactly at the wave 5 peak would indicate strength and confirmation, not exhaustion, so it contradicts a topping signal.", "expTh": "สัญญาณ divergence ปริมาณการซื้อขายที่ลดลง และการที่โมเมนตัมไม่ยืนยันจุดสูงสุดใหม่ที่เพิ่มขึ้นเพียงเล็กน้อย ล้วนเป็นสัญญาณเตือนคลาสสิกที่สนับสนุนการตีความว่าคลื่น 5 กำลังจะจบลง ส่วนกรณีที่ oscillator ทำจุดสูงสุดตลอดกาลพอดีที่จุดสูงสุดของคลื่น 5 กลับบ่งชี้ถึงความแข็งแกร่งและการยืนยัน ไม่ใช่ความอ่อนแรง จึงขัดแย้งกับสัญญาณการจบคลื่น"}, {"id": "v3q16", "text": "An analyst labels a suspected wave 1 as only three sub-waves, and notes that it overlaps significantly with the subsequent decline. Which interpretations are reasonable?", "choices": [{"id": "a", "letter": "A", "text": "The three-wave subdivision could indicate the move is corrective (e.g., wave A of a larger correction), not a true motive wave 1."}, {"id": "b", "letter": "B", "text": "Overlap always invalidates any possible wave count entirely."}, {"id": "c", "letter": "C", "text": "Any three-wave move can automatically be relabeled as a standard impulse wave 1."}, {"id": "d", "letter": "D", "text": "The structure may actually be a leading diagonal in the wave 1 position."}], "correct": ["a", "d"], "expEn": "A three-wave move with overlap is consistent either with a leading diagonal (a valid, if less common, motive structure) or with the move actually being corrective. It cannot simply be forced into a standard impulse wave 1 label, and overlap does not universally invalidate a count since diagonals explicitly permit it.", "expTh": "การเคลื่อนไหวแบบ 3 คลื่นที่มีการทับซ้อนกัน สอดคล้องได้ทั้งกับการ const VARIANTS = [
  { key:"v1", label:"CEWA I", title:"Elliott Wave Analyst — Level I", tags:["50 Questions","~45-60 min","Single Answer"], bank:BANK.v1, time:55, type:"single" },
  { key:"v2", label:"CEWA II · Part 1", title:"Elliott Wave Analyst — Level II, Part 1", tags:["20 Questions","45 min","Single Answer"], bank:BANK.v2, time:45, type:"single" },
  { key:"v3", label:"CEWA II · Part 2", title:"Elliott Wave Analyst — Level II, Part 2", tags:["20 Questions","45 min","Multi-Select"], bank:BANK.v3, time:45, type:"multi" },
];

const state = {
  selectedVariant: 0,
  shuffled: false,
  activeBank: null,
  activeVariant: null,
  answers: {},          // qid -> [letters]
  startTime: null,
  timerInterval: null,
  remainingSec: 0,
  finished: false,
  reviewLang: "en",
};

/* ---------- helpers ---------- */
function deepCloneQuestion(q){
  return {
    ...q,
    choices: q.choices.map(c => ({...c})),
    correct: [...q.correct]
  };
}
function fisherYates(arr, rnd){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function fmtTime(sec){
  sec = Math.max(0, Math.floor(sec));
  const m = Math.floor(sec / 60).toString().padStart(2,'0');
  const s = (sec % 60).toString().padStart(2,'0');
  return `${m}:${s}`;
}
function showModal(title, text, onConfirm, confirmLabel){
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalText').textContent = text;
  const confirmBtn = document.getElementById('modalConfirm');
  confirmBtn.textContent = confirmLabel || 'Confirm';
  const overlay = document.getElementById('modalOverlay');
  overlay.classList.add('show');
  const cleanup = () => {
    overlay.classList.remove('show');
    confirmBtn.removeEventListener('click', confirmHandler);
    cancelBtn.removeEventListener('click', cancelHandler);
  };
  const cancelBtn = document.getElementById('modalCancel');
  function confirmHandler(){ cleanup(); onConfirm(); }
  function cancelHandler(){ cleanup(); }
  confirmBtn.addEventListener('click', confirmHandler);
  cancelBtn.addEventListener('click', cancelHandler);
}

/* ---------- LOBBY ---------- */
function renderVariantCards(){
  const container = document.getElementById('variantCards');
  container.innerHTML = '';
  VARIANTS.forEach((v, idx) => {
    const card = document.createElement('div');
    card.className = 'variant-card' + (idx === state.selectedVariant ? ' selected' : '');
    card.setAttribute('data-variant-idx', idx);
    card.innerHTML = `
      <div class="vc-top">
        <span class="vc-label">${v.label}</span>
        <span class="vc-radio"></span>
      </div>
      <div class="vc-title">${v.title}</div>
      <div class="vc-tags">${v.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
    `;
    container.appendChild(card);
  });
}
function onVariantCardClick(idx){
  state.selectedVariant = idx;
  renderVariantCards();
}
function toggleShuffle(){
  state.shuffled = !state.shuffled;
  const label = document.getElementById('shuffleLabel');
  const btn = document.getElementById('shuffleBtn');
  label.textContent = state.shuffled ? 'Shuffle: ON' : 'Shuffle: OFF';
  btn.classList.toggle('active', state.shuffled);
}

/* ---------- START EXAM ---------- */
function startExam(){
  const variant = VARIANTS[state.selectedVariant];
  let bank = variant.bank.map(deepCloneQuestion);
  if (state.shuffled){
    const rnd = mulberry32(Date.now() & 0xffffffff);
    bank = fisherYates(bank, rnd);
    bank = bank.map(q => {
      const idxMap = fisherYates(q.choices.map((c,i)=>i), rnd);
      const newChoices = idxMap.map(i => q.choices[i]);
      return {...q, choices: newChoices};
    });
  }
  state.activeBank = bank;
  state.activeVariant = variant;
  state.answers = {};
  state.finished = false;
  state.remainingSec = variant.time * 60;
  state.startTime = Date.now();

  document.getElementById('lobbyScreen').classList.add('hidden');
  document.getElementById('resultsScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.remove('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('submitBar').classList.remove('hidden');

  document.getElementById('quizVariantLabel').textContent = variant.label;
  document.getElementById('quizTitle').textContent = variant.title;

  renderQuestions();
  updateProgress();
  startTimer();
  window.scrollTo(0,0);
}

function renderQuestions(){
  const container = document.getElementById('questionsContainer');
  container.innerHTML = '';
  const isMulti = state.activeVariant.type === 'multi';
  state.activeBank.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'qcard';
    const choicesHtml = q.choices.map(c => {
      const picked = (state.answers[q.id] || []).includes(c.id);
      return `<div class="choice ${isMulti ? '' : 'radio'} ${picked ? 'picked' : ''}"
                data-qid="${q.id}" data-choice-id="${c.id}" data-multi="${isMulti}">
                <span class="choice-marker">${picked ? '✓' : c.letter}</span>
                <span class="choice-text">${c.text}</span>
              </div>`;
    }).join('');
    card.innerHTML = `
      <div class="qnum">Question ${i+1} of ${state.activeBank.length}${isMulti ? ' · Select all that apply' : ''}</div>
      <div class="qtext">${q.text}</div>
      ${choicesHtml}
    `;
    container.appendChild(card);
  });
}

function onChoiceClick(qid, choiceId, isMulti){
  if (!state.answers[qid]) state.answers[qid] = [];
  const arr = state.answers[qid];
  if (isMulti){
    const pos = arr.indexOf(choiceId);
    if (pos >= 0) arr.splice(pos, 1); else arr.push(choiceId);
  } else {
    state.answers[qid] = [choiceId];
  }
  renderQuestions();
  updateProgress();
}

function updateProgress(){
  const total = state.activeBank.length;
  const answered = Object.keys(state.answers).filter(k => state.answers[k].length > 0).length;
  document.getElementById('progressMini').textContent = `${answered} / ${total} answered`;
  document.getElementById('hudProgress').textContent = `${answered}/${total}`;
  document.getElementById('hudBarFill').style.width = `${(answered/total)*100}%`;
}

/* ---------- TIMER ---------- */
function startTimer(){
  clearInterval(state.timerInterval);
  updateHudTime();
  state.timerInterval = setInterval(() => {
    state.remainingSec -= 1;
    updateHudTime();
    if (state.remainingSec <= 0){
      clearInterval(state.timerInterval);
      finishExam();
    }
  }, 1000);
}
function updateHudTime(){
  const elapsed = state.activeVariant.time*60 - state.remainingSec;
  document.getElementById('hudElapsed').textContent = fmtTime(elapsed);
  const remEl = document.getElementById('hudRemaining');
  remEl.textContent = fmtTime(state.remainingSec);
  remEl.classList.remove('warn','danger');
  if (state.remainingSec <= 60) remEl.classList.add('danger');
  else if (state.remainingSec <= 300) remEl.classList.add('warn');
}

/* ---------- SUBMIT / FINISH ---------- */
function requestSubmit(){
  const total = state.activeBank.length;
  const answered = Object.keys(state.answers).filter(k => state.answers[k].length > 0).length;
  if (answered < total){
    showModal(
      'Submit exam?',
      `You have ${total - answered} unanswered question(s). Submit anyway?`,
      finishExam,
      'Submit anyway'
    );
  } else {
    showModal('Submit exam?', 'You are about to submit your final answers.', finishExam, 'Submit');
  }
}

function finishExam(){
  if (state.finished) return;
  state.finished = true;
  clearInterval(state.timerInterval);
  const elapsedSec = state.activeVariant.time*60 - state.remainingSec;

  let correctCount = 0;
  state.activeBank.forEach(q => {
    const picked = (state.answers[q.id] || []).slice().sort();
    const correct = q.correct.slice().sort();
    const isCorrect = picked.length === correct.length && picked.every((v,i) => v === correct[i]);
    if (isCorrect) correctCount++;
  });
  const total = state.activeBank.length;
  const pct = Math.round((correctCount/total)*100);

  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('submitBar').classList.add('hidden');
  document.getElementById('resultsScreen').classList.remove('hidden');
  document.getElementById('resultsScreen').classList.add('fade-in');

  renderResults(correctCount, total, pct, elapsedSec);
  window.scrollTo(0,0);
}

function renderResults(correctCount, total, pct, elapsedSec){
  const badge = document.getElementById('resultBadge');
  let grade, cls;
  if (pct < 80){ grade = 'FAIL'; cls = 'fail'; }
  else if (pct < 90){ grade = 'PASS'; cls = 'pass'; }
  else { grade = 'CEWA MASTER'; cls = 'master'; }
  badge.textContent = `${grade} · ${pct}%`;
  badge.className = 'badge ' + cls;

  const circumference = 2 * Math.PI * 78;
  const ring = document.getElementById('scoreRingFill');
  ring.setAttribute('stroke-dasharray', circumference);
  ring.setAttribute('stroke-dashoffset', circumference - (pct/100)*circumference);
  ring.style.stroke = cls === 'fail' ? 'var(--red)' : cls === 'pass' ? 'var(--blue)' : 'var(--lime)';

  document.getElementById('scoreBig').textContent = pct + '%';
  document.getElementById('scoreSmall').textContent = `${correctCount} / ${total} correct`;
  document.getElementById('statCorrect').textContent = correctCount;
  document.getElementById('statWrong').textContent = total - correctCount;
  document.getElementById('statTime').textContent = fmtTime(elapsedSec);

  renderReview();
}

function renderReview(){
  const container = document.getElementById('reviewContainer');
  container.innerHTML = '';
  state.activeBank.forEach((q, i) => {
    const picked = state.answers[q.id] || [];
    const correct = q.correct;
    const isCorrect = picked.slice().sort().join(',') === correct.slice().sort().join(',');
    const item = document.createElement('div');
    item.className = 'review-item';
    item.setAttribute('data-review-idx', i);

    const choicesHtml = q.choices.map(c => {
      const wasCorrect = correct.includes(c.id);
      const wasPicked = picked.includes(c.id);
      let cls = '';
      if (wasCorrect) cls = 'was-correct';
      else if (wasPicked && !wasCorrect) cls = 'was-wrong-pick';
      return `<div class="review-choice ${cls}">${c.letter}. ${c.text}${wasCorrect ? ' ✓' : (wasPicked ? ' ✗' : '')}</div>`;
    }).join('');

    const exp = state.reviewLang === 'en' ? q.expEn : q.expTh;

    item.innerHTML = `
      <div class="review-head" data-toggle-idx="${i}">
        <span class="review-status ${isCorrect ? 'correct' : 'incorrect'}">${isCorrect ? '✓' : '✗'}</span>
        <span class="review-qtext">Q${i+1}. ${q.text}</span>
        <span class="review-chevron">▾</span>
      </div>
      <div class="review-body">
        <div class="review-body-inner">
          ${choicesHtml}
          <div class="review-exp">${exp}</div>
        </div>
      </div>
    `;
    container.appendChild(item);
  });
}

function toggleReviewItem(idx){
  const item = document.querySelector(`.review-item[data-review-idx="${idx}"]`);
  if (item) item.classList.toggle('open');
}

function setReviewLang(lang){
  state.reviewLang = lang;
  document.getElementById('tabEn').classList.toggle('active', lang === 'en');
  document.getElementById('tabTh').classList.toggle('active', lang === 'th');
  renderReview();
}

/* ---------- BACK / RETAKE ---------- */
function goToLobby(){
  clearInterval(state.timerInterval);
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('resultsScreen').classList.add('hidden');
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('submitBar').classList.add('hidden');
  document.getElementById('lobbyScreen').classList.remove('hidden');
  window.scrollTo(0,0);
}
function requestBack(){
  const quizVisible = !document.getElementById('quizScreen').classList.contains('hidden');
  if (quizVisible && !state.finished){
    showModal('Leave exam?', 'Your progress on this attempt will be lost.', goToLobby, 'Leave');
  } else {
    goToLobby();
  }
}

/* ---------- EVENT DELEGATION (named functions, no inline onclick strings) ---------- */
document.getElementById('variantCards').addEventListener('click', function(e){
  const card = e.target.closest('[data-variant-idx]');
  if (card) onVariantCardClick(parseInt(card.getAttribute('data-variant-idx'), 10));
});
document.getElementById('shuffleBtn').addEventListener('click', toggleShuffle);
document.getElementById('startBtn').addEventListener('click', startExam);
document.getElementById('backBtn').addEventListener('click', requestBack);
document.getElementById('submitBtn').addEventListener('click', requestSubmit);
document.getElementById('retakeBtn').addEventListener('click', goToLobby);
document.getElementById('questionsContainer').addEventListener('click', function(e){
  const choice = e.target.closest('[data-qid]');
  if (choice){
    onChoiceClick(choice.getAttribute('data-qid'), choice.getAttribute('data-choice-id'), choice.getAttribute('data-multi') === 'true');
  }
});
document.getElementById('reviewContainer').addEventListener('click', function(e){
  const head = e.target.closest('[data-toggle-idx]');
  if (head) toggleReviewItem(parseInt(head.getAttribute('data-toggle-idx'), 10));
});
document.getElementById('tabEn').addEventListener('click', function(){ setReviewLang('en'); });
document.getElementById('tabTh').addEventListener('click', function(){ setReviewLang('th'); });

/* ---------- INIT ---------- */
renderVariantCards();
</script>
</body>
</html>
