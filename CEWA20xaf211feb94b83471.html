<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>CEWA20 — SPACEZ Exam Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#111111;
  --surface:#1a1a1a;
  --border:#2e2e2e;
  --lime:#c8f135;
  --text:#f0f0f0;
  --muted:#777;
  --radius:14px;
  --red:#ff4d4d;
  --green:#4dff91;
  --yellow:#ffd84d;
  --blue:#4d9fff;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Thai',sans-serif;}
body{min-height:100vh;}
.mono{font-family:'IBM Plex Mono',monospace;}
::selection{background:var(--lime);color:#111;}

/* ===== Topbar ===== */
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;background:rgba(17,17,17,.9);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;letter-spacing:.5px;}
.brand span{
  display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;border-radius:8px;background:var(--lime);color:#111;font-weight:700;
}
.back-btn{
  background:none;border:1px solid var(--border);color:var(--muted);
  padding:7px 12px;border-radius:10px;font-family:'IBM Plex Mono',monospace;font-size:12px;cursor:pointer;
}
.back-btn:hover{color:var(--text);border-color:var(--muted);}

.wrap{max-width:640px;margin:0 auto;padding:0 18px 90px;}

/* ===== Lobby ===== */
.header{padding:34px 0 20px;text-align:center;}
.eyebrow{
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:2px;color:var(--lime);
  text-transform:uppercase;margin-bottom:10px;
}
.title-gradient{
  font-size:30px;font-weight:700;line-height:1.15;margin:0 0 10px;
  background:linear-gradient(90deg,#c8f135,#4dff91,#4d9fff,#c8f135);
  background-size:300% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:gradientMove 6s linear infinite;
}
@keyframes gradientMove{0%{background-position:0% 50%;}100%{background-position:300% 50%;}}
.subtitle{color:var(--muted);font-size:14px;line-height:1.5;}

.variant-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 16px;margin-bottom:12px;cursor:pointer;transition:.15s;position:relative;
}
.variant-card:active{transform:scale(.99);}
.variant-card.selected{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime) inset;}
.vc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.vc-label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--lime);letter-spacing:1px;text-transform:uppercase;}
.vc-radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;position:relative;}
.variant-card.selected .vc-radio{border-color:var(--lime);}
.variant-card.selected .vc-radio::after{
  content:'';position:absolute;inset:3px;border-radius:50%;background:var(--lime);
}
.vc-title{font-size:16px;font-weight:600;margin-bottom:8px;}
.vc-tags{display:flex;gap:6px;flex-wrap:wrap;}
.tag{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);
  border:1px solid var(--border);padding:3px 8px;border-radius:20px;
}

.controls-row{display:flex;gap:10px;margin:18px 0 10px;}
.shuffle-btn{
  flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text);
  padding:13px;border-radius:12px;font-family:'IBM Plex Mono',monospace;font-size:13px;
  display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
}
.shuffle-btn.active{border-color:var(--lime);color:var(--lime);}
.start-btn{
  width:100%;background:var(--lime);color:#111;border:none;padding:16px;
  border-radius:12px;font-size:15px;font-weight:700;letter-spacing:.5px;cursor:pointer;
  font-family:'IBM Plex Mono',monospace;
}
.start-btn:disabled{opacity:.4;}
.start-btn:active{transform:scale(.98);}

/* ===== Quiz Screen ===== */
.quiz-header{padding:16px 0 6px;}
.quiz-variant-label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--lime);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;}
.quiz-title{font-size:18px;font-weight:600;}

.qcard{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;margin:14px 0;
}
.qnum{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);margin-bottom:8px;}
.qtext{font-size:15.5px;line-height:1.55;margin-bottom:14px;}
.choice{
  display:flex;align-items:flex-start;gap:10px;padding:12px 12px;border:1px solid var(--border);
  border-radius:10px;margin-bottom:8px;cursor:pointer;transition:.12s;
}
.choice:active{transform:scale(.99);}
.choice.picked{border-color:var(--lime);background:rgba(200,241,53,.06);}
.choice-marker{
  width:22px;height:22px;border-radius:6px;border:2px solid var(--border);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;color:var(--muted);
  margin-top:1px;
}
.choice.radio .choice-marker{border-radius:50%;}
.choice.picked .choice-marker{border-color:var(--lime);background:var(--lime);color:#111;}
.choice-text{font-size:14px;line-height:1.5;flex:1;}

.hud{
  position:fixed;bottom:78px;right:16px;z-index:35;
  background:rgba(26,26,26,.92);backdrop-filter:blur(8px);border:1px solid var(--border);
  border-radius:14px;padding:10px 14px;font-family:'IBM Plex Mono',monospace;font-size:11px;
  min-width:128px;box-shadow:0 8px 24px rgba(0,0,0,.4);
}
.hud-row{display:flex;justify-content:space-between;gap:14px;margin:2px 0;}
.hud-label{color:var(--muted);}
.hud-time{font-weight:600;}
.hud-time.warn{color:var(--yellow);}
.hud-time.danger{color:var(--red);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.hud-bar{height:4px;background:var(--border);border-radius:2px;margin-top:8px;overflow:hidden;}
.hud-bar-fill{height:100%;background:var(--lime);transition:width .3s;}

.submit-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:36;
  background:rgba(17,17,17,.95);backdrop-filter:blur(10px);border-top:1px solid var(--border);
  padding:12px 18px calc(12px + env(safe-area-inset-bottom));
}
.submit-bar-inner{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center;}
.progress-mini{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);white-space:nowrap;}
.submit-btn{
  flex:1;background:var(--lime);color:#111;border:none;padding:14px;border-radius:12px;
  font-weight:700;font-size:14px;cursor:pointer;font-family:'IBM Plex Mono',monospace;
}
.submit-btn:active{transform:scale(.98);}

/* ===== Modal (never window.confirm - LINE/in-app browser safe) ===== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:60;
  display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:.2s;
}
.modal-overlay.show{opacity:1;pointer-events:auto;}
.modal-box{
  background:var(--surface);border:1px solid var(--border);border-radius:18px 18px 0 0;
  padding:22px 20px calc(22px + env(safe-area-inset-bottom));width:100%;max-width:640px;
  transform:translateY(20px);transition:.2s;
}
.modal-overlay.show .modal-box{transform:translateY(0);}
.modal-title{font-size:16px;font-weight:700;margin-bottom:6px;}
.modal-text{font-size:13.5px;color:var(--muted);line-height:1.5;margin-bottom:18px;}
.modal-actions{display:flex;gap:10px;}
.modal-btn{flex:1;padding:13px;border-radius:10px;font-weight:600;font-size:13.5px;cursor:pointer;border:1px solid var(--border);font-family:'IBM Plex Sans Thai',sans-serif;}
.modal-btn.cancel{background:none;color:var(--text);}
.modal-btn.confirm{background:var(--lime);color:#111;border-color:var(--lime);}

/* ===== Results Screen ===== */
.result-hero{text-align:center;padding:30px 0 10px;}
.badge{
  display:inline-block;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:12px;
  letter-spacing:2px;padding:6px 16px;border-radius:20px;margin-bottom:16px;text-transform:uppercase;
}
.badge.fail{background:rgba(255,77,77,.15);color:var(--red);}
.badge.pass{background:rgba(77,159,255,.15);color:var(--blue);}
.badge.master{background:rgba(200,241,53,.15);color:var(--lime);}

.score-ring-wrap{position:relative;width:180px;height:180px;margin:0 auto 18px;}
.score-pct{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;font-family:'IBM Plex Mono',monospace;
}
.score-pct .big{font-size:38px;font-weight:700;}
.score-pct .small{font-size:11px;color:var(--muted);margin-top:2px;}

.stats-row{display:flex;gap:10px;margin:18px 0;}
.stat{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;}
.stat .n{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:700;}
.stat .l{font-size:10.5px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.5px;}

.review-tabs{display:flex;gap:8px;margin:22px 0 12px;}
.review-tab{
  flex:1;text-align:center;padding:10px;border-radius:10px;border:1px solid var(--border);
  font-family:'IBM Plex Mono',monospace;font-size:13px;cursor:pointer;color:var(--muted);
}
.review-tab.active{border-color:var(--lime);color:var(--lime);}

.review-item{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  margin-bottom:10px;overflow:hidden;
}
.review-head{padding:14px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.review-status{
  width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;
}
.review-status.correct{background:rgba(77,255,145,.15);color:var(--green);}
.review-status.incorrect{background:rgba(255,77,77,.15);color:var(--red);}
.review-qtext{font-size:13.5px;flex:1;line-height:1.4;}
.review-chevron{color:var(--muted);transition:.2s;flex-shrink:0;}
.review-item.open .review-chevron{transform:rotate(180deg);}
.review-body{max-height:0;overflow:hidden;transition:.25s;}
.review-item.open .review-body{max-height:2000px;}
.review-body-inner{padding:0 16px 16px;}
.review-choice{padding:8px 10px;border-radius:8px;font-size:13px;margin-bottom:5px;border:1px solid var(--border);}
.review-choice.was-correct{border-color:var(--green);background:rgba(77,255,145,.06);}
.review-choice.was-wrong-pick{border-color:var(--red);background:rgba(255,77,77,.06);}
.review-exp{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}

.retake-btn{
  width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);
  padding:15px;border-radius:12px;font-weight:700;font-family:'IBM Plex Mono',monospace;
  font-size:14px;cursor:pointer;margin-top:22px;
}

.hidden{display:none !important;}
.fade-in{animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span>S</span>SPACEZ exam hub</div>
  <button class="back-btn" id="backBtn">← Back</button>
</div>

<!-- ============ LOBBY ============ -->
<div class="wrap" id="lobbyScreen">
  <div class="header">
    <div class="eyebrow">CEWA20 · Mock Exam</div>
    <h1 class="title-gradient">CEWA Mock Exam</h1>
    <div class="subtitle">Certified Elliott Wave Analyst — choose a variant to begin</div>
  </div>

  <div id="variantCards"></div>

  <div class="controls-row">
    <button class="shuffle-btn" id="shuffleBtn">
      <span id="shuffleIcon">🎲</span> <span id="shuffleLabel">Shuffle: OFF</span>
    </button>
  </div>
  <button class="start-btn" id="startBtn">START EXAM</button>
</div>

<!-- ============ QUIZ ============ -->
<div class="wrap hidden" id="quizScreen">
  <div class="quiz-header">
    <div class="quiz-variant-label" id="quizVariantLabel"></div>
    <div class="quiz-title" id="quizTitle"></div>
  </div>
  <div id="questionsContainer"></div>
</div>

<div class="hud hidden" id="hud">
  <div class="hud-row"><span class="hud-label">Elapsed</span><span class="mono" id="hudElapsed">00:00</span></div>
  <div class="hud-row"><span class="hud-label">Remaining</span><span class="hud-time mono" id="hudRemaining">00:00</span></div>
  <div class="hud-row"><span class="hud-label">Progress</span><span class="mono" id="hudProgress">0/0</span></div>
  <div class="hud-bar"><div class="hud-bar-fill" id="hudBarFill" style="width:0%"></div></div>
</div>

<div class="submit-bar hidden" id="submitBar">
  <div class="submit-bar-inner">
    <span class="progress-mini" id="progressMini">0 / 0 answered</span>
    <button class="submit-btn" id="submitBtn">SUBMIT EXAM</button>
  </div>
</div>

<!-- ============ RESULTS ============ -->
<div class="wrap hidden" id="resultsScreen">
  <div class="result-hero">
    <span class="badge" id="resultBadge"></span>
    <div class="score-ring-wrap">
      <svg width="180" height="180" viewBox="0 0 180 180">
        <circle cx="90" cy="90" r="78" fill="none" stroke="var(--border)" stroke-width="12"/>
        <circle id="scoreRingFill" cx="90" cy="90" r="78" fill="none" stroke="var(--lime)" stroke-width="12"
          stroke-linecap="round" stroke-dasharray="490" stroke-dashoffset="490" transform="rotate(-90 90 90)"/>
      </svg>
      <div class="score-pct">
        <span class="big" id="scoreBig">0%</span>
        <span class="small" id="scoreSmall">0 / 0 correct</span>
      </div>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat"><div class="n" id="statCorrect">0</div><div class="l">Correct</div></div>
    <div class="stat"><div class="n" id="statWrong">0</div><div class="l">Incorrect</div></div>
    <div class="stat"><div class="n" id="statTime">00:00</div><div class="l">Time</div></div>
  </div>

  <div class="review-tabs">
    <div class="review-tab active" id="tabEn" data-lang="en">🇬🇧 English</div>
    <div class="review-tab" id="tabTh" data-lang="th">🇹🇭 ภาษาไทย</div>
  </div>

  <div id="reviewContainer"></div>

  <button class="retake-btn" id="retakeBtn">RETAKE / CHOOSE ANOTHER VARIANT</button>
</div>

<!-- ============ MODAL ============ -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">Submit exam?</div>
    <div class="modal-text" id="modalText">You still have unanswered questions.</div>
    <div class="modal-actions">
      <button class="modal-btn cancel" id="modalCancel">Cancel</button>
      <button class="modal-btn confirm" id="modalConfirm">Confirm</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   SPACEZ CEWA20 — bank injected as JSON, deep-cloned before use
   ============================================================ */
const BANK = {"v1": [{"id": "v1q01", "text": "In a standard Elliott impulse wave, which of the following is an ABSOLUTE RULE governing wave 2?", "choices": [{"id": "a", "letter": "A", "text": "Wave 2 must retrace at least 50% of wave 1."}, {"id": "b", "letter": "B", "text": "Wave 2 must be shorter in time than wave 1."}, {"id": "c", "letter": "C", "text": "Wave 2 can never retrace more than 100% of wave 1."}, {"id": "d", "letter": "D", "text": "Wave 2 can never retrace more than 61.8% of wave 1."}], "correct": ["c"], "expEn": "Elliott Wave theory has only three hard rules for impulse waves. One states wave 2 cannot retrace beyond the starting point of wave 1 (100% retracement), or the pattern is not a valid wave 2. The 61.8% figure and the 'must retrace at least 50%' idea are common guidelines/misconceptions, not rules, and there is no rule about relative duration.", "expTh": "ทฤษฎีคลื่นเอลเลียตมีกฎเหล็กเพียง 3 ข้อสำหรับคลื่น impulse หนึ่งในนั้นคือคลื่น 2 ห้ามย้อนกลับเกินจุดเริ่มต้นของคลื่น 1 (เกิน 100%) มิฉะนั้นจะไม่ใช่คลื่น 2 ที่ถูกต้อง ส่วนตัวเลข 61.8% หรือ 'ต้องย้อนอย่างน้อย 50%' เป็นเพียงแนวทาง (guideline) ไม่ใช่กฎ และไม่มีกฎเรื่องระยะเวลาเปรียบเทียบกับคลื่น 1 แต่อย่างใด"}, {"id": "v1q02", "text": "Which of the following is an absolute rule (not merely a guideline) concerning wave 3 of an impulse?", "choices": [{"id": "a", "letter": "A", "text": "Wave 3 can never be the shortest of the three actionable waves (1, 3, and 5)."}, {"id": "b", "letter": "B", "text": "Wave 3 must always be the longest of the five waves."}, {"id": "c", "letter": "C", "text": "Wave 3 must subdivide into exactly five sub-waves of equal length."}, {"id": "d", "letter": "D", "text": "Wave 3 must exceed 161.8% of wave 1 in length."}], "correct": ["a"], "expEn": "The second hard rule states wave 3 is never the shortest among waves 1, 3, and 5. It is very often the longest, but that is only typical, not required. There is no rule fixing wave 3 at 161.8% of wave 1 or requiring equal-length sub-waves.", "expTh": "กฎเหล็กข้อที่สองระบุว่าคลื่น 3 จะไม่มีวันสั้นที่สุดในบรรดาคลื่น 1, 3 และ 5 แม้ในทางปฏิบัติคลื่น 3 มักจะยาวที่สุด แต่นั่นเป็นเพียงลักษณะทั่วไป ไม่ใช่ข้อบังคับ และไม่มีกฎที่กำหนดตายตัวว่าคลื่น 3 ต้องยาว 161.8% ของคลื่น 1 หรือคลื่นย่อยต้องยาวเท่ากัน"}, {"id": "v1q03", "text": "What does the third absolute rule of impulse waves state about wave 4?", "choices": [{"id": "a", "letter": "A", "text": "Wave 4 must retrace less than wave 2 in percentage terms."}, {"id": "b", "letter": "B", "text": "Wave 4 must always take the form of a triangle."}, {"id": "c", "letter": "C", "text": "Wave 4 must be equal in duration to wave 2."}, {"id": "d", "letter": "D", "text": "Wave 4 may not enter the price territory of wave 1 (in non-leveraged cash markets)."}], "correct": ["d"], "expEn": "The third rule states wave 4 cannot overlap the price territory of wave 1, except in diagonal triangles or leveraged/futures markets where overlap is tolerated by some analysts. Wave 4's shape, its retracement relative to wave 2, and its duration are all guidelines, not rules.", "expTh": "กฎเหล็กข้อที่สามระบุว่าคลื่น 4 ห้ามเข้าไปในอาณาเขตราคาของคลื่น 1 (ยกเว้นในรูปแบบ diagonal หรือในตลาดที่มีเลเวอเรจซึ่งนักวิเคราะห์บางส่วนยอมรับการทับซ้อนได้) ส่วนรูปร่างของคลื่น 4 การย้อนเทียบกับคลื่น 2 และระยะเวลา ล้วนเป็นแนวทางทั่วไป ไม่ใช่กฎบังคับ"}, {"id": "v1q04", "text": "How many waves does a completed motive (impulse) wave subdivide into at the next lower degree?", "choices": [{"id": "a", "letter": "A", "text": "Nine"}, {"id": "b", "letter": "B", "text": "Five"}, {"id": "c", "letter": "C", "text": "Three"}, {"id": "d", "letter": "D", "text": "Seven"}], "correct": ["b"], "expEn": "A motive wave always subdivides into five waves at the next lower degree (1-2-3-4-5), three of which move in the direction of the trend and two of which correct against it.", "expTh": "คลื่น motive จะแบ่งย่อยเป็น 5 คลื่นเสมอในดีกรีที่เล็กลงหนึ่งขั้น (1-2-3-4-5) โดย 3 คลื่นเคลื่อนไปตามทิศทางเทรนด์หลัก และ 2 คลื่นเป็นคลื่นปรับฐานสวนทาง"}, {"id": "v1q05", "text": "Which waves in a standard five-wave impulse move against the trend of the next higher degree?", "choices": [{"id": "a", "letter": "A", "text": "Waves 3 and 5"}, {"id": "b", "letter": "B", "text": "Waves 1 and 3"}, {"id": "c", "letter": "C", "text": "Only wave 3"}, {"id": "d", "letter": "D", "text": "Waves 2 and 4"}], "correct": ["d"], "expEn": "Within a five-wave impulse, waves 1, 3, and 5 are motive (trend-following) waves, while waves 2 and 4 are corrective waves that move against the larger trend before it resumes.", "expTh": "ในคลื่น impulse 5 คลื่น คลื่น 1, 3 และ 5 เป็นคลื่น motive ที่เคลื่อนไปตามเทรนด์หลัก ส่วนคลื่น 2 และ 4 เป็นคลื่นปรับฐานที่เคลื่อนสวนทางเทรนด์ใหญ่ก่อนที่เทรนด์จะกลับมาดำเนินต่อ"}, {"id": "v1q06", "text": "In Elliott Wave Theory, motive waves move in which direction relative to the trend of one larger degree?", "choices": [{"id": "a", "letter": "A", "text": "Perpendicular to the trend of one larger degree"}, {"id": "b", "letter": "B", "text": "The same direction as the trend of one larger degree"}, {"id": "c", "letter": "C", "text": "Against the trend of one larger degree"}, {"id": "d", "letter": "D", "text": "Independently, with no fixed relationship to the larger trend"}], "correct": ["b"], "expEn": "By definition, a motive wave always advances the market in the direction of the trend of one larger degree, which is what distinguishes it structurally and functionally from a corrective wave.", "expTh": "ตามนิยาม คลื่น motive จะเคลื่อนไปในทิศทางเดียวกับเทรนด์ของดีกรีที่ใหญ่กว่าหนึ่งขั้นเสมอ ซึ่งเป็นจุดที่ทำให้แตกต่างจากคลื่นปรับฐานทั้งในเชิงโครงสร้างและหน้าที่"}, {"id": "v1q07", "text": "A diagonal triangle is a special motive-wave structure that is only permitted to appear in which wave position(s)?", "choices": [{"id": "a", "letter": "A", "text": "Wave 4 only"}, {"id": "b", "letter": "B", "text": "Wave B only"}, {"id": "c", "letter": "C", "text": "Wave 3 only"}, {"id": "d", "letter": "D", "text": "Wave 5 or wave C"}], "correct": ["d"], "expEn": "Diagonal triangles are the one exception to normal impulse rules (they allow overlap between waves 1 and 4) and are only found in terminal, trend-ending positions: wave 5 of an impulse, or wave C of a corrective pattern (or wave 1/A as a 'leading' diagonal).", "expTh": "diagonal triangle เป็นข้อยกเว้นเดียวของกฎ impulse ปกติ (ยอมให้คลื่น 1 กับ 4 ทับซ้อนกันได้) และจะปรากฏเฉพาะในตำแหน่งท้ายเทรนด์เท่านั้น คือคลื่น 5 ของ impulse หรือคลื่น C ของรูปแบบปรับฐาน (หรือคลื่น 1/A ในรูปแบบ leading diagonal)"}, {"id": "v1q08", "text": "What structurally distinguishes an ending diagonal triangle from a standard impulse wave?", "choices": [{"id": "a", "letter": "A", "text": "A diagonal always retraces 100% of the move that preceded it."}, {"id": "b", "letter": "B", "text": "A diagonal always has an extended wave 3."}, {"id": "c", "letter": "C", "text": "In a diagonal, waves 1 and 4 overlap, and the pattern commonly consists of overlapping three-wave subdivisions."}, {"id": "d", "letter": "D", "text": "A diagonal cannot appear at the end of a trend."}], "correct": ["c"], "expEn": "Unlike a standard impulse, an ending diagonal permits wave 1/4 overlap and its five sub-waves typically each subdivide into three waves (3-3-3-3-3), giving it a wedge-shaped, overlapping look rather than the clean five-wave look of a normal impulse.", "expTh": "ต่างจาก impulse ปกติ ending diagonal ยอมให้คลื่น 1 และ 4 ทับซ้อนกันได้ และคลื่นย่อยทั้ง 5 มักแบ่งเป็น 3 คลื่นย่อยแต่ละคลื่น (3-3-3-3-3) ทำให้มีลักษณะเป็นรูปลิ่มที่ทับซ้อนกัน ต่างจาก impulse ปกติที่มีลักษณะ 5 คลื่นที่ชัดเจนไม่ทับซ้อน"}, {"id": "v1q09", "text": "Which of the following best describes an 'extended' wave in Elliott Wave Theory?", "choices": [{"id": "a", "letter": "A", "text": "An elongated impulse wave with exaggerated subdivisions, most commonly occurring in wave 3."}, {"id": "b", "letter": "B", "text": "A fifth wave that fails to exceed the high of wave 3."}, {"id": "c", "letter": "C", "text": "A pattern where wave 2 becomes longer than wave 1."}, {"id": "d", "letter": "D", "text": "A corrective wave that exceeds 100% retracement of the prior impulse."}], "correct": ["a"], "expEn": "An extension is an elongated motive wave with unusually pronounced subdivisions, making that wave's internal structure easy to spot on the chart. Extensions most commonly occur in wave 3 of an impulse, though wave 1 or wave 5 can occasionally extend instead.", "expTh": "extension คือคลื่น motive ที่ยืดยาวผิดปกติ โดยมีคลื่นย่อยภายในที่เด่นชัดมากจนสังเกตเห็นได้ง่ายบนกราฟ โดยส่วนใหญ่มักเกิดที่คลื่น 3 ของ impulse แต่บางครั้งก็อาจเกิดที่คลื่น 1 หรือคลื่น 5 แทนได้เช่นกัน"}, {"id": "v1q10", "text": "In a typical impulse wave, how many of the three actionable waves (1, 3, and 5) usually extend?", "choices": [{"id": "a", "letter": "A", "text": "Only one"}, {"id": "b", "letter": "B", "text": "None, extensions never occur within a single impulse"}, {"id": "c", "letter": "C", "text": "All three"}, {"id": "d", "letter": "D", "text": "Two"}], "correct": ["a"], "expEn": "As a guideline, only one of the three motive waves (1, 3, or 5) within a single impulse typically extends. The other two tend to display similarity in length and structure, which is also the basis for the wave-equality guideline.", "expTh": "โดยทั่วไปในคลื่น impulse หนึ่งชุด จะมีคลื่น motive เพียงหนึ่งใน 3 คลื่น (1, 3 หรือ 5) เท่านั้นที่ยืดออก (extend) ส่วนอีกสองคลื่นมักมีความยาวและโครงสร้างใกล้เคียงกัน ซึ่งเป็นที่มาของแนวทาง wave equality guideline"}, {"id": "v1q11", "text": "What is meant by 'wave failure' or a 'truncated fifth wave'?", "choices": [{"id": "a", "letter": "A", "text": "When wave 5 exceeds 161.8% of wave 1."}, {"id": "b", "letter": "B", "text": "When wave 5 fails to move beyond the price extreme of wave 3."}, {"id": "c", "letter": "C", "text": "When wave 5 subdivides into only three waves instead of five."}, {"id": "d", "letter": "D", "text": "When wave 5 becomes the longest wave of the impulse."}], "correct": ["b"], "expEn": "A truncated fifth wave (wave failure) occurs when wave 5 does not surpass the extreme reached by wave 3, despite still subdividing into a valid five-wave structure. It often signals underlying weakness and typically follows an unusually strong wave 3.", "expTh": "truncated fifth wave หรือ wave failure เกิดขึ้นเมื่อคลื่น 5 ไม่สามารถเคลื่อนที่เลยจุดสุดขั้วของคลื่น 3 ได้ ทั้งที่ยังคงมีโครงสร้างภายในครบ 5 คลื่นที่ถูกต้อง ปรากฏการณ์นี้มักบ่งชี้ถึงความอ่อนแรงของเทรนด์ และมักเกิดตามหลังคลื่น 3 ที่แข็งแกร่งผิดปกติ"}, {"id": "v1q12", "text": "According to the guideline of equality, waves 1 and 5 tend to be related by equality or the 0.618 ratio under which condition?", "choices": [{"id": "a", "letter": "A", "text": "Only when wave 5 fails to reach a new extreme."}, {"id": "b", "letter": "B", "text": "Only when wave 1 is extended."}, {"id": "c", "letter": "C", "text": "In every impulse wave, without exception."}, {"id": "d", "letter": "D", "text": "When wave 3 is the extended wave."}], "correct": ["d"], "expEn": "The guideline of equality states that when wave 3 extends, waves 1 and 5 tend toward equality in price and time, or wave 5 relates to wave 1 by the 0.618 ratio. This does not hold universally across all impulses.", "expTh": "แนวทาง guideline of equality ระบุว่าเมื่อคลื่น 3 เป็นคลื่นที่ยืดออก คลื่น 1 และคลื่น 5 มักมีแนวโน้มเท่ากันทั้งในแง่ราคาและเวลา หรือคลื่น 5 มีความสัมพันธ์กับคลื่น 1 ด้วยอัตราส่วน 0.618 ซึ่งไม่ได้เป็นจริงเสมอไปในทุก impulse"}, {"id": "v1q13", "text": "What is the primary analytical purpose of the channeling technique in Elliott Wave analysis?", "choices": [{"id": "a", "letter": "A", "text": "To confirm whether wave 1 is a leading diagonal."}, {"id": "b", "letter": "B", "text": "To count the internal subdivisions of wave 2."}, {"id": "c", "letter": "C", "text": "To help forecast the probable termination point (price target) of wave 4 or wave 5."}, {"id": "d", "letter": "D", "text": "To determine the exact time duration of wave 3."}], "correct": ["c"], "expEn": "Channeling draws trendlines connecting wave extremes (e.g., ends of waves 1 and 3, with a parallel line through wave 2) to project where wave 4 or wave 5 is likely to end, giving analysts a visual price target that supplements Fibonacci analysis.", "expTh": "เทคนิค channeling คือการลากเส้นแนวโน้มเชื่อมจุดสุดขั้วของคลื่น (เช่น ปลายคลื่น 1 กับ 3 แล้วลากเส้นขนานผ่านปลายคลื่น 2) เพื่อคาดการณ์ว่าคลื่น 4 หรือคลื่น 5 น่าจะจบที่ใด ช่วยให้นักวิเคราะห์มีเป้าหมายราคาเชิงภาพเสริมจากการวิเคราะห์ Fibonacci"}, {"id": "v1q14", "text": "Which guideline observes that wave 4 often terminates near the price area of the fourth wave of one lesser degree within wave 3?", "choices": [{"id": "a", "letter": "A", "text": "The channeling guideline."}, {"id": "b", "letter": "B", "text": "The equality guideline."}, {"id": "c", "letter": "C", "text": "The 'previous fourth wave' price congruence guideline."}, {"id": "d", "letter": "D", "text": "The alternation guideline."}], "correct": ["c"], "expEn": "A well-known guideline notes that wave 4 frequently ends near the territory of the fourth wave of one lesser degree found within wave 3, giving analysts another practical target zone distinct from alternation, channeling, or equality.", "expTh": "มีแนวทางที่รู้จักกันดีระบุว่าคลื่น 4 มักจบลงใกล้บริเวณของคลื่น 4 ดีกรีย่อยที่อยู่ภายในคลื่น 3 ซึ่งเป็นโซนเป้าหมายเชิงปฏิบัติอีกแบบหนึ่งที่แตกต่างจาก alternation, channeling หรือ equality guideline"}, {"id": "v1q15", "text": "A single zigzag corrective pattern subdivides into which internal wave structure?", "choices": [{"id": "a", "letter": "A", "text": "3-3-5"}, {"id": "b", "letter": "B", "text": "3-3-3"}, {"id": "c", "letter": "C", "text": "5-3-3"}, {"id": "d", "letter": "D", "text": "5-3-5 (waves A-B-C)"}], "correct": ["d"], "expEn": "A zigzag is labeled A-B-C, where wave A subdivides into five waves, wave B into three waves, and wave C into five waves again — a 5-3-5 structure, distinguishing it from the 3-3-5 structure of a flat.", "expTh": "zigzag มีป้ายกำกับ A-B-C โดยคลื่น A แบ่งเป็น 5 คลื่นย่อย คลื่น B แบ่งเป็น 3 คลื่นย่อย และคลื่น C แบ่งเป็น 5 คลื่นย่อยอีกครั้ง รวมเป็นโครงสร้าง 5-3-5 ซึ่งต่างจากโครงสร้าง 3-3-5 ของ flat"}, {"id": "v1q16", "text": "In a standard zigzag, what is generally true of wave B relative to wave A?", "choices": [{"id": "a", "letter": "A", "text": "Wave B typically retraces less than 100% of wave A, commonly in the 38%-79% range."}, {"id": "b", "letter": "B", "text": "Wave B must subdivide into five waves."}, {"id": "c", "letter": "C", "text": "Wave B always exceeds the starting point of wave A."}, {"id": "d", "letter": "D", "text": "Wave B is always longer in price than wave C."}], "correct": ["a"], "expEn": "In a zigzag, wave B is a relatively weak, partial retracement of wave A — commonly 38% to 79% — and subdivides into three waves. If wave B retraces beyond the start of wave A, the pattern is more likely a flat, not a zigzag.", "expTh": "ใน zigzag คลื่น B มักเป็นการย้อนกลับเพียงบางส่วนของคลื่น A อย่างอ่อนแรง โดยทั่วไปอยู่ในช่วง 38%-79% และแบ่งเป็น 3 คลื่นย่อย หากคลื่น B ย้อนกลับเลยจุดเริ่มต้นของคลื่น A ไป มีแนวโน้มว่าจะเป็น flat มากกว่า zigzag"}, {"id": "v1q17", "text": "In a standard zigzag (5-3-5), which sub-waves are five-wave (motive-type) structures?", "choices": [{"id": "a", "letter": "A", "text": "Wave B"}, {"id": "b", "letter": "B", "text": "Only wave A"}, {"id": "c", "letter": "C", "text": "Only wave C"}, {"id": "d", "letter": "D", "text": "Waves A and C"}], "correct": ["d"], "expEn": "In a 5-3-5 zigzag, both wave A and wave C subdivide into five waves (motive structure), while wave B is the three-wave corrective connector between them.", "expTh": "ใน zigzag แบบ 5-3-5 ทั้งคลื่น A และคลื่น C แบ่งเป็น 5 คลื่นย่อย (โครงสร้างแบบ motive) ในขณะที่คลื่น B เป็นคลื่นเชื่อมแบบปรับฐาน 3 คลื่นที่อยู่ตรงกลาง"}, {"id": "v1q18", "text": "A 'double zigzag' is best described as:", "choices": [{"id": "a", "letter": "A", "text": "A single zigzag with an unusually extended wave C."}, {"id": "b", "letter": "B", "text": "Two consecutive impulse waves moving in the same direction."}, {"id": "c", "letter": "C", "text": "Two zigzag patterns connected by an intervening corrective wave labeled X."}, {"id": "d", "letter": "D", "text": "A zigzag that retraces exactly 61.8% twice in succession."}], "correct": ["c"], "expEn": "A double zigzag is a combination correction consisting of two zigzag patterns joined by an intervening 'X' wave, which extends the correction in time without necessarily deepening its price retracement.", "expTh": "double zigzag คือรูปแบบปรับฐานแบบผสม ประกอบด้วย zigzag สองชุดที่เชื่อมกันด้วยคลื่นกลาง (X wave) ซึ่งช่วยยืดระยะเวลาของการปรับฐานออกไป โดยไม่จำเป็นต้องทำให้ราคาย้อนลึกลงกว่าเดิม"}, {"id": "v1q19", "text": "Which Fibonacci relationship is commonly observed between wave C and wave A in a zigzag?", "choices": [{"id": "a", "letter": "A", "text": "Wave C often equals the length of wave A, or extends to 1.618 times wave A."}, {"id": "b", "letter": "B", "text": "Wave C is always exactly equal to wave B."}, {"id": "c", "letter": "C", "text": "Wave C is always exactly 50% of the length of wave A."}, {"id": "d", "letter": "D", "text": "Wave C must always be shorter than wave B."}], "correct": ["a"], "expEn": "A common Fibonacci guideline for zigzags is that wave C tends toward equality with wave A, or extends to 1.618 (or occasionally 2.618) times wave A's length — a relationship analysts use to project likely wave C targets.", "expTh": "แนวทาง Fibonacci ที่พบบ่อยใน zigzag คือคลื่น C มักมีความยาวใกล้เคียงกับคลื่น A หรือยืดออกไปเป็น 1.618 เท่า (บางครั้ง 2.618 เท่า) ของคลื่น A ซึ่งนักวิเคราะห์ใช้ความสัมพันธ์นี้ในการประเมินเป้าหมายของคลื่น C"}, {"id": "v1q20", "text": "Zigzags most commonly appear in which position(s) within a larger Elliott Wave structure?", "choices": [{"id": "a", "letter": "A", "text": "As wave 2, occasionally wave 4, as wave A of larger corrections, or within combinations."}, {"id": "b", "letter": "B", "text": "Only as wave 4."}, {"id": "c", "letter": "C", "text": "Only as wave B."}, {"id": "d", "letter": "D", "text": "Only at the start of a new motive wave 1."}], "correct": ["a"], "expEn": "Zigzags are versatile and can appear as wave 2 (their most common position), occasionally as wave 4, as the initial wave A of a larger flat or triangle-terminated correction, or as a component within double/triple combinations.", "expTh": "zigzag เป็นรูปแบบที่ปรากฏได้หลากหลายตำแหน่ง โดยพบบ่อยที่สุดในตำแหน่งคลื่น 2 บางครั้งพบในคลื่น 4 หรือเป็นคลื่น A เริ่มต้นของรูปแบบปรับฐานขนาดใหญ่ที่จบด้วย flat หรือ triangle รวมถึงเป็นส่วนประกอบภายในรูปแบบผสม (double/triple combination)"}, {"id": "v1q21", "text": "A regular flat correction subdivides into which internal wave structure?", "choices": [{"id": "a", "letter": "A", "text": "5-3-5"}, {"id": "b", "letter": "B", "text": "3-3-5 (waves A-B-C)"}, {"id": "c", "letter": "C", "text": "3-3-3"}, {"id": "d", "letter": "D", "text": "5-5-5"}], "correct": ["b"], "expEn": "A flat correction is labeled A-B-C with a 3-3-5 structure: wave A subdivides into three waves (unlike the five-wave A of a zigzag), wave B into three waves, and wave C into five waves.", "expTh": "flat correction มีป้ายกำกับ A-B-C ในโครงสร้างแบบ 3-3-5 กล่าวคือคลื่น A แบ่งเป็น 3 คลื่นย่อย (ต่างจาก zigzag ที่คลื่น A มี 5 คลื่นย่อย) คลื่น B แบ่งเป็น 3 คลื่นย่อย และคลื่น C แบ่งเป็น 5 คลื่นย่อย"}, {"id": "v1q22", "text": "In a 'regular' flat, wave B typically retraces approximately what percentage of wave A?", "choices": [{"id": "a", "letter": "A", "text": "About 38% to 50%"}, {"id": "b", "letter": "B", "text": "About 90% to 100%"}, {"id": "c", "letter": "C", "text": "About 23.6%"}, {"id": "d", "letter": "D", "text": "About 161.8%"}], "correct": ["b"], "expEn": "In a regular flat, wave B nearly fully retraces wave A, commonly ending in the 90%-100% range near the start of wave A, before wave C completes the pattern with a further five-wave move.", "expTh": "ใน flat แบบปกติ คลื่น B จะย้อนกลับเกือบเต็มความยาวของคลื่น A โดยมักจบลงในช่วง 90%-100% ใกล้จุดเริ่มต้นของคลื่น A ก่อนที่คลื่น C จะปิดรูปแบบด้วยการเคลื่อนที่ 5 คลื่นต่อไปอีกครั้ง"}, {"id": "v1q23", "text": "What defines an 'expanded' (irregular) flat correction?", "choices": [{"id": "a", "letter": "A", "text": "Wave B fails to retrace even 50% of wave A."}, {"id": "b", "letter": "B", "text": "Wave A subdivides into three waves instead of five."}, {"id": "c", "letter": "C", "text": "Wave C terminates within the price range of wave A."}, {"id": "d", "letter": "D", "text": "Wave B moves beyond the start of wave A, and wave C moves beyond the end of wave A."}], "correct": ["d"], "expEn": "An expanded flat is distinguished by wave B exceeding the starting point of wave A (making new extremes beyond A's origin) and wave C then extending beyond the terminus of wave A, producing a pattern that overshoots on both sides.", "expTh": "expanded flat มีลักษณะเด่นคือคลื่น B เคลื่อนที่เลยจุดเริ่มต้นของคลื่น A ไป (ทำจุดสุดขั้วใหม่เกินจุดเริ่มของ A) และคลื่น C เคลื่อนที่เลยจุดสิ้นสุดของคลื่น A ไปอีก ทำให้รูปแบบมีลักษณะยื่นเกินทั้งสองด้าน"}, {"id": "v1q24", "text": "What distinguishes a 'running flat' from other flat variations?", "choices": [{"id": "a", "letter": "A", "text": "Wave A subdivides into five waves while wave C subdivides into three."}, {"id": "b", "letter": "B", "text": "Wave C fails to travel the full distance of wave A (a truncated wave C), signaling strong underlying trend."}, {"id": "c", "letter": "C", "text": "Wave C moves far beyond 1.618 times wave A."}, {"id": "d", "letter": "D", "text": "Wave B fails to retrace any of wave A whatsoever."}], "correct": ["b"], "expEn": "A running flat is a rare variant where, despite wave B exceeding wave A's start (as in an expanded flat), wave C fails to reach the extreme of wave A — a truncated C wave that typically signals a very strong underlying trend resisting correction.", "expTh": "running flat เป็นรูปแบบที่พบได้ไม่บ่อยนัก โดยแม้คลื่น B จะเคลื่อนเลยจุดเริ่มต้นของคลื่น A ไป (คล้าย expanded flat) แต่คลื่น C กลับไปไม่ถึงจุดสุดขั้วของคลื่น A (truncated C) ซึ่งมักบ่งชี้ถึงเทรนด์หลักที่แข็งแกร่งมากจนต้านทานการปรับฐานได้"}, {"id": "v1q25", "text": "In a flat correction, which sub-wave subdivides into a three-wave (rather than five-wave) structure, unlike a zigzag?", "choices": [{"id": "a", "letter": "A", "text": "Wave A"}, {"id": "b", "letter": "B", "text": "None — all three sub-waves subdivide into five waves"}, {"id": "c", "letter": "C", "text": "Wave B, which subdivides into five waves"}, {"id": "d", "letter": "D", "text": "Wave C, which subdivides into three waves"}], "correct": ["a"], "expEn": "The key structural difference between a flat and a zigzag lies in wave A: in a flat, wave A subdivides into only three waves, whereas in a zigzag wave A subdivides into five. This single difference is often the first clue to distinguishing the two patterns.", "expTh": "ความแตกต่างเชิงโครงสร้างที่สำคัญระหว่าง flat กับ zigzag อยู่ที่คลื่น A: ใน flat คลื่น A จะแบ่งเป็นเพียง 3 คลื่นย่อยเท่านั้น ในขณะที่ zigzag คลื่น A จะแบ่งเป็น 5 คลื่นย่อย ความแตกต่างจุดนี้มักเป็นเบาะแสแรกในการแยกแยะสองรูปแบบนี้ออกจากกัน"}, {"id": "v1q26", "text": "Flat corrections are most commonly found in which wave position(s) of a larger structure?", "choices": [{"id": "a", "letter": "A", "text": "Only wave 1 positions"}, {"id": "b", "letter": "B", "text": "Wave 2 and wave 5 positions"}, {"id": "c", "letter": "C", "text": "Wave 4 and wave B positions"}, {"id": "d", "letter": "D", "text": "Only as the terminal wave E of a triangle"}], "correct": ["c"], "expEn": "Flats are most frequently observed as wave 4 within an impulse and as wave B within a zigzag or other larger corrective structure, reflecting their sideways, consolidating character.", "expTh": "flat มักพบบ่อยที่สุดในตำแหน่งคลื่น 4 ของ impulse และในตำแหน่งคลื่น B ของ zigzag หรือรูปแบบปรับฐานขนาดใหญ่อื่น ๆ ซึ่งสะท้อนลักษณะการเคลื่อนที่แบบแกว่งตัวออกด้านข้างของรูปแบบนี้"}, {"id": "v1q27", "text": "A contracting triangle subdivides into how many waves, and how are they labeled?", "choices": [{"id": "a", "letter": "A", "text": "Seven waves labeled A through G."}, {"id": "b", "letter": "B", "text": "Three waves labeled A-B-C, each subdividing into five waves."}, {"id": "c", "letter": "C", "text": "Five waves labeled 1-2-3-4-5, each subdividing into five waves."}, {"id": "d", "letter": "D", "text": "Five waves, labeled A-B-C-D-E, each subdividing into three waves."}], "correct": ["d"], "expEn": "A triangle is a five-wave sideways structure labeled A-B-C-D-E, and each of those five component waves itself subdivides into three waves (making triangles corrective, three-wave-based structures throughout).", "expTh": "triangle เป็นโครงสร้างแกว่งตัวออกด้านข้าง 5 คลื่น มีป้ายกำกับ A-B-C-D-E และคลื่นย่อยแต่ละคลื่นในทั้ง 5 คลื่นนี้จะแบ่งย่อยเป็น 3 คลื่นเสมอ (ทำให้ triangle เป็นโครงสร้างปรับฐานที่อิงจากคลื่น 3 คลื่นตลอดทั้งรูปแบบ)"}, {"id": "v1q28", "text": "Triangles most typically appear in which wave position(s) of a larger pattern?", "choices": [{"id": "a", "letter": "A", "text": "Wave 4, wave B, or wave X — the penultimate wave before the final move of the larger pattern."}, {"id": "b", "letter": "B", "text": "Wave 5, as the terminal wave of the entire pattern."}, {"id": "c", "letter": "C", "text": "Wave 3 only."}, {"id": "d", "letter": "D", "text": "Wave 1 only."}], "correct": ["a"], "expEn": "Triangles characteristically appear as the next-to-last wave of a larger sequence — commonly wave 4, wave B, or wave X — after which a swift 'thrust' move typically follows in the direction of the trend that preceded the triangle.", "expTh": "triangle มักปรากฏในตำแหน่งคลื่นรองสุดท้ายของรูปแบบขนาดใหญ่ ซึ่งโดยทั่วไปคือคลื่น 4, คลื่น B หรือคลื่น X โดยหลังจากนั้นมักตามมาด้วยการเคลื่อนที่แบบ thrust อย่างรวดเร็วในทิศทางเดียวกับเทรนด์ที่มีอยู่ก่อน triangle"}, {"id": "v1q29", "text": "What is true of a contracting triangle's boundary trendlines?", "choices": [{"id": "a", "letter": "A", "text": "The trendlines run perfectly parallel to one another."}, {"id": "b", "letter": "B", "text": "The A-C and B-D trendlines converge toward each other."}, {"id": "c", "letter": "C", "text": "The trendlines diverge outward from each other."}, {"id": "d", "letter": "D", "text": "There are no trendlines in a triangle, only Fibonacci ratios."}], "correct": ["b"], "expEn": "In a contracting triangle, the trendline connecting waves A and C converges with the trendline connecting waves B and D, giving the pattern its characteristic narrowing, wedge-like appearance.", "expTh": "ใน contracting triangle เส้นแนวโน้มที่เชื่อมคลื่น A กับ C จะบรรจบเข้าหาเส้นแนวโน้มที่เชื่อมคลื่น B กับ D ทำให้รูปแบบมีลักษณะแคบเข้าคล้ายรูปลิ่มซึ่งเป็นเอกลักษณ์ของ triangle ชนิดนี้"}, {"id": "v1q30", "text": "What characteristic distinguishes a 'barrier' triangle from a standard contracting triangle?", "choices": [{"id": "a", "letter": "A", "text": "It contains only three waves instead of five."}, {"id": "b", "letter": "B", "text": "One trendline (often the B-D line) is roughly flat/horizontal while the opposing trendline converges toward it."}, {"id": "c", "letter": "C", "text": "Both trendlines slope in the same direction and never converge."}, {"id": "d", "letter": "D", "text": "Wave E always exceeds wave C in length."}], "correct": ["b"], "expEn": "A barrier triangle is a variation where one boundary — commonly the B-D trendline — is essentially flat, while the opposite boundary slopes toward it, still producing overall convergence but with one nearly horizontal edge.", "expTh": "barrier triangle เป็นรูปแบบย่อยที่เส้นขอบด้านหนึ่ง มักเป็นเส้น B-D เกือบเป็นแนวราบ ในขณะที่เส้นขอบฝั่งตรงข้ามลาดเอียงเข้าหา ทำให้ยังคงเกิดการบรรจบกันโดยรวม แต่มีขอบด้านหนึ่งที่เกือบเป็นแนวนอน"}, {"id": "v1q31", "text": "After a triangle completes, what is the typical expectation for the subsequent move?", "choices": [{"id": "a", "letter": "A", "text": "A move that fully retraces the entire triangle."}, {"id": "b", "letter": "B", "text": "A move that must exactly equal wave A of the triangle."}, {"id": "c", "letter": "C", "text": "A prolonged pause with no significant follow-through move."}, {"id": "d", "letter": "D", "text": "A swift 'thrust' move in the direction of the trend preceding the triangle, often approximating the triangle's widest width."}], "correct": ["d"], "expEn": "Triangles are typically followed by a fast, decisive thrust move in the direction of the trend that preceded the triangle, with the thrust's length commonly approximating the width of the triangle's widest leg (wave A to B).", "expTh": "หลัง triangle จบลง มักตามมาด้วยการเคลื่อนไหวแบบ thrust ที่รวดเร็วและเด็ดขาดในทิศทางเดียวกับเทรนด์ที่มีอยู่ก่อน triangle โดยความยาวของ thrust มักใกล้เคียงกับความกว้างที่สุดของ triangle (ช่วงคลื่น A ถึง B)"}, {"id": "v1q32", "text": "Which sequence correctly lists a common subset of Elliott Wave degrees from LARGEST to smallest?", "choices": [{"id": "a", "letter": "A", "text": "Primary, Intermediate, Cycle, Supercycle, Minor, Minute"}, {"id": "b", "letter": "B", "text": "Grand Supercycle, Supercycle, Cycle, Primary, Intermediate, Minor, Minute"}, {"id": "c", "letter": "C", "text": "Minute, Minor, Intermediate, Primary, Cycle, Grand Supercycle"}, {"id": "d", "letter": "D", "text": "Cycle, Grand Supercycle, Primary, Supercycle, Minor, Minute"}], "correct": ["b"], "expEn": "Elliott's degree hierarchy runs, from largest to smallest, through Grand Supercycle, Supercycle, Cycle, Primary, Intermediate, Minor, Minute, Minuette, and Subminuette — each degree's five-wave impulse forming a sub-wave of the degree above it.", "expTh": "ลำดับดีกรีของเอลเลียตเรียงจากใหญ่ไปเล็กคือ Grand Supercycle, Supercycle, Cycle, Primary, Intermediate, Minor, Minute, Minuette และ Subminuette โดยคลื่น impulse 5 คลื่นของแต่ละดีกรีจะกลายเป็นคลื่นย่อยหนึ่งของดีกรีที่ใหญ่กว่าถัดขึ้นไป"}, {"id": "v1q33", "text": "Why does Elliott Wave notation change between degrees (e.g., circled numbers vs. plain numbers vs. Roman numerals)?", "choices": [{"id": "a", "letter": "A", "text": "To indicate whether a wave is motive or corrective."}, {"id": "b", "letter": "B", "text": "To indicate the exact calendar time frame in days."}, {"id": "c", "letter": "C", "text": "To visually distinguish waves of different degrees within the same chart."}, {"id": "d", "letter": "D", "text": "To indicate whether Fibonacci ratios apply to that wave."}], "correct": ["c"], "expEn": "Because the same 1-2-3-4-5 and A-B-C labels repeat fractally at every degree, analysts use different symbol styles (circled digits, plain digits, Roman numerals, letters) purely to keep multiple degrees visually distinguishable on one chart.", "expTh": "เนื่องจากป้ายกำกับ 1-2-3-4-5 และ A-B-C ซ้ำกันในทุกดีกรีตามลักษณะแฟร็กทัล นักวิเคราะห์จึงใช้รูปแบบสัญลักษณ์ที่ต่างกัน (ตัวเลขในวงกลม ตัวเลขธรรมดา เลขโรมัน ตัวอักษร) เพื่อแยกแยะดีกรีต่าง ๆ ให้เห็นชัดเจนบนกราฟเดียวกันเท่านั้น"}, {"id": "v1q34", "text": "What is the correct convention for labeling sub-waves inside a larger corrective wave (e.g., inside wave 4)?", "choices": [{"id": "a", "letter": "A", "text": "Always Roman numerals, regardless of degree."}, {"id": "b", "letter": "B", "text": "Lowercase letters or numbers of the next lower degree, kept consistent with the numbering convention used elsewhere on the chart."}, {"id": "c", "letter": "C", "text": "Always circled numbers, regardless of degree."}, {"id": "d", "letter": "D", "text": "Corrective waves are never sub-labeled in Elliott convention."}], "correct": ["b"], "expEn": "Sub-waves inside a corrective structure are labeled with the next lower degree's convention (e.g., lowercase a-b-c inside a Minor-degree wave 4), keeping the overall chart's degree hierarchy consistent and readable.", "expTh": "คลื่นย่อยภายในโครงสร้างปรับฐานจะติดป้ายกำกับด้วยรูปแบบของดีกรีที่เล็กลงหนึ่งขั้น (เช่น a-b-c ตัวพิมพ์เล็กภายในคลื่น 4 ดีกรี Minor) เพื่อรักษาลำดับชั้นดีกรีของกราฟทั้งหมดให้สอดคล้องและอ่านง่าย"}, {"id": "v1q35", "text": "When comparing wave counts across different timeframes, what principle governs how wave degree is assigned?", "choices": [{"id": "a", "letter": "A", "text": "Degree has no formal hierarchy in Elliott theory."}, {"id": "b", "letter": "B", "text": "Degree is relative, determined by the wave's position within the overall fractal structure — not by a fixed calendar duration."}, {"id": "c", "letter": "C", "text": "Degree is determined solely by the percentage price moved."}, {"id": "d", "letter": "D", "text": "Degree is fixed by calendar time only (e.g., Minor degree always lasts weeks)."}], "correct": ["b"], "expEn": "Because markets are fractal, the same degree label (e.g., 'Minor') can span very different real-world timeframes in different markets or eras. Degree is assigned relative to a wave's place in the larger structure, not by any fixed duration or fixed price percentage.", "expTh": "เนื่องจากตลาดมีลักษณะแฟร็กทัล ป้ายกำกับดีกรีเดียวกัน (เช่น Minor) อาจครอบคลุมช่วงเวลาจริงที่แตกต่างกันมากในตลาดหรือยุคสมัยที่ต่างกัน การกำหนดดีกรีจึงอิงตามตำแหน่งของคลื่นในโครงสร้างใหญ่ ไม่ใช่ระยะเวลาที่ตายตัวหรือเปอร์เซ็นต์ราคาที่ตายตัว"}, {"id": "v1q36", "text": "A single degree's complete cycle (one full impulse plus its correction) is composed of how many waves in total?", "choices": [{"id": "a", "letter": "A", "text": "Thirteen"}, {"id": "b", "letter": "B", "text": "Three"}, {"id": "c", "letter": "C", "text": "Five"}, {"id": "d", "letter": "D", "text": "Eight (5 motive waves + 3 corrective waves)"}], "correct": ["d"], "expEn": "A complete cycle at any degree consists of a five-wave motive phase (1-2-3-4-5) followed by a three-wave corrective phase (A-B-C), totaling eight waves, which themselves become one motive and one corrective wave of the next higher degree.", "expTh": "วัฏจักรที่สมบูรณ์หนึ่งดีกรีประกอบด้วยเฟส motive 5 คลื่น (1-2-3-4-5) ตามด้วยเฟสปรับฐาน 3 คลื่น (A-B-C) รวมเป็น 8 คลื่น ซึ่งวัฏจักรทั้งหมดนี้จะกลายเป็นคลื่น motive หนึ่งคลื่นและคลื่นปรับฐานหนึ่งคลื่นของดีกรีที่ใหญ่กว่าถัดไป"}, {"id": "v1q37", "text": "Which Fibonacci retracement range is most commonly associated with wave 2?", "choices": [{"id": "a", "letter": "A", "text": "0.500 to 0.618"}, {"id": "b", "letter": "B", "text": "1.618"}, {"id": "c", "letter": "C", "text": "2.618"}, {"id": "d", "letter": "D", "text": "0.236"}], "correct": ["a"], "expEn": "Wave 2 retracements commonly cluster in the 50% to 61.8% range of wave 1, reflecting a deep but not complete pullback before wave 3 begins.", "expTh": "คลื่น 2 มักย้อนกลับในช่วง 50% ถึง 61.8% ของคลื่น 1 สะท้อนการย่อตัวที่ลึกแต่ยังไม่ถึงขั้นย้อนกลับทั้งหมด ก่อนที่คลื่น 3 จะเริ่มต้น"}, {"id": "v1q38", "text": "Wave 4 retracements most commonly fall within which range of wave 3?", "choices": [{"id": "a", "letter": "A", "text": "0.618 to 0.786"}, {"id": "b", "letter": "B", "text": "Exactly 0.500, with virtually no variation"}, {"id": "c", "letter": "C", "text": "1.000 to 1.272"}, {"id": "d", "letter": "D", "text": "0.236 to 0.382"}], "correct": ["d"], "expEn": "Wave 4 tends to be a shallower retracement than wave 2, commonly falling in the 23.6% to 38.2% range of wave 3, consistent with the alternation guideline when wave 2 was a deep, sharp correction.", "expTh": "คลื่น 4 มักย้อนกลับตื้นกว่าคลื่น 2 โดยส่วนใหญ่อยู่ในช่วง 23.6% ถึง 38.2% ของคลื่น 3 ซึ่งสอดคล้องกับแนวทาง alternation guideline หากคลื่น 2 เป็นการปรับฐานที่ลึกและรวดเร็ว"}, {"id": "v1q39", "text": "When wave 3 is extended, wave 5 is often related to waves 1 through 3 through which relationship?", "choices": [{"id": "a", "letter": "A", "text": "Wave 5 always equals 2.618 times wave 1."}, {"id": "b", "letter": "B", "text": "Wave 5 approximately equals wave 1, or equals 0.618 times the length of waves 1 through 3."}, {"id": "c", "letter": "C", "text": "Wave 5 is always exactly half the length of wave 3."}, {"id": "d", "letter": "D", "text": "Wave 5 has no Fibonacci relationship to the prior waves."}], "correct": ["b"], "expEn": "When wave 3 extends, common Fibonacci relationships for wave 5 include near-equality with wave 1, or a length equal to 0.618 times the combined length of waves 1 through 3 — both used as practical price-target guidelines.", "expTh": "เมื่อคลื่น 3 ยืดออก ความสัมพันธ์ Fibonacci ที่พบบ่อยสำหรับคลื่น 5 คือมีความยาวใกล้เคียงกับคลื่น 1 หรือเท่ากับ 0.618 เท่าของความยาวรวมคลื่น 1 ถึง 3 ซึ่งทั้งสองแนวทางนี้ใช้เป็นเป้าหมายราคาในทางปฏิบัติ"}, {"id": "v1q40", "text": "An extended wave 3 is most often related to wave 1 by which Fibonacci multiple?", "choices": [{"id": "a", "letter": "A", "text": "1.618 times the length of wave 1"}, {"id": "b", "letter": "B", "text": "4.236 times wave 1"}, {"id": "c", "letter": "C", "text": "0.618 times wave 1"}, {"id": "d", "letter": "D", "text": "Exactly 1.000 times wave 1"}], "correct": ["a"], "expEn": "The most common Fibonacci projection for an extended wave 3 is 1.618 times the length of wave 1, though multiples like 2.618 can occur in unusually powerful trends.", "expTh": "อัตราส่วน Fibonacci ที่พบบ่อยที่สุดสำหรับคลื่น 3 ที่ยืดออกคือ 1.618 เท่าของความยาวคลื่น 1 แม้ในบางกรณีที่เทรนด์แข็งแกร่งผิดปกติอาจพบอัตราส่วนที่สูงกว่านี้ เช่น 2.618 เท่า"}, {"id": "v1q41", "text": "The Fibonacci sequence (0,1,1,2,3,5,8,13,21...) approaches which limiting ratio as it progresses?", "choices": [{"id": "a", "letter": "A", "text": "2.000"}, {"id": "b", "letter": "B", "text": "0.786"}, {"id": "c", "letter": "C", "text": "0.618 (and its inverse, 1.618)"}, {"id": "d", "letter": "D", "text": "0.500"}], "correct": ["c"], "expEn": "As the Fibonacci sequence progresses, the ratio of any number to the one following it converges toward 0.618, while the ratio to the preceding number converges toward 1.618 — the golden ratio underlying most Elliott Wave price relationships.", "expTh": "เมื่อลำดับ Fibonacci ดำเนินไปเรื่อย ๆ อัตราส่วนของตัวเลขใด ๆ ต่อตัวเลขถัดไปจะเข้าใกล้ 0.618 ในขณะที่อัตราส่วนต่อตัวเลขก่อนหน้าจะเข้าใกล้ 1.618 ซึ่งเป็น golden ratio ที่อยู่เบื้องหลังความสัมพันธ์ด้านราคาส่วนใหญ่ในทฤษฎีคลื่นเอลเลียต"}, {"id": "v1q42", "text": "Which ratio is derived by dividing a Fibonacci number by the number two places higher in the sequence?", "choices": [{"id": "a", "letter": "A", "text": "0.382"}, {"id": "b", "letter": "B", "text": "0.236"}, {"id": "c", "letter": "C", "text": "0.786"}, {"id": "d", "letter": "D", "text": "0.618"}], "correct": ["a"], "expEn": "Dividing a Fibonacci number by the number two positions higher (for example 21/55) converges toward 0.382, one of the standard retracement ratios used throughout Elliott Wave analysis.", "expTh": "การนำตัวเลข Fibonacci มาหารด้วยตัวเลขที่อยู่ห่างออกไปสองตำแหน่งข้างหน้า (เช่น 21/55) จะเข้าใกล้ค่า 0.382 ซึ่งเป็นหนึ่งในอัตราส่วนย้อนกลับมาตรฐานที่ใช้ทั่วไปในการวิเคราะห์คลื่นเอลเลียต"}, {"id": "v1q43", "text": "The ratio 0.786, sometimes used in retracement analysis, is derived from:", "choices": [{"id": "a", "letter": "A", "text": "The square root of 0.382"}, {"id": "b", "letter": "B", "text": "Multiplying 0.618 by 1.272"}, {"id": "c", "letter": "C", "text": "Dividing 1 by 1.618 twice"}, {"id": "d", "letter": "D", "text": "The square root of 0.618"}], "correct": ["d"], "expEn": "The 0.786 retracement level is mathematically the square root of 0.618 (√0.618 ≈ 0.786), giving it a mathematical basis within the same golden-ratio family used elsewhere in Elliott analysis.", "expTh": "ระดับ 0.786 มีที่มาทางคณิตศาสตร์จากรากที่สองของ 0.618 (√0.618 ≈ 0.786) ทำให้ยังคงอยู่ในตระกูลอัตราส่วนทองคำ (golden ratio) เดียวกันกับที่ใช้ในการวิเคราะห์คลื่นเอลเลียตส่วนอื่น ๆ"}, {"id": "v1q44", "text": "The guideline of alternation suggests that:", "choices": [{"id": "a", "letter": "A", "text": "Wave 4 must always be a triangle if wave 2 was a zigzag."}, {"id": "b", "letter": "B", "text": "Alternation applies only to motive waves, never to corrective waves."}, {"id": "c", "letter": "C", "text": "If wave 2 is a sharp correction, wave 4 is more likely to be a sideways/flat-type correction, and vice versa."}, {"id": "d", "letter": "D", "text": "Wave 2 and wave 4 must always be structurally identical."}], "correct": ["c"], "expEn": "Alternation is a guideline (not a rule) suggesting wave 2 and wave 4 will tend to differ in character — if one is sharp (e.g., a zigzag), the other is more likely to be sideways (e.g., a flat or triangle). It does not force wave 4 to be a triangle specifically.", "expTh": "alternation เป็นแนวทาง (ไม่ใช่กฎ) ที่บ่งชี้ว่าคลื่น 2 และคลื่น 4 มักมีลักษณะที่แตกต่างกัน หากคลื่นหนึ่งเป็นแบบรวดเร็วรุนแรง (เช่น zigzag) อีกคลื่นหนึ่งมักมีแนวโน้มเป็นแบบแกว่งตัวออกด้านข้าง (เช่น flat หรือ triangle) แต่ไม่ได้บังคับว่าคลื่น 4 ต้องเป็น triangle เสมอไป"}, {"id": "v1q45", "text": "Alternation can also be observed between which pair of motive sub-waves, as a weaker secondary guideline?", "choices": [{"id": "a", "letter": "A", "text": "Waves 3 and 5, which must alternate in direction."}, {"id": "b", "letter": "B", "text": "Waves 1 and 5, which must always be equal in length due to alternation."}, {"id": "c", "letter": "C", "text": "Waves 1 and 3, which often alternate in complexity of their internal structure."}, {"id": "d", "letter": "D", "text": "Alternation guarantees wave 1 will always be structurally simple."}], "correct": ["c"], "expEn": "A weaker, secondary form of alternation is sometimes observed between waves 1 and 3: if one is relatively simple in structure, the other tends to be more complex. This is a soft tendency, not a rule, and does not guarantee simplicity in either wave.", "expTh": "รูปแบบรองของ alternation ที่พบได้บ้างคือระหว่างคลื่น 1 และคลื่น 3 หากคลื่นหนึ่งมีโครงสร้างค่อนข้างเรียบง่าย อีกคลื่นหนึ่งมักมีแนวโน้มซับซ้อนกว่า อย่างไรก็ตามนี่เป็นเพียงแนวโน้มเบา ๆ ไม่ใช่กฎ และไม่ได้รับประกันว่าคลื่นใดคลื่นหนึ่งจะเรียบง่ายเสมอไป"}, {"id": "v1q46", "text": "If wave 4 turns out to be structurally complex (e.g., a combination or triangle), what does the alternation guideline suggest wave 2 more likely was?", "choices": [{"id": "a", "letter": "A", "text": "A relatively simple correction, such as a zigzag."}, {"id": "b", "letter": "B", "text": "An extended flat with a truncated C wave."}, {"id": "c", "letter": "C", "text": "Also a complex triangle, since complexity tends to repeat."}, {"id": "d", "letter": "D", "text": "Impossible to infer anything about wave 2 from wave 4's structure."}], "correct": ["a"], "expEn": "Following the alternation guideline, if wave 4 is complex, wave 2 more likely was simple (such as a straightforward zigzag), since the two corrective waves in an impulse tend to differ from each other in structural complexity.", "expTh": "ตามแนวทาง alternation หากคลื่น 4 มีโครงสร้างซับซ้อน คลื่น 2 มักมีแนวโน้มเป็นรูปแบบที่เรียบง่ายกว่า (เช่น zigzag ธรรมดา) เนื่องจากคลื่นปรับฐานทั้งสองในหนึ่ง impulse มักมีความซับซ้อนที่แตกต่างกัน"}, {"id": "v1q47", "text": "Which characteristic best describes the typical 'personality' of wave 3 in an impulse?", "choices": [{"id": "a", "letter": "A", "text": "Marked by a loss of momentum and unusually low volume."}, {"id": "b", "letter": "B", "text": "Hesitant and narrow, often the shortest of the five waves."}, {"id": "c", "letter": "C", "text": "Strong, wide-ranging, and often the longest wave, driven by broadening recognition of the trend."}, {"id": "d", "letter": "D", "text": "Predominantly sideways with heavy overlap between sub-waves."}], "correct": ["c"], "expEn": "Wave 3 typically displays strong, decisive, wide-ranging price action with expanding volume, as skepticism from wave 2 fades and broader participation confirms the trend — this is why it is so often the longest wave.", "expTh": "คลื่น 3 มักแสดงลักษณะการเคลื่อนไหวของราคาที่แข็งแกร่ง เด็ดขาด และมีช่วงกว้าง พร้อมปริมาณการซื้อขายที่ขยายตัว เนื่องจากความไม่มั่นใจจากคลื่น 2 เริ่มจางหายและมีผู้เข้าร่วมตลาดในวงกว้างมากขึ้นมายืนยันเทรนด์ นี่จึงเป็นเหตุผลที่คลื่น 3 มักยาวที่สุดในบรรดาห้าคลื่น"}, {"id": "v1q48", "text": "Wave 5 of an equity bull market impulse is typically characterized by:", "choices": [{"id": "a", "letter": "A", "text": "Universally bearish sentiment despite the rising price."}, {"id": "b", "letter": "B", "text": "A complete retracement of the gains made in wave 4."}, {"id": "c", "letter": "C", "text": "The strongest volume and broadest participation of the entire impulse."}, {"id": "d", "letter": "D", "text": "Advancing on narrowing breadth, often with greater optimism than warranted by underlying fundamentals."}], "correct": ["d"], "expEn": "Wave 5 typically advances on narrower participation than wave 3, often accompanied by optimistic sentiment that outpaces the underlying fundamentals — a divergence that frequently shows up in weakening momentum readings even as price makes new highs.", "expTh": "คลื่น 5 มักเคลื่อนที่ขึ้นด้วยการมีส่วนร่วมของตลาดที่แคบลงเมื่อเทียบกับคลื่น 3 พร้อมกับความเชื่อมั่นเชิงบวกที่มักมากเกินกว่าปัจจัยพื้นฐานจะรองรับได้ ซึ่งความคลาดเคลื่อนนี้มักปรากฏให้เห็นผ่านโมเมนตัมที่อ่อนแรงลง แม้ราคาจะยังคงทำจุดสูงสุดใหม่"}, {"id": "v1q49", "text": "Wave B in a corrective sequence is often described as having which typical personality?", "choices": [{"id": "a", "letter": "A", "text": "The most technically clean five-wave advance in the entire cycle."}, {"id": "b", "letter": "B", "text": "A wave that always exceeds the prior wave 5 high with strong conviction."}, {"id": "c", "letter": "C", "text": "A deceptive, often emotionally-driven rally that lacks the breadth and conviction of a genuine impulse wave."}, {"id": "d", "letter": "D", "text": "Universally low volume with widespread disinterest from participants."}], "correct": ["c"], "expEn": "Wave B is often described as a deceptive rally: it can feel emotionally convincing (sometimes even sentiment-driven speculation or a 'sucker's rally') but typically lacks the broad participation, momentum, and clean structure that characterize a true impulse wave.", "expTh": "คลื่น B มักถูกอธิบายว่าเป็นการรีบาวด์ที่หลอกลวง เพราะแม้จะให้ความรู้สึกน่าเชื่อถือทางอารมณ์ (บางครั้งขับเคลื่อนด้วยการเก็งกำไรตามความรู้สึก) แต่มักขาดการมีส่วนร่วมของตลาดในวงกว้าง ขาดโมเมนตัม และขาดโครงสร้างที่ชัดเจนแบบคลื่น impulse ที่แท้จริง"}, {"id": "v1q50", "text": "Which characteristic best describes the typical 'personality' of wave 1 at the start of a new impulse?", "choices": [{"id": "a", "letter": "A", "text": "The widest-ranging and most obviously trending wave of the entire impulse."}, {"id": "b", "letter": "B", "text": "A wave that always retraces more than 100% of the move that preceded it."}, {"id": "c", "letter": "C", "text": "A tentative, often disbelieved advance, frequently mistaken for just another corrective rally against the prior trend."}, {"id": "d", "letter": "D", "text": "A wave characterized by euphoric sentiment and record participation."}], "correct": ["c"], "expEn": "Wave 1 typically begins tentatively, often against a backdrop of lingering bearish (or bullish, in a downtrend) sentiment from the prior trend, so much so that many market participants initially dismiss it as merely a corrective bounce rather than the start of a new impulse.", "expTh": "คลื่น 1 มักเริ่มต้นอย่างไม่มั่นใจ โดยทั่วไปเกิดขึ้นท่ามกลางความเชื่อมั่นเชิงลบ (หรือเชิงบวกในกรณีขาลง) ที่ยังหลงเหลือจากเทรนด์เดิม จนทำให้ผู้เข้าร่วมตลาดจำนวนมากเข้าใจผิดว่าเป็นเพียงการรีบาวด์เพื่อปรับฐาน มิใช่จุดเริ่มต้นของคลื่น impulse ใหม่"}], "v2": [{"id": "v2q01", "text": "In a 'leading diagonal' (appearing in the wave 1 or wave A position), the internal subdivision is typically:", "choices": [{"id": "a", "letter": "A", "text": "5-3-5-3-5"}, {"id": "b", "letter": "B", "text": "3-3-5-3-5"}, {"id": "c", "letter": "C", "text": "3-3-3-3-3"}, {"id": "d", "letter": "D", "text": "5-5-5-5-5"}], "correct": ["a"], "expEn": "A leading diagonal, found at the start of a move (wave 1 or A), classically subdivides 5-3-5-3-5 — its first and fourth sub-waves being five-wave structures, distinguishing it from the 3-3-3-3-3 structure of an ending diagonal.", "expTh": "leading diagonal ซึ่งปรากฏที่จุดเริ่มต้นของการเคลื่อนไหว (คลื่น 1 หรือ A) ตามตำราคลาสสิกจะแบ่งย่อยเป็น 5-3-5-3-5 โดยคลื่นย่อยที่หนึ่งและที่สี่เป็นโครงสร้างแบบ 5 คลื่น ซึ่งต่างจากโครงสร้าง 3-3-3-3-3 ของ ending diagonal"}, {"id": "v2q02", "text": "In an 'ending diagonal' (appearing in the wave 5 or wave C position), the internal subdivision is typically:", "choices": [{"id": "a", "letter": "A", "text": "3-3-3-3-3"}, {"id": "b", "letter": "B", "text": "5-3-5-3-5"}, {"id": "c", "letter": "C", "text": "5-5-5-5-5"}, {"id": "d", "letter": "D", "text": "3-5-3-5-3"}], "correct": ["a"], "expEn": "An ending diagonal, found at the termination of a move (wave 5 or C), subdivides into five three-wave structures (3-3-3-3-3), giving it a consistently overlapping, wedge-shaped appearance throughout.", "expTh": "ending diagonal ซึ่งปรากฏที่จุดสิ้นสุดของการเคลื่อนไหว (คลื่น 5 หรือ C) จะแบ่งย่อยเป็นโครงสร้างแบบ 3 คลื่นทั้งห้าคลื่นย่อย (3-3-3-3-3) ทำให้มีลักษณะทับซ้อนกันคล้ายรูปลิ่มตลอดทั้งรูปแบบ"}, {"id": "v2q03", "text": "What shape do the boundary trendlines of an ending diagonal typically form?", "choices": [{"id": "a", "letter": "A", "text": "A perfectly parallel channel with no overlap between sub-waves."}, {"id": "b", "letter": "B", "text": "A flat, purely horizontal channel."}, {"id": "c", "letter": "C", "text": "An expanding megaphone shape that widens over time."}, {"id": "d", "letter": "D", "text": "A contracting wedge, where waves 1 and 4 overlap and the trendlines converge."}], "correct": ["d"], "expEn": "An ending diagonal's characteristic wedge shape comes from converging trendlines connecting waves 1-3-5 on one side and 2-4 on the other, combined with the overlap permitted between waves 1 and 4 that is forbidden in a standard impulse.", "expTh": "รูปลิ่มอันเป็นเอกลักษณ์ของ ending diagonal เกิดจากเส้นแนวโน้มที่บรรจบกัน โดยเส้นหนึ่งเชื่อมคลื่น 1-3-5 และอีกเส้นเชื่อมคลื่น 2-4 ประกอบกับการทับซ้อนระหว่างคลื่น 1 กับ 4 ที่ได้รับอนุญาตใน diagonal แต่ต้องห้ามใน impulse แบบมาตรฐาน"}, {"id": "v2q04", "text": "The completion of an ending diagonal typically signals what for the market that follows?", "choices": [{"id": "a", "letter": "A", "text": "A pause with no expectation of any significant subsequent move."}, {"id": "b", "letter": "B", "text": "A pure continuation pattern with no reversal implication whatsoever."}, {"id": "c", "letter": "C", "text": "Exhaustion of the preceding trend, often followed by a sharp reversal that retraces the entire diagonal quickly."}, {"id": "d", "letter": "D", "text": "The beginning of a new, extended impulse in the same direction."}], "correct": ["c"], "expEn": "An ending diagonal signals exhaustion of the trend it completes. It is frequently followed by a fast, sharp reversal that retraces the entire diagonal in a fraction of the time it took to build — a distinctive and tradable characteristic of this pattern.", "expTh": "ending diagonal เป็นสัญญาณของความอ่อนแรงของเทรนด์ที่กำลังจะจบลง และมักตามมาด้วยการกลับตัวอย่างรวดเร็วและรุนแรงที่ย้อนกลับทั้ง diagonal ในเวลาเพียงเสี้ยวหนึ่งของเวลาที่ใช้สร้างรูปแบบขึ้นมา ซึ่งเป็นลักษณะเด่นและใช้ประโยชน์ได้จริงในการเทรดของรูปแบบนี้"}, {"id": "v2q05", "text": "What is a defining characteristic separating a diagonal triangle from a standard impulse wave, specifically regarding wave 4?", "choices": [{"id": "a", "letter": "A", "text": "Diagonal triangles do not contain a wave 4 at all."}, {"id": "b", "letter": "B", "text": "In a diagonal, wave 4 can never overlap wave 1, exactly as in a standard impulse."}, {"id": "c", "letter": "C", "text": "In a diagonal, wave 4 is permitted to overlap the price territory of wave 1, and typically does."}, {"id": "d", "letter": "D", "text": "In a diagonal, wave 4 must always be the longest of the five waves."}], "correct": ["c"], "expEn": "The overlap of wave 4 into wave 1's territory — strictly forbidden in a standard impulse — is not only permitted but expected in a diagonal triangle, making it the single most reliable structural identifier of this pattern.", "expTh": "การที่คลื่น 4 ทับซ้อนเข้าไปในอาณาเขตราคาของคลื่น 1 ซึ่งเป็นสิ่งต้องห้ามอย่างเด็ดขาดใน impulse แบบมาตรฐาน กลับเป็นสิ่งที่ได้รับอนุญาตและคาดว่าจะเกิดขึ้นใน diagonal triangle ทำให้เป็นตัวบ่งชี้เชิงโครงสร้างที่น่าเชื่อถือที่สุดของรูปแบบนี้"}, {"id": "v2q06", "text": "A 'double three' correction is best described as:", "choices": [{"id": "a", "letter": "A", "text": "Three consecutive impulse waves in the direction of the larger trend."}, {"id": "b", "letter": "B", "text": "Two corrective patterns (e.g., zigzag, flat, or triangle) joined by an intervening connecting wave X."}, {"id": "c", "letter": "C", "text": "A flat correction that fails to complete twice before finally resolving."}, {"id": "d", "letter": "D", "text": "A single zigzag with a truncated wave C."}], "correct": ["b"], "expEn": "A double three is a combination correction made of two simple corrective patterns — any mix of zigzag, flat, or triangle — connected by an intervening wave X, extending the correction's duration without necessarily deepening its retracement.", "expTh": "double three คือรูปแบบปรับฐานแบบผสมที่ประกอบด้วยรูปแบบปรับฐานเดี่ยวสองชุด ซึ่งอาจเป็น zigzag, flat หรือ triangle ผสมกันได้ เชื่อมกันด้วยคลื่นกลาง (X wave) ซึ่งช่วยยืดระยะเวลาของการปรับฐานออกไปโดยไม่จำเป็นต้องทำให้ราคาย้อนลึกลงกว่าเดิม"}, {"id": "v2q07", "text": "In a double or triple three combination, what is the structural role of wave X?", "choices": [{"id": "a", "letter": "A", "text": "A connecting corrective wave joining the two (or three) component patterns together."}, {"id": "b", "letter": "B", "text": "A motive wave that permanently resumes the prior trend."}, {"id": "c", "letter": "C", "text": "A wave that determines the overall Elliott degree of the whole pattern."}, {"id": "d", "letter": "D", "text": "The final wave of the entire structure, and always the largest component."}], "correct": ["a"], "expEn": "Wave X serves purely as a connector between component corrective patterns in a combination. It is itself corrective, can vary considerably in depth, and does not by itself resume or end the larger trend.", "expTh": "คลื่น X ทำหน้าที่เพียงเป็นตัวเชื่อมระหว่างรูปแบบปรับฐานย่อยแต่ละชุดในรูปแบบผสม โดยตัวมันเองก็เป็นคลื่นปรับฐานเช่นกัน สามารถมีความลึกที่แตกต่างกันได้มาก และไม่ได้ทำหน้าที่กลับมาดำเนินเทรนด์เดิมหรือปิดจบเทรนด์ใหญ่ด้วยตัวเอง"}, {"id": "v2q08", "text": "Which corrective structure most commonly terminates a triple three or other complex combination correction?", "choices": [{"id": "a", "letter": "A", "text": "A leading diagonal."}, {"id": "b", "letter": "B", "text": "A single-wave spike with no internal subdivisions."}, {"id": "c", "letter": "C", "text": "An extended fifth wave."}, {"id": "d", "letter": "D", "text": "A triangle, often signaling the correction's final leg."}], "correct": ["d"], "expEn": "Combinations very frequently end with a triangle as their last component, since a triangle's contracting, energy-dissipating character is a natural signal that the overall corrective process is running out of steam and nearing completion.", "expTh": "รูปแบบผสมมักจบลงด้วย triangle เป็นองค์ประกอบสุดท้ายบ่อยครั้ง เนื่องจากลักษณะของ triangle ที่บีบตัวแคบลงและพลังงานค่อย ๆ หมดไป เป็นสัญญาณตามธรรมชาติว่ากระบวนการปรับฐานโดยรวมกำลังจะหมดแรงและใกล้จบลง"}, {"id": "v2q09", "text": "What generally happens to momentum and volatility across a double or triple three combination correction?", "choices": [{"id": "a", "letter": "A", "text": "It consistently accelerates right up until the pattern's completion."}, {"id": "b", "letter": "B", "text": "It always exceeds the volatility of the impulse wave that preceded it."}, {"id": "c", "letter": "C", "text": "It tends to diminish, giving the overall pattern a sideways, energy-dissipating character, especially if it ends in a triangle."}, {"id": "d", "letter": "D", "text": "It remains perfectly constant across all component patterns."}], "correct": ["c"], "expEn": "Combination corrections typically show diminishing volatility and momentum as they progress, particularly when the final component is a triangle — reflecting a market that is consolidating and running out of directional energy before the prior trend resumes.", "expTh": "การปรับฐานแบบผสมมักแสดงความผันผวนและโมเมนตัมที่ลดลงเรื่อย ๆ เมื่อรูปแบบดำเนินไป โดยเฉพาะเมื่อองค์ประกอบสุดท้ายเป็น triangle ซึ่งสะท้อนถึงตลาดที่กำลังเข้าสู่ภาวะสะสมพลังงานและพลังทิศทางกำลังหมดลงก่อนที่เทรนด์เดิมจะกลับมาดำเนินต่อ"}, {"id": "v2q10", "text": "Combination corrections (doubles/triples) most often serve which purpose within the overall wave count?", "choices": [{"id": "a", "letter": "A", "text": "To deliberately violate the wave 2 retracement rule."}, {"id": "b", "letter": "B", "text": "To signal the immediate start of a new wave 1 of one higher degree."}, {"id": "c", "letter": "C", "text": "To reliably predict an imminent market crash."}, {"id": "d", "letter": "D", "text": "To extend the time a correction takes without necessarily exceeding normal price retracement limits, when a single simple correction seems insufficient."}], "correct": ["d"], "expEn": "Combinations arise when the market needs more time to correct than a single simple pattern would provide, without necessarily needing a deeper price retracement — the extra time is achieved by stringing simple patterns together via X waves rather than by going deeper in price.", "expTh": "รูปแบบผสมมักเกิดขึ้นเมื่อตลาดต้องการเวลาในการปรับฐานมากกว่าที่รูปแบบเดี่ยวชุดเดียวจะให้ได้ โดยไม่จำเป็นต้องย้อนราคาลึกลงกว่าเดิม การยืดเวลาทำได้ด้วยการนำรูปแบบเดี่ยวหลายชุดมาเชื่อมต่อกันผ่านคลื่น X แทนที่จะย้อนราคาให้ลึกขึ้น"}, {"id": "v2q11", "text": "In Elliott Wave channeling, the first trendline drawn typically connects which two points?", "choices": [{"id": "a", "letter": "A", "text": "The start of wave 1 and the end of wave 5."}, {"id": "b", "letter": "B", "text": "The ends of waves 1 and 3, followed by a parallel line drawn through the end of wave 2."}, {"id": "c", "letter": "C", "text": "The ends of waves 2 and 4 only."}, {"id": "d", "letter": "D", "text": "The high and low of wave 3 alone."}], "correct": ["b"], "expEn": "Standard channeling begins by connecting the ends of waves 1 and 3 with a trendline, then drawing a parallel line through the end of wave 2, which projects a channel useful for anticipating where wave 4 or wave 5 might terminate.", "expTh": "การทำ channeling แบบมาตรฐานเริ่มจากลากเส้นแนวโน้มเชื่อมปลายคลื่น 1 กับปลายคลื่น 3 จากนั้นลากเส้นขนานผ่านปลายคลื่น 2 ซึ่งจะได้ช่องแนวโน้มที่มีประโยชน์ในการคาดการณ์ว่าคลื่น 4 หรือคลื่น 5 น่าจะจบลงที่ใด"}, {"id": "v2q12", "text": "If price fails to reach the projected upper channel trendline during wave 5, what does this often suggest?", "choices": [{"id": "a", "letter": "A", "text": "That wave 3 was too short to be considered a valid wave 3."}, {"id": "b", "letter": "B", "text": "That wave 5 will necessarily extend far beyond the channel."}, {"id": "c", "letter": "C", "text": "That the entire wave count must automatically be discarded."}, {"id": "d", "letter": "D", "text": "A possible truncated fifth wave or weakening momentum heading into the end of the impulse."}], "correct": ["d"], "expEn": "When wave 5 falls short of the upper channel line, it is a warning sign consistent with weakening momentum and raises the possibility of a truncated fifth wave, prompting analysts to watch for confirming momentum divergence.", "expTh": "เมื่อคลื่น 5 ไม่สามารถไปถึงเส้นขอบบนของช่องแนวโน้มได้ ถือเป็นสัญญาณเตือนที่สอดคล้องกับโมเมนตัมที่อ่อนแรงลง และเพิ่มความเป็นไปได้ของ truncated fifth wave ทำให้นักวิเคราะห์ควรเฝ้าระวังสัญญาณ momentum divergence เพื่อยืนยันเพิ่มเติม"}, {"id": "v2q13", "text": "After wave 3 completes, how is the price channel typically adjusted to help project waves 4 and 5?", "choices": [{"id": "a", "letter": "A", "text": "The channel is discarded entirely once wave 3 completes."}, {"id": "b", "letter": "B", "text": "A new trendline is drawn under waves 2 and 4 (once wave 4 forms), redrawing a parallel channel projected from the wave 3 extreme."}, {"id": "c", "letter": "C", "text": "Only Fibonacci ratios are used from this point; channeling is abandoned after wave 3."}, {"id": "d", "letter": "D", "text": "The original wave 1-3 channel is never adjusted again for the rest of the impulse."}], "correct": ["b"], "expEn": "Once wave 3 and then wave 4 have formed, analysts typically redraw the channel using the waves 2 and 4 trendline, projecting a new parallel line from the wave 3 extreme to refine the target zone for wave 5.", "expTh": "เมื่อคลื่น 3 และคลื่น 4 ก่อตัวเสร็จแล้ว นักวิเคราะห์มักลากช่องแนวโน้มใหม่โดยใช้เส้นที่เชื่อมคลื่น 2 กับคลื่น 4 แล้วลากเส้นขนานจากจุดสุดขั้วของคลื่น 3 เพื่อปรับปรุงโซนเป้าหมายสำหรับคลื่น 5 ให้แม่นยำขึ้น"}, {"id": "v2q14", "text": "What does it typically mean when price decisively breaks below an impulse wave's lower channel line during wave 5?", "choices": [{"id": "a", "letter": "A", "text": "It has no analytical significance whatsoever in Elliott theory."}, {"id": "b", "letter": "B", "text": "It can be an early warning that the impulse has ended or that wave 5 is weaker/shorter than expected."}, {"id": "c", "letter": "C", "text": "It confirms that wave 3 is about to extend even further."}, {"id": "d", "letter": "D", "text": "It guarantees that a new all-time price extreme is imminent."}], "correct": ["b"], "expEn": "A decisive break below the lower channel line during what should be wave 5 is treated as an early warning sign — often preceding confirmation that the impulse has concluded or that wave 5 will be shorter/weaker than the channel projection implied.", "expTh": "การที่ราคาหลุดเส้นขอบล่างของช่องแนวโน้มอย่างเด็ดขาดในช่วงที่ควรจะเป็นคลื่น 5 ถือเป็นสัญญาณเตือนล่วงหน้าที่มักเกิดขึ้นก่อนการยืนยันว่า impulse ได้จบลงแล้ว หรือคลื่น 5 จะสั้น/อ่อนแรงกว่าที่ช่องแนวโน้มคาดการณ์ไว้"}, {"id": "v2q15", "text": "When wave 5 fails to exceed the price extreme of wave 3, this condition is termed:", "choices": [{"id": "a", "letter": "A", "text": "Channel breakout."}, {"id": "b", "letter": "B", "text": "Alternation failure."}, {"id": "c", "letter": "C", "text": "Truncation (a truncated fifth wave), often accompanied by a momentum divergence."}, {"id": "d", "letter": "D", "text": "Extension."}], "correct": ["c"], "expEn": "Truncation describes exactly this situation — wave 5 completes its full internal five-wave structure but fails to surpass wave 3's extreme — and it is frequently accompanied by a bearish (or bullish) divergence on momentum oscillators.", "expTh": "truncation อธิบายสถานการณ์นี้โดยตรง กล่าวคือคลื่น 5 มีโครงสร้างภายในครบ 5 คลื่นสมบูรณ์ แต่ไม่สามารถเคลื่อนเลยจุดสุดขั้วของคลื่น 3 ได้ และมักมาพร้อมกับสัญญาณ momentum divergence ทั้งขาขึ้นและขาลง"}, {"id": "v2q16", "text": "A truncated fifth wave often coincides with which momentum signal?", "choices": [{"id": "a", "letter": "A", "text": "A perfect Fibonacci 1.618 extension of wave 3."}, {"id": "b", "letter": "B", "text": "A momentum reading at an all-time extreme, strongly confirming the new price high."}, {"id": "c", "letter": "C", "text": "A divergence between price and a momentum oscillator, where the oscillator fails to confirm the marginal move."}, {"id": "d", "letter": "D", "text": "No relationship to momentum indicators whatsoever."}], "correct": ["c"], "expEn": "Truncation is commonly accompanied by momentum divergence: the oscillator makes a lower high (or higher low) even as price attempts a marginal new extreme, warning analysts that the underlying strength has already peaked in wave 3.", "expTh": "truncation มักมาพร้อมกับสัญญาณ momentum divergence กล่าวคือ oscillator ทำจุดสูงที่ต่ำลง (หรือจุดต่ำที่สูงขึ้น) แม้ราคาจะพยายามทำจุดสุดขั้วใหม่เพียงเล็กน้อย ซึ่งเตือนนักวิเคราะห์ว่าความแข็งแกร่งที่แท้จริงได้ผ่านจุดสูงสุดไปแล้วตั้งแต่คลื่น 3"}, {"id": "v2q17", "text": "If wave 1 is the extended wave of an impulse (a less common occurrence), what does Elliott theory suggest about waves 3 and 5?", "choices": [{"id": "a", "letter": "A", "text": "Waves 3 and 5 tend to be closer to equal in length and may show alternation with ea
