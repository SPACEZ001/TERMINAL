<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>CEWA21 — SPACEZ Exam Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
:root{
  --bg:#0b0f19;
  --surface:rgba(26,32,48,0.75);
  --surface-hover:rgba(38,47,71,0.85);
  --border:rgba(255,255,255,0.1);
  --lime:#c8f135;
  --lime-glow:rgba(200,241,53,0.35);
  --text:#f0f4f8;
  --muted:#8c9ba5;
  --radius:16px;
  --red:#ff4d4d;
  --green:#4dff91;
  --yellow:#ffd84d;
  --blue:#4d9fff;
  --font-main:'Inter',system-ui,-apple-system,sans-serif;
  --font-thai:'Noto Sans Thai','Inter',system-ui,sans-serif;
  --backdrop-blur:blur(12px);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-main);
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
  line-height:1.55;
}
.th{font-family:var(--font-thai);}
#bg-canvas{position:fixed; inset:0; width:100%; height:100%; z-index:0; opacity:0.55; pointer-events:none;}
#confetti-canvas{position:fixed; inset:0; width:100%; height:100%; z-index:9999; pointer-events:none;}
#app{position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column;}

/* ---------- Layout shells ---------- */
.screen{display:none; flex:1; width:100%; flex-direction:column; align-items:center; padding:32px 16px 80px;}
.screen.active{display:flex;}
.wrap{width:100%; max-width:920px; margin:0 auto;}

/* ---------- Glass surface ---------- */
.glass{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  backdrop-filter:var(--backdrop-blur);
  -webkit-backdrop-filter:var(--backdrop-blur);
  box-shadow:0 8px 32px rgba(0,0,0,0.35);
}

/* ---------- Header / Hero ---------- */
.hero{text-align:center; padding:28px 20px 8px;}
.hero .brand{
  font-weight:800; letter-spacing:0.14em; font-size:clamp(28px,6vw,44px);
  background:linear-gradient(120deg,var(--lime) 0%, var(--blue) 55%, var(--lime) 100%);
  background-size:220% auto;
  -webkit-background-clip:text; background-clip:text; color:transparent;
  animation:shine 6s linear infinite;
}
@keyframes shine{ to{ background-position:220% center; } }
.hero h1{font-size:clamp(18px,3.2vw,24px); font-weight:600; margin-top:6px; color:var(--text);}
.hero p{color:var(--muted); font-size:14px; margin-top:6px;}
.hero p.th{font-size:14px;}

/* ---------- Variant cards ---------- */
.card-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:18px; margin-top:24px;}
.variant-card{
  padding:22px; cursor:pointer; position:relative; overflow:hidden;
  transition:transform .25s ease, border-color .25s ease, box-shadow .25s ease;
  opacity:0; transform:translateY(24px);
}
.variant-card:hover{ transform:translateY(-4px); border-color:var(--lime-glow); box-shadow:0 12px 40px rgba(200,241,53,0.12), 0 8px 32px rgba(0,0,0,0.35); background:var(--surface-hover); }
.variant-card .tag{ display:inline-block; font-size:11px; letter-spacing:.08em; color:var(--bg); background:var(--lime); padding:3px 10px; border-radius:99px; font-weight:700; }
.variant-card h3{ font-size:20px; margin-top:14px; font-weight:700; }
.variant-card .meta{ margin-top:10px; display:flex; gap:14px; color:var(--muted); font-size:13px; flex-wrap:wrap;}
.variant-card .meta span{ display:flex; align-items:center; gap:5px;}
.variant-card .topics{ margin-top:12px; color:var(--muted); font-size:13px; }
.variant-card .resume-pill{ margin-top:12px; display:inline-block; font-size:11px; color:var(--yellow); border:1px solid var(--yellow); padding:2px 8px; border-radius:99px; }
.variant-card .go-btn{ margin-top:16px; width:100%; padding:11px; border-radius:10px; border:1px solid var(--lime-glow); background:transparent; color:var(--lime); font-weight:700; font-family:var(--font-main); cursor:pointer; transition:background .2s, color .2s;}
.variant-card .go-btn:hover{ background:var(--lime); color:var(--bg); }

/* ---------- HUD timer ---------- */
#hud{
  position:fixed; top:16px; right:16px; z-index:50;
  padding:10px 16px; display:flex; align-items:center; gap:10px;
  font-variant-numeric:tabular-nums; font-weight:700; font-size:18px;
}
#hud .dot{ width:8px; height:8px; border-radius:50%; background:var(--lime); }
#hud.warn{ color:var(--yellow); border-color:rgba(255,216,77,0.4); }
#hud.warn .dot{ background:var(--yellow); }
#hud.danger{ color:var(--red); border-color:rgba(255,77,77,0.5); animation:pulse-red 1s ease-in-out infinite; }
#hud.danger .dot{ background:var(--red); }
@keyframes pulse-red{ 0%,100%{ box-shadow:0 0 0 0 rgba(255,77,77,0.5);} 50%{ box-shadow:0 0 0 8px rgba(255,77,77,0);} }

/* ---------- Exam screen ---------- */
.exam-topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:10px;}
.exam-topbar .label{ font-weight:700; letter-spacing:.05em; }
.progress-track{ width:100%; height:6px; background:rgba(255,255,255,0.08); border-radius:99px; overflow:hidden; margin-bottom:22px;}
.progress-fill{ height:100%; background:linear-gradient(90deg,var(--blue),var(--lime)); width:0%; transition:width .4s ease; }
.q-card{ padding:26px; margin-bottom:20px; }
.q-card .q-index{ color:var(--lime); font-weight:700; font-size:13px; letter-spacing:.08em; margin-bottom:10px; }
.q-card .q-text{ font-size:18px; line-height:1.5; font-weight:500; }
.q-card .q-hint{ margin-top:8px; font-size:12.5px; color:var(--muted); }
.choices{ margin-top:20px; display:flex; flex-direction:column; gap:10px; }
.choice{
  display:flex; align-items:flex-start; gap:12px; padding:14px 16px; border-radius:12px;
  border:1px solid var(--border); background:rgba(255,255,255,0.02); cursor:pointer;
  transition:border-color .15s, background .15s, transform .1s;
}
.choice:hover{ border-color:var(--lime-glow); background:rgba(200,241,53,0.05); }
.choice:active{ transform:scale(0.995); }
.choice.selected{ border-color:var(--lime); background:rgba(200,241,53,0.10); box-shadow:0 0 0 1px var(--lime-glow) inset; }
.choice .letter{
  flex:0 0 auto; width:28px; height:28px; border-radius:8px; border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; color:var(--muted);
}
.choice.selected .letter{ border-color:var(--lime); color:var(--lime); }
.choice .ctext{ font-size:15px; padding-top:3px; }
.nav-row{ display:flex; justify-content:space-between; gap:12px; margin-top:8px; }
.btn{ padding:12px 20px; border-radius:10px; border:1px solid var(--border); background:rgba(255,255,255,0.03); color:var(--text); font-family:var(--font-main); font-weight:600; cursor:pointer; transition:background .15s, border-color .15s;}
.btn:hover{ background:rgba(255,255,255,0.08); }
.btn:disabled{ opacity:0.35; cursor:not-allowed; }
.btn-primary{ background:var(--lime); color:var(--bg); border-color:var(--lime); }
.btn-primary:hover{ background:#d9ff5c; }
.btn-danger{ border-color:rgba(255,77,77,0.4); color:var(--red); }
.btn-danger:hover{ background:rgba(255,77,77,0.08); }

/* ---------- Question jump grid ---------- */
.jumpgrid{ display:flex; flex-wrap:wrap; gap:6px; margin:18px 0; }
.jumpgrid .jbtn{
  width:32px; height:32px; border-radius:8px; border:1px solid var(--border); background:rgba(255,255,255,0.02);
  color:var(--muted); font-size:12px; display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.jumpgrid .jbtn.answered{ border-color:var(--blue); color:var(--blue); }
.jumpgrid .jbtn.current{ border-color:var(--lime); color:var(--lime); background:rgba(200,241,53,0.1);}

/* ---------- Results ---------- */
.results-hero{ text-align:center; padding:20px; }
.ring-wrap{ position:relative; width:220px; height:220px; margin:10px auto; }
.ring-wrap svg{ transform:rotate(-90deg); }
.ring-track{ fill:none; stroke:rgba(255,255,255,0.08); stroke-width:14; }
.ring-fill{ fill:none; stroke-width:14; stroke-linecap:round; transition:stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1); }
.ring-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.ring-center .pct{ font-size:38px; font-weight:800; }
.ring-center .frac{ font-size:13px; color:var(--muted); margin-top:2px; }
.grade-badge{ display:inline-block; margin-top:14px; padding:8px 22px; border-radius:99px; font-weight:800; letter-spacing:.06em; font-size:15px; }
.grade-badge.fail{ background:rgba(255,77,77,0.15); color:var(--red); border:1px solid rgba(255,77,77,0.4); }
.grade-badge.pass{ background:rgba(200,241,53,0.15); color:var(--lime); border:1px solid var(--lime-glow); }
.grade-badge.master{ background:rgba(77,255,145,0.15); color:var(--green); border:1px solid rgba(77,255,145,0.4); }
.results-actions{ display:flex; gap:12px; justify-content:center; margin-top:22px; flex-wrap:wrap; }

/* ---------- Review accordion ---------- */
.review-toolbar{ display:flex; justify-content:space-between; align-items:center; margin:28px 0 14px; flex-wrap:wrap; gap:10px;}
.lang-toggle{ display:flex; border:1px solid var(--border); border-radius:10px; overflow:hidden; }
.lang-toggle button{ padding:8px 16px; background:transparent; border:none; color:var(--muted); font-family:var(--font-main); font-weight:600; cursor:pointer; font-size:13px;}
.lang-toggle button.active{ background:var(--lime); color:var(--bg); }
.review-item{ margin-bottom:10px; overflow:hidden; }
.review-head{ padding:16px 18px; display:flex; align-items:center; gap:12px; cursor:pointer; }
.review-head .ri-status{ flex:0 0 auto; width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800;}
.review-head .ri-status.correct{ background:rgba(77,255,145,0.15); color:var(--green); }
.review-head .ri-status.wrong{ background:rgba(255,77,77,0.15); color:var(--red); }
.review-head .ri-qtext{ flex:1; font-size:14.5px; }
.review-head .chev{ color:var(--muted); transition:transform .2s; flex:0 0 auto;}
.review-item.open .chev{ transform:rotate(180deg); }
.review-body{ max-height:0; overflow:hidden; transition:max-height .3s ease; padding:0 18px; }
.review-item.open .review-body{ max-height:1400px; padding:0 18px 18px; }
.review-body .row{ margin-top:10px; font-size:14px; }
.review-body .row .lab{ color:var(--muted); font-size:12px; letter-spacing:.05em; margin-bottom:3px; }
.review-body .ans-pill{ display:inline-block; padding:3px 10px; border-radius:99px; font-size:12.5px; margin:2px 4px 2px 0; border:1px solid var(--border); }
.review-body .ans-pill.correct{ border-color:rgba(77,255,145,0.5); color:var(--green); }
.review-body .ans-pill.wrong{ border-color:rgba(255,77,77,0.5); color:var(--red); }
.review-body .exp-box{ margin-top:8px; padding:12px 14px; border-radius:10px; background:rgba(255,255,255,0.03); border:1px solid var(--border); font-size:14px; line-height:1.6;}

/* ---------- Custom modal ---------- */
#modal-overlay{ position:fixed; inset:0; background:rgba(6,8,14,0.72); backdrop-filter:blur(4px); z-index:200; display:none; align-items:center; justify-content:center; padding:20px;}
#modal-overlay.active{ display:flex; }
#modal-box{ max-width:420px; width:100%; padding:26px; text-align:center; }
#modal-box h4{ font-size:18px; margin-bottom:10px; }
#modal-box p{ color:var(--muted); font-size:14.5px; line-height:1.6; }
#modal-box .modal-actions{ display:flex; gap:10px; margin-top:22px; justify-content:center; }

footer.foot{ text-align:center; color:var(--muted); font-size:12px; padding:24px; }

@media (max-width:640px){
  .ring-wrap{ width:180px; height:180px;}
  .q-card{ padding:20px; }
  #hud{ font-size:15px; padding:8px 12px; }
}
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
}
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<canvas id="confetti-canvas"></canvas>

<div id="app">

  <!-- ============ START SCREEN ============ -->
  <section id="screen-start" class="screen active">
    <div class="wrap">
      <div class="hero">
        <div class="brand">SPACEZ</div>
        <h1>CEWA Mock Exam 21</h1>
        <p>Wave Personality, Extensions &amp; Complex Corrective Structures</p>
        <p class="th">อุปนิสัยคลื่น การยืดตัว และโครงสร้างปรับฐานเชิงซ้อน</p>
      </div>
      <div class="card-grid" id="variant-cards"></div>
    </div>
    <footer class="foot">CEWA Mock Exam Series · SPACEZ Exam Hub · Frost &amp; Prechter Standard</footer>
  </section>

  <!-- ============ EXAM SCREEN ============ -->
  <section id="screen-exam" class="screen">
    <div class="wrap">
      <div class="exam-topbar">
        <div class="label" id="exam-label"></div>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="jumpgrid" id="jumpgrid"></div>
      <div class="glass q-card" id="q-card">
        <div class="q-index" id="q-index"></div>
        <div class="q-text" id="q-text"></div>
        <div class="q-hint" id="q-hint"></div>
        <div class="choices" id="choices"></div>
      </div>
      <div class="nav-row">
        <button class="btn" id="btn-prev" data-action="prev">← ก่อนหน้า</button>
        <button class="btn btn-danger" id="btn-submit" data-action="request-submit">ส่งคำตอบ</button>
        <button class="btn btn-primary" id="btn-next" data-action="next">ถัดไป →</button>
      </div>
    </div>
  </section>

  <!-- ============ RESULTS SCREEN ============ -->
  <section id="screen-results" class="screen">
    <div class="wrap">
      <div class="glass results-hero">
        <div class="ring-wrap">
          <svg viewBox="0 0 220 220" width="220" height="220">
            <circle class="ring-track" cx="110" cy="110" r="94"></circle>
            <circle class="ring-fill" id="ring-fill" cx="110" cy="110" r="94"></circle>
          </svg>
          <div class="ring-center">
            <div class="pct" id="result-pct">0%</div>
            <div class="frac" id="result-frac">0 / 0</div>
          </div>
        </div>
        <div class="grade-badge" id="grade-badge">—</div>
        <div class="results-actions">
          <button class="btn" data-action="go-home">กลับหน้าหลัก</button>
          <button class="btn btn-primary" data-action="retake">ทำข้อสอบชุดนี้อีกครั้ง</button>
        </div>
      </div>

      <div class="review-toolbar">
        <h3>เฉลยและคำอธิบาย · Answer Review</h3>
        <div class="lang-toggle" id="lang-toggle">
          <button data-lang="en" class="active">EN</button>
          <button data-lang="th">TH</button>
        </div>
      </div>
      <div id="review-list"></div>
    </div>
  </section>

</div>

<!-- HUD timer (only shown during exam) -->
<div id="hud" class="glass" style="display:none;">
  <span class="dot"></span><span id="hud-time">45:00</span>
</div>

<!-- Custom modal (replaces window.confirm) -->
<div id="modal-overlay">
  <div class="glass" id="modal-box">
    <h4 id="modal-title">ยืนยัน</h4>
    <p id="modal-msg"></p>
    <div class="modal-actions">
      <button class="btn" data-action="modal-cancel">ยกเลิก</button>
      <button class="btn btn-primary" data-action="modal-confirm">ยืนยัน</button>
    </div>
  </div>
</div>

<script>
window.__CEWA21_DATA__ = {
  examTitle: "CEWA Mock Exam 21",
  subtitleEn: "Wave Personality, Extensions &amp; Complex Corrective Structures",
  subtitleTh: "อุปนิสัยคลื่น การยืดตัว และโครงสร้างปรับฐานเชิงซ้อน",
  variants: {
    v1: { key:"v1", label:"CEWA I", labelTh:"ระดับที่ 1", timeMin:45, type:"single",
          topicsEn:"Impulse waves, corrective structures, Fibonacci, wave degrees, guidelines",
          topicsTh:"คลื่นแรงผลัก, โครงสร้างปรับฐาน, ฟีโบนักชี, องศาคลื่น, แนวทางปฏิบัติ",
          questions: [{"id": "v1q01", "text": "In a standard Elliott impulse wave, how many sub-waves compose the completed sequence in the direction of the larger trend?", "choices": [{"id": "v1q01c_a", "letter": "a", "text": "Five sub-waves (1-2-3-4-5)"}, {"id": "v1q01c_b", "letter": "b", "text": "Eight sub-waves"}, {"id": "v1q01c_c", "letter": "c", "text": "Seven sub-waves"}, {"id": "v1q01c_d", "letter": "d", "text": "Three sub-waves"}], "correct": ["a"], "expEn": "Motive (impulse) waves always subdivide into five waves — three actionary waves (1, 3, 5) and two corrective waves (2, 4) — moving in the direction of the trend one degree higher.", "expTh": "คลื่นแรงผลัก (motive/impulse) จะแบ่งย่อยเป็น 5 คลื่นเสมอ คือคลื่นเคลื่อนไหวตามเทรนด์ 3 คลื่น (1, 3, 5) และคลื่นปรับฐาน 2 คลื่น (2, 4) โดยเคลื่อนไปในทิศทางเดียวกับเทรนด์ใหญ่ที่องศาสูงกว่า"}, {"id": "v1q02", "text": "Which statement correctly describes the rule governing Wave 2's retracement of Wave 1?", "choices": [{"id": "v1q02c_a", "letter": "a", "text": "Wave 2 can never retrace beyond the starting point (origin) of Wave 1"}, {"id": "v1q02c_b", "letter": "b", "text": "Wave 2 must retrace at least 50% of Wave 1"}, {"id": "v1q02c_c", "letter": "c", "text": "Wave 2 can never exceed the price length of Wave 1"}, {"id": "v1q02c_d", "letter": "d", "text": "Wave 2 must always be shorter in time than Wave 4"}], "correct": ["a"], "expEn": "This is one of the three inviolable rules. If price moves beyond wave 1's origin, the count is invalid and must be relabeled.", "expTh": "นี่คือหนึ่งในสามกฎเหล็กของ Elliott Wave หากราคาย้อนกลับเลยจุดเริ่มต้นของคลื่น 1 การนับคลื่นนั้นถือว่าผิดพลาดและต้องปรับป้ายใหม่"}, {"id": "v1q03", "text": "Among the three actionary waves (1, 3, 5) in an impulse, which one can never be the shortest?", "choices": [{"id": "v1q03c_a", "letter": "a", "text": "Wave 5"}, {"id": "v1q03c_b", "letter": "b", "text": "Wave 1"}, {"id": "v1q03c_c", "letter": "c", "text": "None — all three must always be equal in length"}, {"id": "v1q03c_d", "letter": "d", "text": "Wave 3"}], "correct": ["d"], "expEn": "Wave 3 is never the shortest of the three actionary waves; it is frequently the longest, especially in stock market impulses.", "expTh": "คลื่น 3 จะไม่มีวันเป็นคลื่นที่สั้นที่สุดในบรรดาคลื่นเคลื่อนไหวตามเทรนด์ทั้งสาม (1, 3, 5) และมักเป็นคลื่นที่ยาวที่สุดโดยเฉพาะในดัชนีหุ้น"}, {"id": "v1q04", "text": "The 'no overlap' rule in a standard (non-diagonal) impulse in a non-leveraged cash market states that:", "choices": [{"id": "v1q04c_a", "letter": "a", "text": "Wave 4 may not enter the price territory of Wave 1"}, {"id": "v1q04c_b", "letter": "b", "text": "Wave 2 may not enter the price territory of Wave 4"}, {"id": "v1q04c_c", "letter": "c", "text": "Wave 5 may not enter the price territory of Wave 3"}, {"id": "v1q04c_d", "letter": "d", "text": "Wave 1 may not enter the price territory of Wave 3"}], "correct": ["a"], "expEn": "In standard, non-diagonal impulses within non-leveraged cash markets, wave 4 must not overlap wave 1's price territory — a core structural rule (diagonals are the recognized exception).", "expTh": "ในคลื่นแรงผลักมาตรฐานที่ไม่ใช่ diagonal และในตลาดเงินสดที่ไม่มีเลเวอเรจ คลื่น 4 ต้องไม่ทับซ้อนกับช่วงราคาของคลื่น 1 ซึ่งถือเป็นกฎโครงสร้างหลัก (diagonal เป็นข้อยกเว้นที่ยอมรับได้)"}, {"id": "v1q05", "text": "Which waves in a five-wave impulse move in the same direction as the larger trend (actionary/motive waves)?", "choices": [{"id": "v1q05c_a", "letter": "a", "text": "Waves 3, 4, and 5"}, {"id": "v1q05c_b", "letter": "b", "text": "Waves 1, 2, and 3"}, {"id": "v1q05c_c", "letter": "c", "text": "Waves 2 and 4"}, {"id": "v1q05c_d", "letter": "d", "text": "Waves 1, 3, and 5"}], "correct": ["d"], "expEn": "Waves 1, 3, and 5 are the actionary, trend-following waves; waves 2 and 4 are corrective interruptions against the trend.", "expTh": "คลื่น 1, 3 และ 5 คือคลื่นที่เคลื่อนไปตามทิศทางเทรนด์ใหญ่ ส่วนคลื่น 2 และ 4 เป็นคลื่นปรับฐานที่สวนทางเทรนด์ชั่วคราว"}, {"id": "v1q06", "text": "Waves 2 and 4 within an impulse are best described as:", "choices": [{"id": "v1q06c_a", "letter": "a", "text": "Corrective waves that interrupt the underlying trend"}, {"id": "v1q06c_b", "letter": "b", "text": "Waves that must always be equal in length"}, {"id": "v1q06c_c", "letter": "c", "text": "Motive waves that extend the trend"}, {"id": "v1q06c_d", "letter": "d", "text": "Diagonal triangles exclusively"}], "correct": ["a"], "expEn": "Waves 2 and 4 correct the preceding actionary wave and, per the alternation guideline, typically differ from one another in form (sharp vs. sideways).", "expTh": "คลื่น 2 และ 4 เป็นคลื่นปรับฐานที่แก้ไขคลื่นเคลื่อนไหวก่อนหน้า และตามหลัก alternation มักมีรูปแบบต่างกัน เช่น รูปแบบหนึ่งรุนแรงอีกรูปแบบหนึ่งเคลื่อนไหวออกด้านข้าง"}, {"id": "v1q07", "text": "When Wave 3 is the extended wave in an impulse, which price relationship is commonly observed?", "choices": [{"id": "v1q07c_a", "letter": "a", "text": "Wave 3 shows no measurable Fibonacci relationship to Wave 1"}, {"id": "v1q07c_b", "letter": "b", "text": "Wave 3 is often approximately 1.618 times the length of Wave 1"}, {"id": "v1q07c_c", "letter": "c", "text": "Wave 3 is always shorter than Wave 2"}, {"id": "v1q07c_d", "letter": "d", "text": "Wave 3 always equals Wave 1 exactly"}], "correct": ["b"], "expEn": "When wave 3 extends — the most common extension in equity indices — its length frequently approximates 1.618 (or 2.618) times wave 1.", "expTh": "เมื่อคลื่น 3 เป็นคลื่นที่ยืดตัว ซึ่งพบบ่อยที่สุดในดัชนีหุ้น ความยาวของคลื่น 3 มักใกล้เคียง 1.618 เท่า (หรือ 2.618 เท่า) ของคลื่น 1"}, {"id": "v1q08", "text": "In a standard impulse wave, which sub-waves themselves subdivide into five smaller waves?", "choices": [{"id": "v1q08c_a", "letter": "a", "text": "Waves 1, 3, and 5"}, {"id": "v1q08c_b", "letter": "b", "text": "All five waves equally"}, {"id": "v1q08c_c", "letter": "c", "text": "Waves 2 and 4"}, {"id": "v1q08c_d", "letter": "d", "text": "Only Wave 3"}], "correct": ["a"], "expEn": "The actionary waves (1, 3, 5) subdivide into five sub-waves of one lower degree, while the corrective waves (2, 4) subdivide into three (or a variation such as a flat or triangle).", "expTh": "คลื่นเคลื่อนไหวตามเทรนด์ (1, 3, 5) จะแบ่งย่อยเป็น 5 คลื่นย่อยในองศาที่ต่ำกว่า ส่วนคลื่นปรับฐาน (2, 4) จะแบ่งย่อยเป็น 3 คลื่น หรือรูปแบบอื่น เช่น แฟลตหรือสามเหลี่ยม"}, {"id": "v1q09", "text": "A diagonal triangle variation of the impulse differs from a standard impulse mainly because:", "choices": [{"id": "v1q09c_a", "letter": "a", "text": "It can never occur at the wave 5 or wave C position"}, {"id": "v1q09c_b", "letter": "b", "text": "Wave 4 is permitted to overlap the price territory of Wave 1"}, {"id": "v1q09c_c", "letter": "c", "text": "It contains only three waves in total"}, {"id": "v1q09c_d", "letter": "d", "text": "Wave 3 must be the shortest wave"}], "correct": ["b"], "expEn": "Diagonal triangles are the one motive-wave pattern where overlap between waves 1 and 4 is allowed, reflecting a wedge-shaped, converging structure.", "expTh": "สามเหลี่ยมทแยง (diagonal) เป็นรูปแบบคลื่นแรงผลักแบบเดียวที่อนุญาตให้คลื่น 1 และคลื่น 4 ทับซ้อนกันได้ สะท้อนโครงสร้างรูปลิ่มที่บีบตัวเข้าหากัน"}, {"id": "v1q10", "text": "Which of the following is generally true about Wave 1 within an impulse?", "choices": [{"id": "v1q10c_a", "letter": "a", "text": "Wave 1 never subdivides into smaller waves"}, {"id": "v1q10c_b", "letter": "b", "text": "Wave 1 is frequently the shortest actionary wave and is often mistaken for a corrective move against the prior trend"}, {"id": "v1q10c_c", "letter": "c", "text": "Wave 1 must retrace 100% of the prior trend"}, {"id": "v1q10c_d", "letter": "d", "text": "Wave 1 is always the longest actionary wave"}], "correct": ["b"], "expEn": "Wave 1 often appears corrective in character to most observers and tends to be the shortest of the motive waves, since broad sentiment has not yet shifted.", "expTh": "คลื่น 1 มักดูเหมือนเป็นคลื่นปรับฐานในสายตาผู้สังเกตส่วนใหญ่ และมักเป็นคลื่นเคลื่อนไหวที่สั้นที่สุด เพราะความเชื่อมั่นของตลาดในวงกว้างยังไม่เปลี่ยนทิศทาง"}, {"id": "v1q11", "text": "What is the internal wave structure of a zigzag correction?", "choices": [{"id": "v1q11c_a", "letter": "a", "text": "5-3-3"}, {"id": "v1q11c_b", "letter": "b", "text": "3-3-3"}, {"id": "v1q11c_c", "letter": "c", "text": "3-3-5"}, {"id": "v1q11c_d", "letter": "d", "text": "5-3-5 (Wave A: five, Wave B: three, Wave C: five)"}], "correct": ["d"], "expEn": "A zigzag subdivides A(5)-B(3)-C(5) and is typically sharp, retracing a substantial portion of the prior impulse in the opposite direction.", "expTh": "ซิกแซกแบ่งย่อยเป็น A(5)-B(3)-C(5) และมักเป็นรูปแบบที่รุนแรง ย่อตัวสวนทางคลื่นแรงผลักก่อนหน้าในสัดส่วนที่มาก"}, {"id": "v1q12", "text": "In a regular flat correction, which relationship typically holds among Waves A, B, and C?", "choices": [{"id": "v1q12c_a", "letter": "a", "text": "Wave B retraces roughly 90-100% of Wave A, and Wave C is approximately equal in length to Wave A"}, {"id": "v1q12c_b", "letter": "b", "text": "Wave A is always the longest of the three waves"}, {"id": "v1q12c_c", "letter": "c", "text": "Wave C is always shorter than Wave B"}, {"id": "v1q12c_d", "letter": "d", "text": "Wave B always exceeds the starting point of Wave A"}], "correct": ["a"], "expEn": "In a regular flat, B nearly fully retraces A (about 90-100%), and C is similar in length to A, giving the pattern its sideways, flat appearance.", "expTh": "ในแฟลตแบบปกติ คลื่น B จะย่อตัวกลับเกือบเท่าคลื่น A (ประมาณ 90-100%) และคลื่น C มีความยาวใกล้เคียงกับคลื่น A ทำให้โครงสร้างดูเคลื่อนไหวออกด้านข้าง"}, {"id": "v1q13", "text": "An expanded (irregular) flat correction is distinguished by which feature?", "choices": [{"id": "v1q13c_a", "letter": "a", "text": "The pattern has only three sub-waves with no further subdivision at all"}, {"id": "v1q13c_b", "letter": "b", "text": "Wave B moves beyond the starting point of Wave A, and Wave C extends beyond the ending point of Wave A"}, {"id": "v1q13c_c", "letter": "c", "text": "Wave C is always shorter than Wave A"}, {"id": "v1q13c_d", "letter": "d", "text": "Wave B never exceeds the length of Wave A"}], "correct": ["b"], "expEn": "In an expanded flat, B travels past the origin of A, and C travels beyond the terminus of A, making the whole structure larger than a regular flat.", "expTh": "ในแฟลตแบบขยาย (expanded flat) คลื่น B จะเคลื่อนเลยจุดเริ่มต้นของคลื่น A และคลื่น C จะเคลื่อนเลยจุดสิ้นสุดของคลื่น A ทำให้โครงสร้างโดยรวมใหญ่กว่าแฟลตปกติ"}, {"id": "v1q14", "text": "A 'running flat' correction is characterized by which behavior?", "choices": [{"id": "v1q14c_a", "letter": "a", "text": "Wave B always retraces less than 50% of Wave A"}, {"id": "v1q14c_b", "letter": "b", "text": "It can only occur at the Wave 4 position"}, {"id": "v1q14c_c", "letter": "c", "text": "Wave C always exceeds Wave A by 161.8%"}, {"id": "v1q14c_d", "letter": "d", "text": "Wave C fails to travel the full length of Wave A, falling short of the prior price extreme"}], "correct": ["d"], "expEn": "A running flat reflects strong underlying trend force — wave C falls short of fully retracing, signaling that the next impulse is likely to be powerful.", "expTh": "running flat สะท้อนแรงเทรนด์ที่แข็งแกร่งอยู่เบื้องหลัง เพราะคลื่น C ไม่สามารถย่อตัวได้ครบตามคลื่น A ซึ่งมักเป็นสัญญาณว่าคลื่นแรงผลักถัดไปจะมีพลังมาก"}, {"id": "v1q15", "text": "Contracting triangles subdivide into how many overlapping legs, and what is each leg's typical internal structure?", "choices": [{"id": "v1q15c_a", "letter": "a", "text": "Three legs, each a five-wave structure"}, {"id": "v1q15c_b", "letter": "b", "text": "Seven legs of mixed structure"}, {"id": "v1q15c_c", "letter": "c", "text": "Five legs, labeled A-B-C-D-E, each normally a three-wave (corrective) structure"}, {"id": "v1q15c_d", "letter": "d", "text": "Nine legs of mixed structure"}], "correct": ["c"], "expEn": "Triangles (contracting, expanding, and barrier) have five overlapping legs, A through E, each of which is normally itself a three-wave corrective structure.", "expTh": "สามเหลี่ยม (ทั้งแบบหด, ขยาย และ barrier) มีขา 5 ขาที่ทับซ้อนกัน ตั้งแต่ A ถึง E โดยแต่ละขามักเป็นโครงสร้างปรับฐาน 3 คลื่นย่อย"}, {"id": "v1q16", "text": "In a contracting triangle, how do successive legs (A, B, C, D, E) generally behave?", "choices": [{"id": "v1q16c_a", "letter": "a", "text": "Legs alternate unpredictably between five-wave and three-wave subdivisions"}, {"id": "v1q16c_b", "letter": "b", "text": "Each successive leg becomes progressively larger"}, {"id": "v1q16c_c", "letter": "c", "text": "Each leg must retrace exactly 61.8% of the prior leg"}, {"id": "v1q16c_d", "letter": "d", "text": "Each successive leg becomes progressively smaller in price range, converging toward an apex"}], "correct": ["d"], "expEn": "A contracting triangle's boundary trendlines converge because each leg travels a shorter distance than the one before it, producing the wedge-like shape.", "expTh": "เส้นแนวโน้มขอบของสามเหลี่ยมแบบหดตัวจะบีบเข้าหากัน เพราะแต่ละขาเคลื่อนที่ในระยะทางสั้นกว่าขาก่อนหน้า ทำให้เกิดรูปทรงคล้ายลิ่ม"}, {"id": "v1q17", "text": "In which structural positions do triangles most commonly appear?", "choices": [{"id": "v1q17c_a", "letter": "a", "text": "As Wave 4 of an impulse, or as Wave B/X of a larger correction"}, {"id": "v1q17c_b", "letter": "b", "text": "Triangles never appear within corrective structures"}, {"id": "v1q17c_c", "letter": "c", "text": "Only as Wave 5 of an impulse"}, {"id": "v1q17c_d", "letter": "d", "text": "Only as Wave 1 of an impulse"}], "correct": ["a"], "expEn": "Triangles most frequently occur as wave 4, as the B wave of a larger correction, or as the final X-wave separator prior to a thrust — rarely at wave 2.", "expTh": "สามเหลี่ยมมักปรากฏเป็นคลื่น 4 ของคลื่นแรงผลัก หรือเป็นคลื่น B/X ของโครงสร้างปรับฐานที่ใหญ่กว่า และพบได้น้อยมากในตำแหน่งคลื่น 2"}, {"id": "v1q18", "text": "What typically happens immediately after a triangle pattern completes?", "choices": [{"id": "v1q18c_a", "letter": "a", "text": "Another triangle of equal size immediately forms"}, {"id": "v1q18c_b", "letter": "b", "text": "A sharp 'thrust' move occurs whose length approximates the widest leg of the triangle"}, {"id": "v1q18c_c", "letter": "c", "text": "A prolonged sideways consolidation with no clear direction"}, {"id": "v1q18c_d", "letter": "d", "text": "An immediate trend reversal of much larger degree"}], "correct": ["b"], "expEn": "Triangles resolve with a thrust in the direction of the wave that preceded the triangle, and the thrust's length is often approximated by the triangle's widest leg (usually A or B).", "expTh": "สามเหลี่ยมมักจบลงด้วยการพุ่งตัว (thrust) ไปในทิศทางเดียวกับคลื่นก่อนหน้าสามเหลี่ยม และความยาวของการพุ่งตัวมักใกล้เคียงกับขาที่กว้างที่สุดของสามเหลี่ยม (มักเป็นขา A หรือ B)"}, {"id": "v1q19", "text": "A double three or triple three correction is composed of which elements?", "choices": [{"id": "v1q19c_a", "letter": "a", "text": "Three consecutive zigzags with no connecting waves"}, {"id": "v1q19c_b", "letter": "b", "text": "A single flat followed directly by a triangle with no X wave between them"}, {"id": "v1q19c_c", "letter": "c", "text": "Two or three simple corrective patterns joined by connector waves labeled X"}, {"id": "v1q19c_d", "letter": "d", "text": "Two impulse waves joined by a single wave 4"}], "correct": ["c"], "expEn": "Combination corrections link simple corrective structures (zigzags, flats, triangles) via one or more X waves, producing an extended, moderately trending or sideways correction.", "expTh": "โครงสร้างคอมบิเนชัน (double three หรือ triple three) เชื่อมโยงคลื่นปรับฐานแบบง่าย (ซิกแซก, แฟลต, สามเหลี่ยม) เข้าด้วยกันด้วยคลื่น X หนึ่งคลื่นขึ้นไป ทำให้เกิดการปรับฐานที่ยืดเยื้อและมักเคลื่อนไหวออกด้านข้าง"}, {"id": "v1q20", "text": "Compared with motive waves, corrective waves generally behave in which way?", "choices": [{"id": "v1q20c_a", "letter": "a", "text": "They always subdivide into exactly five waves"}, {"id": "v1q20c_b", "letter": "b", "text": "They move with the trend of one larger degree"}, {"id": "v1q20c_c", "letter": "c", "text": "They never retrace any portion of the prior wave"}, {"id": "v1q20c_d", "letter": "d", "text": "They move against the trend of one larger degree and typically subdivide into three waves (or variations such as 3-3-5)"}], "correct": ["d"], "expEn": "Correctives move counter to the larger trend, and their internal structure is most often threefold, with triangles and combinations as elaborations of that basic theme.", "expTh": "คลื่นปรับฐานเคลื่อนสวนทางกับเทรนด์องศาที่ใหญ่กว่า และโครงสร้างภายในมักเป็นแบบ 3 คลื่นเป็นหลัก โดยสามเหลี่ยมและคอมบิเนชันคือรูปแบบต่อยอดจากแนวคิดพื้นฐานนี้"}, {"id": "v1q21", "text": "Which Fibonacci ratio is most commonly associated with a Wave 2 retracement of Wave 1?", "choices": [{"id": "v1q21c_a", "letter": "a", "text": "1.618 times Wave 1"}, {"id": "v1q21c_b", "letter": "b", "text": "0.618 (61.8%) of Wave 1"}, {"id": "v1q21c_c", "letter": "c", "text": "2.618 times Wave 1"}, {"id": "v1q21c_d", "letter": "d", "text": "Exactly 0.236 of Wave 1, with no other ratio possible"}], "correct": ["b"], "expEn": "Wave 2 frequently retraces a deep 61.8% of wave 1 (sometimes 50% or even close to 78.6%), though it may never retrace a full 100%.", "expTh": "คลื่น 2 มักย่อตัวลึกถึง 61.8% ของคลื่น 1 (บางครั้งอาจเป็น 50% หรือใกล้เคียง 78.6%) แต่ต้องไม่ย่อตัวครบ 100% เด็ดขาด"}, {"id": "v1q22", "text": "When Wave 3 is the extended wave, which Fibonacci extension target is commonly used for Wave 3's length?", "choices": [{"id": "v1q22c_a", "letter": "a", "text": "4.236 times the length of Wave 1"}, {"id": "v1q22c_b", "letter": "b", "text": "Exactly equal to Wave 1"}, {"id": "v1q22c_c", "letter": "c", "text": "1.618 times the length of Wave 1"}, {"id": "v1q22c_d", "letter": "d", "text": "0.382 times the length of Wave 1"}], "correct": ["c"], "expEn": "When wave 3 extends beyond wave 1 — the most common extension pattern — 161.8% of wave 1's length is a frequently observed Fibonacci projection for wave 3.", "expTh": "เมื่อคลื่น 3 ยืดตัวเกินคลื่น 1 ซึ่งเป็นรูปแบบการยืดตัวที่พบบ่อยที่สุด เป้าหมาย 161.8% ของความยาวคลื่น 1 มักถูกใช้เป็นเป้าหมายฟีโบนักชีของคลื่น 3"}, {"id": "v1q23", "text": "When Wave 3 is extended, which Fibonacci relationship is commonly cited for Wave 4's retracement?", "choices": [{"id": "v1q23c_a", "letter": "a", "text": "Wave 4 is always exactly equal to Wave 2 in price length"}, {"id": "v1q23c_b", "letter": "b", "text": "There is never a Fibonacci relationship linking Wave 4 to Wave 3"}, {"id": "v1q23c_c", "letter": "c", "text": "Wave 4 must always equal Wave 1 in time duration"}, {"id": "v1q23c_d", "letter": "d", "text": "Wave 4 often retraces about 38.2% of Wave 3"}], "correct": ["d"], "expEn": "A common guideline is that wave 4 often retraces close to 38.2% of wave 3, while waves 2 and 4 tend to display alternating (differing) depth and character relative to each other.", "expTh": "แนวทางที่พบบ่อยคือคลื่น 4 มักย่อตัวประมาณ 38.2% ของคลื่น 3 และคลื่น 2 กับคลื่น 4 มักมีความลึกและรูปแบบที่แตกต่างกันตามหลัก alternation"}, {"id": "v1q24", "text": "The 'wave equality' guideline most often applies to which pair of waves?", "choices": [{"id": "v1q24c_a", "letter": "a", "text": "Wave A and Wave B in every flat correction"}, {"id": "v1q24c_b", "letter": "b", "text": "Wave 1 and Wave 3, always without exception"}, {"id": "v1q24c_c", "letter": "c", "text": "Wave 2 and Wave 4, always without exception"}, {"id": "v1q24c_d", "letter": "d", "text": "Wave 1 and Wave 5, particularly when Wave 3 is the extended wave"}], "correct": ["d"], "expEn": "When wave 3 is extended — the most common case — waves 1 and 5 tend toward equality in length, or wave 5 relates to wave 1 by a ratio such as 0.618 or 1.618.", "expTh": "เมื่อคลื่น 3 เป็นคลื่นที่ยืดตัว ซึ่งเป็นกรณีที่พบบ่อยที่สุด คลื่น 1 และคลื่น 5 มักมีแนวโน้มยาวใกล้เคียงกัน หรือคลื่น 5 สัมพันธ์กับคลื่น 1 ด้วยอัตราส่วนเช่น 0.618 หรือ 1.618"}, {"id": "v1q25", "text": "In a zigzag correction, which Fibonacci relationship is often used to project the length of Wave C relative to Wave A?", "choices": [{"id": "v1q25c_a", "letter": "a", "text": "Wave C often equals 1.0 or 1.618 times the length of Wave A"}, {"id": "v1q25c_b", "letter": "b", "text": "Wave C shows no Fibonacci relationship to Wave A whatsoever"}, {"id": "v1q25c_c", "letter": "c", "text": "Wave C is always exactly 2.618 times Wave A"}, {"id": "v1q25c_d", "letter": "d", "text": "Wave C always equals 0.236 times Wave A"}], "correct": ["a"], "expEn": "In zigzags, C frequently equals A (100%) or extends to 161.8% of A, especially when wave C itself is impulsive and forceful.", "expTh": "ในซิกแซก คลื่น C มักมีความยาวเท่ากับคลื่น A (100%) หรือขยายไปถึง 161.8% ของคลื่น A โดยเฉพาะเมื่อคลื่น C เองมีลักษณะเป็นคลื่นแรงผลักที่ทรงพลัง"}, {"id": "v1q26", "text": "Dividing a number in the Fibonacci sequence by the number two places to its right yields approximately which ratio?", "choices": [{"id": "v1q26c_a", "letter": "a", "text": "Approximately 0.786"}, {"id": "v1q26c_b", "letter": "b", "text": "Approximately 0.618"}, {"id": "v1q26c_c", "letter": "c", "text": "Approximately 0.382"}, {"id": "v1q26c_d", "letter": "d", "text": "Approximately 1.618"}], "correct": ["c"], "expEn": "Dividing a Fibonacci number by the number two positions later in the sequence converges toward approximately 0.382, one of the core ratios used in retracement analysis.", "expTh": "การนำตัวเลขในลำดับฟีโบนักชีหารด้วยตัวเลขที่อยู่ห่างออกไปสองตำแหน่งจะได้ค่าประมาณ 0.382 ซึ่งเป็นหนึ่งในอัตราส่วนหลักที่ใช้ในการวิเคราะห์การย่อตัว"}, {"id": "v1q27", "text": "The golden ratio, 1.618 (phi), is derived from the Fibonacci sequence by which operation?", "choices": [{"id": "v1q27c_a", "letter": "a", "text": "Subtracting two consecutive Fibonacci numbers from each other"}, {"id": "v1q27c_b", "letter": "b", "text": "Dividing a number by the number three positions prior"}, {"id": "v1q27c_c", "letter": "c", "text": "Dividing a number in the sequence by the number immediately preceding it, as the sequence progresses"}, {"id": "v1q27c_d", "letter": "d", "text": "Multiplying any two consecutive Fibonacci numbers together"}], "correct": ["c"], "expEn": "As the Fibonacci sequence progresses, the ratio of a term to the one immediately preceding it converges on 1.618, known as phi or the golden ratio.", "expTh": "เมื่อลำดับฟีโบนักชีดำเนินไป อัตราส่วนของตัวเลขหนึ่งต่อตัวเลขก่อนหน้าจะลู่เข้าสู่ค่า 1.618 ซึ่งรู้จักกันในชื่อ phi หรืออัตราส่วนทองคำ"}, {"id": "v1q28", "text": "Which Fibonacci retracement level is most commonly associated with a relatively shallow Wave 4 correction?", "choices": [{"id": "v1q28c_a", "letter": "a", "text": "100%"}, {"id": "v1q28c_b", "letter": "b", "text": "38.2%"}, {"id": "v1q28c_c", "letter": "c", "text": "78.6%"}, {"id": "v1q28c_d", "letter": "d", "text": "61.8%"}], "correct": ["b"], "expEn": "Wave 4 corrections are often shallower than wave 2, frequently retracing near 38.2% of wave 3, consistent with the alternation guideline regarding retracement depth.", "expTh": "คลื่น 4 มักย่อตัวตื้นกว่าคลื่น 2 โดยมักย่อตัวใกล้ 38.2% ของคลื่น 3 ซึ่งสอดคล้องกับหลัก alternation ในด้านความลึกของการย่อตัว"}, {"id": "v1q29", "text": "In Elliott Wave practice, what is the primary purpose of Fibonacci time analysis?", "choices": [{"id": "v1q29c_a", "letter": "a", "text": "To replace price-based wave counting entirely"}, {"id": "v1q29c_b", "letter": "b", "text": "To estimate probable time windows for turning points, as a secondary tool alongside price-based wave counts"}, {"id": "v1q29c_c", "letter": "c", "text": "To guarantee the exact calendar date of a trend reversal"}, {"id": "v1q29c_d", "letter": "d", "text": "To determine with certainty which wave is extended"}], "correct": ["b"], "expEn": "Fibonacci time ratios can highlight windows where a turn is more probable, but they are supplementary and considerably less reliable than the price-based rules and guidelines.", "expTh": "อัตราส่วนฟีโบนักชีด้านเวลาสามารถบ่งชี้ช่วงเวลาที่มีโอกาสเกิดจุดกลับตัวได้ แต่เป็นเพียงเครื่องมือเสริม และมีความน่าเชื่อถือต่ำกว่ากฎและแนวทางที่อิงจากราคาอย่างมาก"}, {"id": "v1q30", "text": "When Wave 5 (rather than Wave 3) is the extended wave, which Fibonacci relationship is more commonly observed?", "choices": [{"id": "v1q30c_a", "letter": "a", "text": "No Fibonacci relationship is possible in this scenario"}, {"id": "v1q30c_b", "letter": "b", "text": "Wave 1 automatically becomes the longest wave by definition"}, {"id": "v1q30c_c", "letter": "c", "text": "Wave 5's length often relates to the net travel of Waves 1 through 3 by a ratio such as 0.618 or 1.618"}, {"id": "v1q30c_d", "letter": "d", "text": "Wave 5 always equals Wave 3 exactly"}], "correct": ["c"], "expEn": "When wave 5 extends, its length is commonly measured as a Fibonacci multiple of the net distance traveled from the start of wave 1 to the end of wave 3.", "expTh": "เมื่อคลื่น 5 เป็นคลื่นที่ยืดตัว ความยาวของคลื่น 5 มักถูกวัดเป็นสัดส่วนฟีโบนักชีของระยะทางสุทธิตั้งแต่จุดเริ่มต้นคลื่น 1 จนถึงจุดสิ้นสุดคลื่น 3"}, {"id": "v1q31", "text": "In the standard Elliott Wave degree hierarchy (largest to smallest), which degree comes immediately after 'Grand Supercycle'?", "choices": [{"id": "v1q31c_a", "letter": "a", "text": "Primary"}, {"id": "v1q31c_b", "letter": "b", "text": "Cycle"}, {"id": "v1q31c_c", "letter": "c", "text": "Supercycle"}, {"id": "v1q31c_d", "letter": "d", "text": "Intermediate"}], "correct": ["c"], "expEn": "Frost & Prechter's nomenclature runs Grand Supercycle, Supercycle, Cycle, Primary, Intermediate, Minor, Minute, Minuette, Subminuette — each subdividing the degree above it.", "expTh": "ระบบชื่อองศาคลื่นของ Frost & Prechter เรียงจาก Grand Supercycle, Supercycle, Cycle, Primary, Intermediate, Minor, Minute, Minuette, Subminuette โดยแต่ละองศาจะแบ่งย่อยจากองศาที่ใหญ่กว่าถัดไป"}, {"id": "v1q32", "text": "Which wave degree is smaller than 'Minute' but larger than 'Subminuette'?", "choices": [{"id": "v1q32c_a", "letter": "a", "text": "Minuette"}, {"id": "v1q32c_b", "letter": "b", "text": "Primary"}, {"id": "v1q32c_c", "letter": "c", "text": "Minor"}, {"id": "v1q32c_d", "letter": "d", "text": "Intermediate"}], "correct": ["a"], "expEn": "The descending sequence after Minor is Minute, Minuette, then Subminuette — Minuette sits directly between Minute and Subminuette.", "expTh": "ลำดับองศาที่เล็กลงหลัง Minor คือ Minute, Minuette และ Subminuette ตามลำดับ โดย Minuette อยู่ระหว่าง Minute และ Subminuette"}, {"id": "v1q33", "text": "Why is consistent wave-degree labeling important in Elliott Wave analysis?", "choices": [{"id": "v1q33c_a", "letter": "a", "text": "It preserves the correct nesting relationship between waves of different sizes, preventing mislabeled counts"}, {"id": "v1q33c_b", "letter": "b", "text": "It has no analytical importance and is purely cosmetic"}, {"id": "v1q33c_c", "letter": "c", "text": "It replaces the need to apply the wave 2 and wave 4 rules"}, {"id": "v1q33c_d", "letter": "d", "text": "It fixes the exact numerical price target regardless of structure"}], "correct": ["a"], "expEn": "Proper degree labeling ensures a five-wave Minor impulse is correctly recognized as one leg of a larger Intermediate wave, keeping the fractal count internally consistent.", "expTh": "การติดป้ายองศาคลื่นอย่างถูกต้องทำให้คลื่นแรงผลัก 5 คลื่นในองศา Minor ถูกจดจำได้อย่างถูกต้องว่าเป็นส่วนหนึ่งของคลื่นองศา Intermediate ที่ใหญ่กว่า ทำให้การนับคลื่นแบบ fractal มีความสอดคล้องภายใน"}, {"id": "v1q34", "text": "Elliott Wave structures are described as 'fractal' primarily because:", "choices": [{"id": "v1q34c_a", "letter": "a", "text": "Each degree uses a completely different pattern than the degree above or below it"}, {"id": "v1q34c_b", "letter": "b", "text": "Only the largest degree, Grand Supercycle, displays any recognizable wave pattern"}, {"id": "v1q34c_c", "letter": "c", "text": "Fractal behavior applies only to corrective waves, never to impulses"}, {"id": "v1q34c_d", "letter": "d", "text": "The same 5-3 wave patterns repeat at every degree, from the largest scale down to the smallest"}], "correct": ["d"], "expEn": "Elliott's model is self-similar: an Intermediate impulse is built from Minor impulses and corrections, which are in turn built from Minute waves, and so on down the scale.", "expTh": "โมเดลของ Elliott มีลักษณะคล้ายตัวเองในทุกระดับ (self-similar) กล่าวคือคลื่นแรงผลักองศา Intermediate ประกอบขึ้นจากคลื่นองศา Minor ซึ่งประกอบขึ้นจากคลื่นองศา Minute ต่อไปเรื่อยๆ"}, {"id": "v1q35", "text": "A Minor-degree impulse wave is normally composed of sub-waves belonging to which degree?", "choices": [{"id": "v1q35c_a", "letter": "a", "text": "Intermediate"}, {"id": "v1q35c_b", "letter": "b", "text": "Cycle"}, {"id": "v1q35c_c", "letter": "c", "text": "Minute"}, {"id": "v1q35c_d", "letter": "d", "text": "Primary"}], "correct": ["c"], "expEn": "Each impulse subdivides into five waves of the next smaller degree; a Minor wave's five legs are therefore Minute-degree waves.", "expTh": "คลื่นแรงผลักแต่ละคลื่นจะแบ่งย่อยเป็น 5 คลื่นในองศาที่เล็กลงหนึ่งขั้น ดังนั้นคลื่นองศา Minor 5 ขาจึงประกอบด้วยคลื่นองศา Minute"}, {"id": "v1q36", "text": "Which labeling convention is conventionally used for motive (impulse) waves within a given degree?", "choices": [{"id": "v1q36c_a", "letter": "a", "text": "Greek letters exclusively at every degree"}, {"id": "v1q36c_b", "letter": "b", "text": "Numbers (1, 2, 3, 4, 5)"}, {"id": "v1q36c_c", "letter": "c", "text": "Roman numerals exclusively at every degree"}, {"id": "v1q36c_d", "letter": "d", "text": "Letters (A, B, C)"}], "correct": ["b"], "expEn": "Motive waves are conventionally numbered 1 through 5, while corrective waves use letters (A, B, C, or A-B-C-D-E for triangles); notation style (circles, boxes) often varies by degree.", "expTh": "คลื่นแรงผลักมักติดป้ายด้วยตัวเลข 1 ถึง 5 ตามธรรมเนียม ส่วนคลื่นปรับฐานใช้ตัวอักษร A, B, C (หรือ A-B-C-D-E สำหรับสามเหลี่ยม) โดยรูปแบบสัญลักษณ์ เช่น วงกลมหรือกล่อง มักแตกต่างกันไปตามองศา"}, {"id": "v1q37", "text": "Which sequence correctly orders three consecutive wave degrees from largest to smallest?", "choices": [{"id": "v1q37c_a", "letter": "a", "text": "Cycle, Primary, Supercycle"}, {"id": "v1q37c_b", "letter": "b", "text": "Minor, Intermediate, Primary"}, {"id": "v1q37c_c", "letter": "c", "text": "Primary, Intermediate, Minor"}, {"id": "v1q37c_d", "letter": "d", "text": "Intermediate, Primary, Cycle"}], "correct": ["c"], "expEn": "The standard hierarchy runs ...Cycle, Primary, Intermediate, Minor, Minute..., so Primary is larger than Intermediate, which is larger than Minor.", "expTh": "ลำดับชั้นมาตรฐานเรียงจาก ...Cycle, Primary, Intermediate, Minor, Minute... ดังนั้น Primary จึงใหญ่กว่า Intermediate และ Intermediate ใหญ่กว่า Minor"}, {"id": "v1q38", "text": "Why might an analyst intentionally count from a lower degree before committing to a higher-degree wave label?", "choices": [{"id": "v1q38c_a", "letter": "a", "text": "To confirm the internal 5-3 subdivisions are structurally valid before assigning a higher-degree wave number with confidence"}, {"id": "v1q38c_b", "letter": "b", "text": "Because higher-degree waves are exempt from the standard Elliott rules"}, {"id": "v1q38c_c", "letter": "c", "text": "Because lower-degree counts are always more reliable regardless of context"}, {"id": "v1q38c_d", "letter": "d", "text": "Because degree has no bearing on how rules like wave 2 or wave 4 are applied"}], "correct": ["a"], "expEn": "Since Elliott rules (e.g., wave 2 retracement, no-overlap) must hold at every degree, verifying the smaller subdivisions first helps confirm that a larger-degree label is structurally valid.", "expTh": "เนื่องจากกฎของ Elliott (เช่น การย่อตัวของคลื่น 2, การไม่ทับซ้อนของคลื่น 4) ต้องเป็นจริงในทุกองศา การตรวจสอบคลื่นย่อยองศาเล็กก่อนจะช่วยยืนยันว่าป้ายคลื่นองศาใหญ่กว่านั้นถูกต้องตามโครงสร้าง"}, {"id": "v1q39", "text": "In Frost & Prechter's nomenclature, which wave degree sits directly above 'Cycle' and directly below 'Grand Supercycle'?", "choices": [{"id": "v1q39c_a", "letter": "a", "text": "Primary"}, {"id": "v1q39c_b", "letter": "b", "text": "Millennium"}, {"id": "v1q39c_c", "letter": "c", "text": "Intermediate"}, {"id": "v1q39c_d", "letter": "d", "text": "Supercycle"}], "correct": ["d"], "expEn": "The hierarchy places Supercycle directly above Cycle and directly below Grand Supercycle in Frost & Prechter's standard nine-degree naming system.", "expTh": "ในระบบชื่อองศาคลื่น 9 ระดับมาตรฐานของ Frost & Prechter องศา Supercycle อยู่เหนือ Cycle และอยู่ต่ำกว่า Grand Supercycle"}, {"id": "v1q40", "text": "A common source of analytical error related to wave degree is:", "choices": [{"id": "v1q40c_a", "letter": "a", "text": "Mislabeling a wave of one degree as belonging to a different degree, causing inconsistent rule application"}, {"id": "v1q40c_b", "letter": "b", "text": "Applying the alternation guideline to corrective waves"}, {"id": "v1q40c_c", "letter": "c", "text": "Using Fibonacci ratios at more than one degree simultaneously"}, {"id": "v1q40c_d", "letter": "d", "text": "Observing that motive waves subdivide into five waves"}], "correct": ["a"], "expEn": "Because rules such as the wave 4 no-overlap constraint must hold at the degree being labeled, misassigning degree can make an otherwise valid count appear to violate the rules, or vice versa.", "expTh": "เนื่องจากกฎ เช่น การไม่ทับซ้อนของคลื่น 4 ต้องเป็นจริงในองศาที่กำลังติดป้ายอยู่ การกำหนดองศาผิดพลาดอาจทำให้การนับคลื่นที่ถูกต้องดูเหมือนผิดกฎ หรือในทางกลับกัน"}, {"id": "v1q41", "text": "The guideline of 'alternation' generally suggests that:", "choices": [{"id": "v1q41c_a", "letter": "a", "text": "Wave 2 must always be sharp and Wave 4 must always be sideways, with no exceptions"}, {"id": "v1q41c_b", "letter": "b", "text": "If Wave 2 is a sharp correction, Wave 4 is likely to be a sideways (flat or triangle-type) correction, or vice versa"}, {"id": "v1q41c_c", "letter": "c", "text": "Alternation applies only to impulse Waves 1 and 3"}, {"id": "v1q41c_d", "letter": "d", "text": "Wave 2 and Wave 4 must always be identical in form"}], "correct": ["b"], "expEn": "Alternation is a guideline, not a rule — it suggests corrective waves 2 and 4 will differ in character (sharp vs. sideways) to add variety, though exceptions do occur.", "expTh": "Alternation เป็นแนวทาง (guideline) ไม่ใช่กฎเหล็ก โดยบ่งชี้ว่าคลื่นปรับฐาน 2 และ 4 มักมีลักษณะต่างกัน (รุนแรงกับเคลื่อนไหวด้านข้าง) เพื่อเพิ่มความหลากหลาย แม้จะมีข้อยกเว้นเกิดขึ้นได้"}, {"id": "v1q42", "text": "Which statement best reflects the guideline concerning Wave 5's typical minimum reach relative to Wave 3?", "choices": [{"id": "v1q42c_a", "letter": "a", "text": "Wave 5 never displays any Fibonacci relationship to prior waves"}, {"id": "v1q42c_b", "letter": "b", "text": "Wave 5 must always be exactly equal in length to Wave 1"}, {"id": "v1q42c_c", "letter": "c", "text": "Wave 5 typically travels beyond Wave 3's endpoint, though it can occasionally fall short (truncate) in weak trends"}, {"id": "v1q42c_d", "letter": "d", "text": "Wave 5 is strictly prohibited from ever exceeding Wave 3's endpoint"}], "correct": ["c"], "expEn": "While no rule fixes wave 5's minimum length, it typically extends beyond wave 3's endpoint, except in a truncated fifth, which is a recognized (if less common) structural variation.", "expTh": "แม้จะไม่มีกฎตายตัวกำหนดความยาวขั้นต่ำของคลื่น 5 แต่โดยทั่วไปคลื่น 5 มักเคลื่อนเลยจุดสิ้นสุดของคลื่น 3 ยกเว้นกรณี truncated fifth ซึ่งเป็นรูปแบบที่ยอมรับได้แม้จะพบไม่บ่อยนัก"}, {"id": "v1q43", "text": "What is the purpose of the 'channeling' technique in Elliott Wave analysis?", "choices": [{"id": "v1q43c_a", "letter": "a", "text": "To eliminate the need for Fibonacci analysis entirely"}, {"id": "v1q43c_b", "letter": "b", "text": "To determine wave degree with absolute certainty"}, {"id": "v1q43c_c", "letter": "c", "text": "To prove that a wave count is correct beyond any doubt"}, {"id": "v1q43c_d", "letter": "d", "text": "To draw trendlines connecting wave endpoints, estimating the boundaries and likely termination zone of the next wave"}], "correct": ["d"], "expEn": "A channel is typically drawn using the endpoints of waves 2 and 4 as a base line, with a line parallel to it drawn off wave 3, offering a visual guideline for where wave 5 may terminate.", "expTh": "ช่องแนวโน้ม (channel) มักลากโดยใช้จุดสิ้นสุดของคลื่น 2 และ 4 เป็นเส้นฐาน แล้วลากเส้นขนานผ่านจุดสิ้นสุดของคลื่น 3 เพื่อเป็นแนวทางว่าคลื่น 5 อาจจบลงที่บริเวณใด"}, {"id": "v1q44", "text": "Which guideline is commonly cited regarding trading volume during a healthy Wave 3?", "choices": [{"id": "v1q44c_a", "letter": "a", "text": "Volume should always be lowest during Wave 3"}, {"id": "v1q44c_b", "letter": "b", "text": "Volume tends to be heaviest during Wave 3, the strongest of the actionary waves"}, {"id": "v1q44c_c", "letter": "c", "text": "Volume has no relationship to any wave under Elliott Wave theory"}, {"id": "v1q44c_d", "letter": "d", "text": "Volume is always heaviest during Wave 4"}], "correct": ["b"], "expEn": "Since wave 3 usually represents the most powerful and widely recognized move in the sequence, expanding volume during wave 3 is a commonly cited, though not infallible, supporting guideline.", "expTh": "เนื่องจากคลื่น 3 มักเป็นการเคลื่อนไหวที่ทรงพลังและได้รับการยอมรับในวงกว้างที่สุดในลำดับคลื่น ปริมาณการซื้อขายที่ขยายตัวในช่วงคลื่น 3 จึงเป็นแนวทางสนับสนุนที่มักถูกอ้างถึง แม้จะไม่ใช่กฎที่แน่นอนเสมอไป"}, {"id": "v1q45", "text": "The concept of 'wave personality' in Elliott Wave analysis refers to:", "choices": [{"id": "v1q45c_a", "letter": "a", "text": "A rule that overrides the wave 2 retracement rule"}, {"id": "v1q45c_b", "letter": "b", "text": "The typical character, sentiment, and market behavior associated with each numbered/lettered wave position"}, {"id": "v1q45c_c", "letter": "c", "text": "A method used exclusively to determine wave degree"}, {"id": "v1q45c_d", "letter": "d", "text": "The exact price target of each wave, calculated purely from Fibonacci ratios"}], "correct": ["b"], "expEn": "Each wave position (1 through 5, A through C) tends to display recognizable characteristics — e.g., wave 3 is often powerful and widely recognized — that aid subjective confirmation of a proposed count.", "expTh": "แต่ละตำแหน่งคลื่น (1 ถึง 5, A ถึง C) มักมีลักษณะเฉพาะที่จดจำได้ เช่น คลื่น 3 มักทรงพลังและเป็นที่ยอมรับในวงกว้าง ซึ่งช่วยยืนยันการนับคลื่นในเชิงอัตวิสัยได้"}, {"id": "v1q46", "text": "Which of the following is a guideline rather than an inviolable rule in Elliott Wave analysis?", "choices": [{"id": "v1q46c_a", "letter": "a", "text": "Wave 3 cannot be the shortest of Waves 1, 3, and 5"}, {"id": "v1q46c_b", "letter": "b", "text": "Wave 4 cannot overlap Wave 1's price territory in a standard, non-diagonal impulse"}, {"id": "v1q46c_c", "letter": "c", "text": "Wave 4 will often retrace roughly 38.2% of Wave 3"}, {"id": "v1q46c_d", "letter": "d", "text": "Wave 2 cannot retrace more than 100% of Wave 1"}], "correct": ["c"], "expEn": "Retracement depth (such as the 38.2% tendency) is a guideline that can vary from case to case, whereas the wave 2, wave 3, and wave 4 overlap constraints are treated as firm structural rules.", "expTh": "ความลึกของการย่อตัว เช่น แนวโน้ม 38.2% เป็นเพียงแนวทางที่อาจแตกต่างกันไปในแต่ละกรณี ในขณะที่ข้อจำกัดเรื่องคลื่น 2, คลื่น 3 และการทับซ้อนของคลื่น 4 ถือเป็นกฎโครงสร้างที่แน่นอน"}, {"id": "v1q47", "text": "Beyond differing in form (sharp vs. sideways), the alternation guideline between Wave 2 and Wave 4 also frequently extends to:", "choices": [{"id": "v1q47c_a", "letter": "a", "text": "A strict requirement that Wave 2 must always take longer than Wave 4"}, {"id": "v1q47c_b", "letter": "b", "text": "Differences in the time duration each correction takes to complete"}, {"id": "v1q47c_c", "letter": "c", "text": "The complete elimination of triangles as a possible Wave 4 form"}, {"id": "v1q47c_d", "letter": "d", "text": "A rule that forces both waves to be zigzags"}], "correct": ["b"], "expEn": "Beyond just corrective form, alternation is often observed in the time each correction takes, adding another dimension to the guideline beyond shape alone.", "expTh": "นอกเหนือจากรูปแบบของคลื่นปรับฐานแล้ว หลัก alternation ยังมักปรากฏในด้านระยะเวลาที่แต่ละคลื่นปรับฐานใช้ในการสร้างตัว ซึ่งเป็นอีกมิติหนึ่งของแนวทางนี้นอกเหนือจากรูปทรง"}, {"id": "v1q48", "text": "Which statement correctly reflects proper use of the 'guideline of equality' between Wave 1 and Wave 5?", "choices": [{"id": "v1q48c_a", "letter": "a", "text": "It requires Wave 1 and Wave 5 to have identical time duration as well as price length"}, {"id": "v1q48c_b", "letter": "b", "text": "It is an unbreakable rule that invalidates any count where Wave 1 and Wave 5 differ in length"}, {"id": "v1q48c_c", "letter": "c", "text": "It applies only when Wave 1, rather than Wave 3, is the extended wave"}, {"id": "v1q48c_d", "letter": "d", "text": "It is a helpful tendency, especially when Wave 3 is extended, rather than a strict structural requirement"}], "correct": ["d"], "expEn": "Being a guideline, wave 1/wave 5 equality is a useful tendency for gauging price targets, but deviations are common and do not by themselves invalidate an otherwise valid wave count.", "expTh": "เนื่องจากเป็นเพียงแนวทาง ความเท่ากันของคลื่น 1 และคลื่น 5 จึงเป็นแนวโน้มที่มีประโยชน์ในการประเมินเป้าหมายราคา แต่ความแตกต่างที่เกิดขึ้นเป็นเรื่องปกติและไม่ได้ทำให้การนับคลื่นที่ถูกต้องผิดไปแต่อย่างใด"}, {"id": "v1q49", "text": "Which of the following is generally treated as a rule, rather than a mere guideline, within the Elliott Wave Principle?", "choices": [{"id": "v1q49c_a", "letter": "a", "text": "Trading volume typically peaks during Wave 3"}, {"id": "v1q49c_b", "letter": "b", "text": "Wave 4 corrections tend to be sideways if Wave 2 was sharp"}, {"id": "v1q49c_c", "letter": "c", "text": "Wave 2 never retraces more than 100% of Wave 1"}, {"id": "v1q49c_d", "letter": "d", "text": "Wave 5 usually exceeds the endpoint of Wave 3"}], "correct": ["c"], "expEn": "The three core structural constraints — wave 2 not exceeding a 100% retracement, wave 3 never the shortest actionary wave, and wave 4 not overlapping wave 1 — are the recognized rules; everything else is a guideline.", "expTh": "ข้อจำกัดโครงสร้างหลักสามข้อ ได้แก่ คลื่น 2 ต้องไม่ย่อตัวเกิน 100%, คลื่น 3 ต้องไม่เป็นคลื่นเคลื่อนไหวที่สั้นที่สุด และคลื่น 4 ต้องไม่ทับซ้อนคลื่น 1 ถือเป็นกฎหลักที่ยอมรับ ส่วนที่เหลือทั้งหมดเป็นเพียงแนวทาง"}, {"id": "v1q50", "text": "Why does the Elliott Wave Principle distinguish between 'rules' and 'guidelines'?", "choices": [{"id": "v1q50c_a", "letter": "a", "text": "Rules must always hold for a wave count to be considered valid, while guidelines describe common tendencies that may have exceptions"}, {"id": "v1q50c_b", "letter": "b", "text": "Rules apply only to corrective waves, while guidelines apply only to impulse waves"}, {"id": "v1q50c_c", "letter": "c", "text": "Rules and guidelines are interchangeable terms with no practical difference"}, {"id": "v1q50c_d", "letter": "d", "text": "Guidelines are stricter than rules and therefore override them"}], "correct": ["a"], "expEn": "This distinction lets analysts apply firm structural checks (rules) to eliminate invalid counts while treating softer tendencies (guidelines) as supporting, rather than decisive, evidence.", "expTh": "การแบ่งแยกนี้ช่วยให้นักวิเคราะห์ใช้การตรวจสอบโครงสร้างที่แน่นอน (กฎ) เพื่อตัดการนับคลื่นที่ผิดพลาดออกไป ในขณะที่ปฏิบัติต่อแนวโน้มที่อ่อนกว่า (แนวทาง) เป็นเพียงหลักฐานสนับสนุน ไม่ใช่ข้อสรุปเด็ดขาด"}] },
    v2: { key:"v2", label:"Level II · Part 1", labelTh:"ระดับที่ 2 · ตอนที่ 1", timeMin:45, type:"single",
          topicsEn:"Wave personality, extensions, truncation, diagonal triangles",
          topicsTh:"บุคลิกคลื่น, การยืดตัว, truncation, สามเหลี่ยมทแยง",
          questions: [{"id": "v2q01", "text": "Which best describes the typical personality of Wave 1 in an impulse?", "choices": [{"id": "v2q01c_a", "letter": "a", "text": "It is always the longest wave and carries the heaviest volume"}, {"id": "v2q01c_b", "letter": "b", "text": "It is marked by extreme euphoria and speculative excess"}, {"id": "v2q01c_c", "letter": "c", "text": "It is universally recognized in real time as the start of a powerful new trend"}, {"id": "v2q01c_d", "letter": "d", "text": "It often appears corrective or tentative, driven by a minority of participants sensing an early change in trend"}], "correct": ["d"], "expEn": "Wave 1 typically unfolds against a backdrop of prevailing sentiment from the prior trend, so few participants recognize it as a genuine trend change while it is forming.", "expTh": "คลื่น 1 มักเกิดขึ้นท่ามกลางความเชื่อมั่นของตลาดที่ยังคงเอนเอียงไปทางเทรนด์เดิม จึงมีผู้เข้าใจว่าเป็นการเปลี่ยนเทรนด์จริงเพียงส่วนน้อยขณะที่คลื่นกำลังก่อตัว"}, {"id": "v2q02", "text": "Which statement best captures the typical personality of Wave 2?", "choices": [{"id": "v2q02c_a", "letter": "a", "text": "It always rallies beyond the starting point of Wave 1"}, {"id": "v2q02c_b", "letter": "b", "text": "It often retraces deeply and convincingly enough that many observers believe the prior trend has resumed"}, {"id": "v2q02c_c", "letter": "c", "text": "It is guaranteed to be sideways price action only"}, {"id": "v2q02c_d", "letter": "d", "text": "It is marked by extremely high volume that exceeds Wave 1"}], "correct": ["b"], "expEn": "Wave 2 often retraces deeply and convincingly, leading many market participants to conclude the old trend is back in force, even though it cannot fully retrace wave 1.", "expTh": "คลื่น 2 มักย่อตัวลึกและน่าเชื่อถือ จนผู้เล่นส่วนใหญ่คิดว่าเทรนด์เดิมกลับมาแล้ว ทั้งที่จริงแล้วคลื่น 2 ไม่สามารถย่อตัวกลับได้ครบ 100% ของคลื่น 1"}, {"id": "v2q03", "text": "Which personality trait is most closely associated with Wave 3?", "choices": [{"id": "v2q03c_a", "letter": "a", "text": "It is always corrective in its internal structure"}, {"id": "v2q03c_b", "letter": "b", "text": "It is the weakest and narrowest wave in the entire sequence"}, {"id": "v2q03c_c", "letter": "c", "text": "It is universally the shortest wave in both price and time"}, {"id": "v2q03c_d", "letter": "d", "text": "Strong, broad participation as the trend becomes widely recognized; it is often the longest and most powerful wave"}], "correct": ["d"], "expEn": "Wave 3 is typically forceful and obvious, attracting the greatest participation and frequently producing gaps, breakaways, and pronounced sub-wave extensions.", "expTh": "คลื่น 3 มักมีพลังและชัดเจนที่สุด ดึงดูดผู้เข้าร่วมตลาดจำนวนมากที่สุด และมักเกิด gap หรือการทะลุแนวต้าน/แนวรับสำคัญ รวมถึงคลื่นย่อยที่ยืดตัวอย่างเด่นชัด"}, {"id": "v2q04", "text": "Which market character does Wave 4 typically reflect?", "choices": [{"id": "v2q04c_a", "letter": "a", "text": "A wave associated exclusively with panic-driven capitulation"}, {"id": "v2q04c_b", "letter": "b", "text": "The strongest trending move within the entire five-wave sequence"}, {"id": "v2q04c_c", "letter": "c", "text": "A corrective, often complex or time-consuming consolidation that follows the strength of Wave 3"}, {"id": "v2q04c_d", "letter": "d", "text": "A wave that always overlaps Wave 1 in a standard, non-diagonal impulse"}], "correct": ["c"], "expEn": "After the strength of wave 3, wave 4 typically corrects in a more time-consuming, complex, or comparatively shallow fashion, frequently alternating in form with wave 2.", "expTh": "หลังจากพลังของคลื่น 3 คลื่น 4 มักปรับฐานในลักษณะที่ใช้เวลานาน ซับซ้อน หรือย่อตัวตื้นกว่า และมักมีรูปแบบสลับกับคลื่น 2 ตามหลัก alternation"}, {"id": "v2q05", "text": "Wave 5 personality, particularly in equity markets, is often marked by which characteristic?", "choices": [{"id": "v2q05c_a", "letter": "a", "text": "Narrower participation than Wave 3, sometimes accompanied by divergences in momentum indicators"}, {"id": "v2q05c_b", "letter": "b", "text": "The complete absence of any possible Fibonacci relationship to prior waves"}, {"id": "v2q05c_c", "letter": "c", "text": "Guaranteed truncation in every single instance"}, {"id": "v2q05c_d", "letter": "d", "text": "Universally greater breadth and volume than Wave 3 in every market"}], "correct": ["a"], "expEn": "Wave 5 advances are frequently narrower in participation than wave 3, and technical divergences (e.g., in momentum oscillators) are a commonly cited, though not universal, personality trait.", "expTh": "การขึ้นของคลื่น 5 มักมีความกว้างของการมีส่วนร่วมของตลาดน้อยกว่าคลื่น 3 และมักเกิด divergence ในอินดิเคเตอร์โมเมนตัม ซึ่งเป็นลักษณะที่พบบ่อยแม้จะไม่ใช่กฎตายตัว"}, {"id": "v2q06", "text": "Which of the three actionary waves (1, 3, or 5) most frequently becomes the 'extended' wave, particularly in equity indices?", "choices": [{"id": "v2q06c_a", "letter": "a", "text": "Wave 3"}, {"id": "v2q06c_b", "letter": "b", "text": "Extension occurs with roughly equal frequency across all three waves"}, {"id": "v2q06c_c", "letter": "c", "text": "Wave 1"}, {"id": "v2q06c_d", "letter": "d", "text": "Wave 5"}], "correct": ["a"], "expEn": "Wave 3 is the most commonly extended wave in stock market impulses, though wave 5 extensions are common in commodities and wave 1 extensions occur less frequently overall.", "expTh": "คลื่น 3 เป็นคลื่นที่ยืดตัวบ่อยที่สุดในคลื่นแรงผลักของตลาดหุ้น ในขณะที่การยืดตัวของคลื่น 5 พบได้บ่อยในตลาดสินค้าโภคภัณฑ์ ส่วนการยืดตัวของคลื่น 1 พบได้น้อยกว่าโดยรวม"}, {"id": "v2q07", "text": "How is an 'extended' wave best defined?", "choices": [{"id": "v2q07c_a", "letter": "a", "text": "A wave that violates the no-overlap rule between Wave 4 and Wave 1"}, {"id": "v2q07c_b", "letter": "b", "text": "A corrective wave that becomes unusually long in time only"}, {"id": "v2q07c_c", "letter": "c", "text": "An actionary wave that subdivides so prominently that its five sub-waves become comparable in scale to the rest of the overall sequence"}, {"id": "v2q07c_d", "letter": "d", "text": "Any wave that simply exceeds the price length of the prior wave"}], "correct": ["c"], "expEn": "Extension refers to an elongated, clearly subdivided actionary wave whose own five sub-waves become nearly equivalent in magnitude to the whole larger five-wave sequence.", "expTh": "การยืดตัว (extension) หมายถึงคลื่นเคลื่อนไหวที่ยืดยาวและแบ่งย่อยได้ชัดเจน จนคลื่นย่อยทั้งห้าของมันมีขนาดใกล้เคียงกับคลื่นแรงผลักหลักทั้งชุด"}, {"id": "v2q08", "text": "When Wave 1 is the extended wave (a comparatively uncommon scenario), what is a typical characteristic of Waves 3 and 5?", "choices": [{"id": "v2q08c_a", "letter": "a", "text": "Waves 3 and 5 tend to approach equality in length relative to each other"}, {"id": "v2q08c_b", "letter": "b", "text": "Wave 2 must then retrace more than 100% of Wave 1"}, {"id": "v2q08c_c", "letter": "c", "text": "Completing Wave 5 becomes structurally impossible"}, {"id": "v2q08c_d", "letter": "d", "text": "Wave 3 must then become the shortest wave, breaking the no-shortest-wave rule"}], "correct": ["a"], "expEn": "When the first wave extends, waves 3 and 5 often approach equality with each other, mirroring the equality guideline that normally applies between waves 1 and 5.", "expTh": "เมื่อคลื่น 1 เป็นคลื่นที่ยืดตัว คลื่น 3 และคลื่น 5 มักมีแนวโน้มยาวใกล้เคียงกัน สะท้อนหลักความเท่ากันที่ปกติจะใช้กับคลื่น 1 และคลื่น 5"}, {"id": "v2q09", "text": "What is a 'double extension'?", "choices": [{"id": "v2q09c_a", "letter": "a", "text": "A sub-wave within an already extended wave itself extends further, producing an unusually elongated overall move"}, {"id": "v2q09c_b", "letter": "b", "text": "A correction following the impulse that extends beyond a 100% retracement"}, {"id": "v2q09c_c", "letter": "c", "text": "Two separate impulse waves of the same degree occurring back-to-back with no intervening correction"}, {"id": "v2q09c_d", "letter": "d", "text": "A situation where Wave 2 and Wave 4 both extend simultaneously"}], "correct": ["a"], "expEn": "Occasionally a wave within an extended wave (for example, wave 3 of wave 3) extends again, compounding the elongation and often producing extreme Fibonacci-multiple price moves.", "expTh": "บางครั้งคลื่นย่อยภายในคลื่นที่ยืดตัวอยู่แล้ว (เช่น คลื่น 3 ของคลื่น 3) จะยืดตัวซ้ำอีกครั้ง ทำให้การเคลื่อนไหวยืดยาวยิ่งขึ้นและมักเกิดการเคลื่อนไหวของราคาในสัดส่วนฟีโบนักชีที่รุนแรง"}, {"id": "v2q10", "text": "Why are extended waves particularly useful to an analyst?", "choices": [{"id": "v2q10c_a", "letter": "a", "text": "Because they guarantee the market will reverse immediately after the extension completes"}, {"id": "v2q10c_b", "letter": "b", "text": "Because they help identify which wave is likely to display the clearest five-wave subdivision for counting purposes"}, {"id": "v2q10c_c", "letter": "c", "text": "Because they prove a wave count can never contain more than one extension"}, {"id": "v2q10c_d", "letter": "d", "text": "Because they eliminate the need to apply the no-overlap rule"}], "correct": ["b"], "expEn": "Because an extended wave shows its five sub-waves clearly, it is often the easiest wave in the sequence to subdivide with confidence, which aids overall wave count identification.", "expTh": "เนื่องจากคลื่นที่ยืดตัวแสดงคลื่นย่อยทั้งห้าอย่างชัดเจน จึงมักเป็นคลื่นที่ง่ายที่สุดในลำดับที่จะแบ่งย่อยได้อย่างมั่นใจ ซึ่งช่วยในการระบุการนับคลื่นโดยรวม"}, {"id": "v2q11", "text": "A 'truncated fifth' (fifth wave failure) occurs when:", "choices": [{"id": "v2q11c_a", "letter": "a", "text": "Wave 5 subdivides into three waves instead of the usual five"}, {"id": "v2q11c_b", "letter": "b", "text": "Wave 5 fails to move beyond the price extreme reached by Wave 3"}, {"id": "v2q11c_c", "letter": "c", "text": "Wave 5 retraces more than 100% of Wave 4"}, {"id": "v2q11c_d", "letter": "d", "text": "Wave 5 always exceeds Wave 3 by at least 61.8%"}], "correct": ["b"], "expEn": "In a truncated fifth, the final actionary wave falls just short of surpassing wave 3's extreme, often occurring after an unusually powerful wave 3 and signaling underlying weakness.", "expTh": "ใน truncated fifth คลื่นเคลื่อนไหวสุดท้ายไม่สามารถทะลุจุดสุดขั้วของคลื่น 3 ได้ ซึ่งมักเกิดขึ้นหลังจากคลื่น 3 ที่ทรงพลังผิดปกติ และเป็นสัญญาณของความอ่อนแอที่ซ่อนอยู่"}, {"id": "v2q12", "text": "Truncated fifth waves most commonly occur following which market condition?", "choices": [{"id": "v2q12c_a", "letter": "a", "text": "Any Wave 2 that retraces more than 90% of Wave 1"}, {"id": "v2q12c_b", "letter": "b", "text": "An unusually weak Wave 1"}, {"id": "v2q12c_c", "letter": "c", "text": "A Wave 4 that overlaps Wave 1"}, {"id": "v2q12c_d", "letter": "d", "text": "An extremely strong Wave 3, which leaves little remaining momentum for Wave 5 to make new price extremes"}], "correct": ["d"], "expEn": "Because wave 3 in a truncation scenario is typically very powerful, the subsequent wave 5 often lacks sufficient strength to exceed it, resulting in the shortfall pattern.", "expTh": "เนื่องจากคลื่น 3 ในสถานการณ์ที่เกิด truncation มักทรงพลังมาก คลื่น 5 ที่ตามมามักไม่มีแรงเพียงพอที่จะทะลุคลื่น 3 ได้ ส่งผลให้เกิดรูปแบบที่คลื่น 5 สั้นกว่าที่ควร"}, {"id": "v2q13", "text": "Which technical clue often helps confirm a suspected truncated fifth wave in real time?", "choices": [{"id": "v2q13c_a", "letter": "a", "text": "A retracement that moves below the starting point of Wave 1"}, {"id": "v2q13c_b", "letter": "b", "text": "A sudden overlap between Wave 1 and Wave 4"}, {"id": "v2q13c_c", "letter": "c", "text": "Divergence in volume and/or momentum indicators as price approaches, but fails to exceed, the Wave 3 high"}, {"id": "v2q13c_d", "letter": "d", "text": "A five-wave subdivision appearing within Wave 2"}], "correct": ["c"], "expEn": "Analysts often watch for weakening volume or bearish/bullish momentum divergence as the fifth wave approaches the third wave's extreme without exceeding it, supporting a truncation interpretation.", "expTh": "นักวิเคราะห์มักสังเกตปริมาณการซื้อขายที่อ่อนแรงลง หรือ divergence ของโมเมนตัม ขณะที่คลื่น 5 เข้าใกล้จุดสุดขั้วของคลื่น 3 แต่ไม่สามารถทะลุไปได้ ซึ่งสนับสนุนการตีความว่าเป็น truncation"}, {"id": "v2q14", "text": "How should a truncated fifth wave be best classified within Elliott Wave theory?", "choices": [{"id": "v2q14c_a", "letter": "a", "text": "A pattern that can only occur at Grand Supercycle degree"}, {"id": "v2q14c_b", "letter": "b", "text": "A pattern that always requires Wave 5 to overlap Wave 1"}, {"id": "v2q14c_c", "letter": "c", "text": "A violation of a core Elliott Wave rule that invalidates the entire count"}, {"id": "v2q14c_d", "letter": "d", "text": "A recognized but less common structural variation of the standard impulse, not a violation of any core rule"}], "correct": ["d"], "expEn": "Truncation does not break any of the three inviolable rules — it is simply an accepted structural variation, most often seen after very strong third waves.", "expTh": "Truncation ไม่ได้ละเมิดกฎเหล็กทั้งสามข้อของ Elliott Wave แต่เป็นเพียงรูปแบบโครงสร้างที่ได้รับการยอมรับ ซึ่งมักพบหลังจากคลื่น 3 ที่ทรงพลังมาก"}, {"id": "v2q15", "text": "If Wave 5 truncates, what does this typically suggest about the trend one degree higher?", "choices": [{"id": "v2q15c_a", "letter": "a", "text": "It guarantees an immediate resumption of the same trend at a larger degree"}, {"id": "v2q15c_b", "letter": "b", "text": "The underlying larger-degree trend may be nearing exhaustion, often preceding a substantial reversal"}, {"id": "v2q15c_c", "letter": "c", "text": "There is no implication whatsoever for higher-degree structure"}, {"id": "v2q15c_d", "letter": "d", "text": "The next impulse of the same degree is guaranteed to extend"}], "correct": ["b"], "expEn": "A truncated fifth is often read as an important warning sign that the larger-degree trend is losing force and that a meaningful reversal may follow.", "expTh": "Truncated fifth มักถูกตีความว่าเป็นสัญญาณเตือนสำคัญว่าเทรนด์องศาที่ใหญ่กว่ากำลังหมดแรง และอาจตามมาด้วยการกลับตัวที่มีนัยสำคัญ"}, {"id": "v2q16", "text": "In which structural position does an 'ending diagonal' typically occur?", "choices": [{"id": "v2q16c_a", "letter": "a", "text": "Only as Wave 2 of a correction"}, {"id": "v2q16c_b", "letter": "b", "text": "Only as Wave 1 of an impulse"}, {"id": "v2q16c_c", "letter": "c", "text": "As Wave 5 of an impulse, or as Wave C of a correction"}, {"id": "v2q16c_d", "letter": "d", "text": "It never occurs at the end of a larger pattern"}], "correct": ["c"], "expEn": "Ending diagonals appear when a move is running out of steam at the conclusion of a larger pattern, most often as wave 5 of an impulse or wave C of a zigzag or flat.", "expTh": "Ending diagonal มักปรากฏเมื่อการเคลื่อนไหวเริ่มหมดแรงในช่วงท้ายของโครงสร้างที่ใหญ่กว่า โดยมักพบเป็นคลื่น 5 ของคลื่นแรงผลัก หรือคลื่น C ของซิกแซกหรือแฟลต"}, {"id": "v2q17", "text": "Which structural feature most distinguishes a diagonal triangle from a standard impulse?", "choices": [{"id": "v2q17c_a", "letter": "a", "text": "Diagonal triangles are always larger in price range than the trend preceding them"}, {"id": "v2q17c_b", "letter": "b", "text": "Wave 4 is permitted to overlap Wave 1's territory, and each leg of an ending diagonal often subdivides into three waves rather than five"}, {"id": "v2q17c_c", "letter": "c", "text": "Diagonal triangles cannot occur at any recognized wave position"}, {"id": "v2q17c_d", "letter": "d", "text": "Diagonal triangles never subdivide into a total of five waves"}], "correct": ["b"], "expEn": "Diagonals are wedge-shaped, five-wave patterns where overlap is allowed, and in an ending diagonal each of the five legs typically subdivides into three, unlike a standard impulse's 5-3-5-3-5 structure.", "expTh": "Diagonal เป็นรูปแบบคลื่น 5 คลื่นทรงลิ่มที่อนุญาตให้เกิดการทับซ้อนได้ และใน ending diagonal แต่ละขาทั้งห้ามักแบ่งย่อยเป็น 3 คลื่น ต่างจากคลื่นแรงผลักมาตรฐานที่เป็น 5-3-5-3-5"}, {"id": "v2q18", "text": "A 'leading diagonal' is most likely to appear in which structural position?", "choices": [{"id": "v2q18c_a", "letter": "a", "text": "As Wave 1 of an impulse, or as Wave A of a zigzag"}, {"id": "v2q18c_b", "letter": "b", "text": "Only as Wave 3 of an impulse"}, {"id": "v2q18c_c", "letter": "c", "text": "Only as Wave 4 of an impulse"}, {"id": "v2q18c_d", "letter": "d", "text": "Only as Wave 5 of an impulse"}], "correct": ["a"], "expEn": "Leading diagonals occur at the start of a move — typically wave 1 of an impulse or wave A of a zigzag — signaling that a new trend is beginning somewhat tentatively, with overlap and a wedge shape.", "expTh": "Leading diagonal มักเกิดขึ้นในช่วงเริ่มต้นของการเคลื่อนไหว โดยทั่วไปเป็นคลื่น 1 ของคลื่นแรงผลัก หรือคลื่น A ของซิกแซก ซึ่งบ่งชี้ว่าเทรนด์ใหม่กำลังเริ่มต้นอย่างไม่มั่นใจนัก พร้อมโครงสร้างทับซ้อนและรูปทรงลิ่ม"}, {"id": "v2q19", "text": "What is a 'throw-over' in the context of an ending diagonal triangle?", "choices": [{"id": "v2q19c_a", "letter": "a", "text": "A pattern that can only occur within a Wave 4 triangle"}, {"id": "v2q19c_b", "letter": "b", "text": "A synonym for Wave 2 retracing 100% of Wave 1"}, {"id": "v2q19c_c", "letter": "c", "text": "A requirement that Wave 3 exceed Wave 1 by exactly 261.8%"}, {"id": "v2q19c_d", "letter": "d", "text": "A brief overshoot of Wave 5 beyond the wedge's upper (or lower) boundary trendline just before a sharp reversal"}], "correct": ["d"], "expEn": "As price nears the diagonal's apex, wave 5 sometimes briefly pierces the converging boundary trendline (a throw-over) shortly before the pattern completes and reverses sharply.", "expTh": "เมื่อราคาเข้าใกล้จุดยอดของ diagonal คลื่น 5 บางครั้งจะทะลุเส้นแนวโน้มขอบที่บีบเข้าหากันเล็กน้อย (throw-over) ก่อนที่รูปแบบจะจบลงและกลับตัวอย่างรุนแรง"}, {"id": "v2q20", "text": "Compared with a standard impulse, price action within an ending diagonal is generally contained by which structure?", "choices": [{"id": "v2q20c_a", "letter": "a", "text": "Expanding trendlines with no overlap permitted between any waves"}, {"id": "v2q20c_b", "letter": "b", "text": "A structure identical in every respect to a standard five-wave impulse"}, {"id": "v2q20c_c", "letter": "c", "text": "Converging, wedge-shaped trendlines with overlapping waves"}, {"id": "v2q20c_d", "letter": "d", "text": "A pattern observable only at Grand Supercycle degree"}], "correct": ["c"], "expEn": "The defining visual feature of an ending diagonal is its converging wedge shape, produced by the permitted overlap between waves 1 and 4, unlike the parallel or expanding channel of a standard impulse.", "expTh": "ลักษณะเด่นของ ending diagonal คือรูปทรงลิ่มที่บีบเข้าหากัน ซึ่งเกิดจากการทับซ้อนที่อนุญาตระหว่างคลื่น 1 และคลื่น 4 ต่างจากช่องแนวโน้มแบบขนานหรือขยายตัวของคลื่นแรงผลักมาตรฐาน"}] },
