          topicsEn:"Complex combinations, channeling, Fibonacci confluence (applied analysis)",
          topicsTh:"คอมบิเนชันซับซ้อน, การลากช่องแนวโน้ม, Fibonacci confluence (ประยุกต์ใช้)",
          questions: [{"id": "v3q01", "text": "Regarding a double three correction (e.g., Flat-X-Zigzag), which of the following statements are correct? (Select 2-3)", "choices": [{"id": "v3q01c_a", "letter": "a", "text": "The pattern is composed of two distinct corrective structures joined by an X wave"}, {"id": "v3q01c_b", "letter": "b", "text": "The X wave is itself a corrective wave and can take various forms, including a zigzag or a triangle"}, {"id": "v3q01c_c", "letter": "c", "text": "The overall combination is classified as a corrective structure, not a motive one"}, {"id": "v3q01c_d", "letter": "d", "text": "A double three must always end with a triangle as its second component structure"}], "correct": ["a", "b", "c"], "expEn": "Combinations link two (or three) simple corrective patterns via an X wave, which is itself corrective and can vary in form; the whole combination remains corrective in nature, not motive. There is no requirement that the pattern end in a triangle.", "expTh": "โครงสร้างคอมบิเนชันเชื่อมโยงคลื่นปรับฐานแบบง่ายสองชุด (หรือสามชุด) เข้าด้วยกันผ่านคลื่น X ซึ่งตัวคลื่น X เองก็เป็นคลื่นปรับฐานและมีรูปแบบได้หลากหลาย และภาพรวมของคอมบิเนชันยังคงเป็นคลื่นปรับฐาน ไม่ใช่คลื่นแรงผลัก อีกทั้งไม่มีข้อบังคับว่าต้องจบด้วยสามเหลี่ยมเสมอไป"}, {"id": "v3q02", "text": "When drawing a standard Elliott channel using Waves 2 and 4 of an impulse, which statements are correct? (Select 2-3)", "choices": [{"id": "v3q02c_a", "letter": "a", "text": "The base trendline connects the endpoints of Wave 2 and Wave 4"}, {"id": "v3q02c_b", "letter": "b", "text": "Wave 5 often terminates near or at the upper (or lower) parallel channel line, providing a useful target guideline"}, {"id": "v3q02c_c", "letter": "c", "text": "A parallel line is drawn through the endpoint of Wave 3, offset from the base trendline"}, {"id": "v3q02c_d", "letter": "d", "text": "The channel guarantees the exact price at which Wave 5 will terminate"}], "correct": ["a", "b", "c"], "expEn": "Standard channeling connects the endpoints of waves 2 and 4 as a base line and draws a parallel line off wave 3; wave 5 frequently ends near this parallel line, which is a helpful guideline but never a guaranteed price.", "expTh": "การลากช่องแนวโน้มมาตรฐานเชื่อมจุดสิ้นสุดของคลื่น 2 และคลื่น 4 เป็นเส้นฐาน แล้วลากเส้นขนานผ่านจุดสิ้นสุดของคลื่น 3 โดยคลื่น 5 มักจบใกล้เส้นขนานนี้ ซึ่งเป็นแนวทางที่มีประโยชน์แต่ไม่ใช่ราคาที่รับประกันแน่นอน"}, {"id": "v3q03", "text": "Regarding a triple three correction, which of the following statements are correct? (Select 2-3)", "choices": [{"id": "v3q03c_a", "letter": "a", "text": "Each of the three component structures must be a zigzag"}, {"id": "v3q03c_b", "letter": "b", "text": "Triple threes are relatively rare compared to double threes"}, {"id": "v3q03c_c", "letter": "c", "text": "Triple threes must always end with a contracting triangle as the final structure"}, {"id": "v3q03c_d", "letter": "d", "text": "It contains three simple corrective patterns connected by two X waves"}], "correct": ["b", "d"], "expEn": "A triple three links three simple corrective patterns with two X waves; the component patterns may be zigzags, flats, or triangles, and no fixed final-structure requirement exists. Triple threes are observed less often than the simpler double three.", "expTh": "Triple three เชื่อมโยงคลื่นปรับฐานแบบง่ายสามชุดด้วยคลื่น X สองคลื่น โดยแต่ละองค์ประกอบอาจเป็นซิกแซก แฟลต หรือสามเหลี่ยมก็ได้ ไม่มีข้อบังคับตายตัวว่าโครงสร้างสุดท้ายต้องเป็นรูปแบบใด และ triple three พบได้น้อยกว่า double three ที่เรียบง่ายกว่า"}, {"id": "v3q04", "text": "Which practices are appropriate when applying Fibonacci confluence analysis to identify a probable reversal zone? (Select 2-3)", "choices": [{"id": "v3q04c_a", "letter": "a", "text": "Using only a single Fibonacci ratio from a single wave and treating that level in isolation as a guaranteed reversal point"}, {"id": "v3q04c_b", "letter": "b", "text": "Overlapping a Wave C = Wave A projection with a 61.8% retracement of the prior impulse to find a converging price cluster"}, {"id": "v3q04c_c", "letter": "c", "text": "Combining retracement levels from one wave relationship with extension levels from a related wave to locate a tighter target zone"}, {"id": "v3q04c_d", "letter": "d", "text": "Extending the confluence check across at least two different wave relationships rather than relying on a single projection"}], "correct": ["b", "c", "d"], "expEn": "Confluence analysis strengthens a target zone by overlapping multiple independent Fibonacci relationships; relying on one isolated ratio from a single wave provides much weaker evidence.", "expTh": "การวิเคราะห์ confluence จะเพิ่มความน่าเชื่อถือของโซนเป้าหมายด้วยการซ้อนทับความสัมพันธ์ฟีโบนักชีที่เป็นอิสระต่อกันหลายชุด การอิงกับอัตราส่วนเดียวจากคลื่นเดียวโดยลำพังจึงให้หลักฐานที่อ่อนกว่ามาก"}, {"id": "v3q05", "text": "Regarding an 'X wave' within a corrective combination, which statements are correct? (Select 2-3)", "choices": [{"id": "v3q05c_a", "letter": "a", "text": "It is itself a corrective wave that separates two or more simple corrective patterns"}, {"id": "v3q05c_b", "letter": "b", "text": "Its direction runs counter to the corrective structures it separates, i.e., it moves back toward the direction of the larger trend"}, {"id": "v3q05c_c", "letter": "c", "text": "It must always take the form of a triangle"}, {"id": "v3q05c_d", "letter": "d", "text": "It always retraces less than 38.2% of the pattern that preceded it"}], "correct": ["a", "b"], "expEn": "An X wave is a corrective wave that connects simple corrective patterns and moves opposite to them (back toward the larger trend); its depth can vary widely, and it is not restricted to any single pattern type such as a triangle.", "expTh": "คลื่น X เป็นคลื่นปรับฐานที่เชื่อมโยงคลื่นปรับฐานแบบง่ายเข้าด้วยกัน และเคลื่อนที่สวนทางกับคลื่นเหล่านั้น (กลับไปในทิศทางเทรนด์ใหญ่) โดยความลึกของคลื่น X แปรผันได้มาก และไม่จำเป็นต้องเป็นรูปแบบสามเหลี่ยมเสมอไป"}, {"id": "v3q06", "text": "When using a logarithmic (percentage) price scale versus an arithmetic scale for channeling large-degree waves, which statements are correct? (Select 2-3)", "choices": [{"id": "v3q06c_a", "letter": "a", "text": "A log scale is generally preferred for wave analysis over long time spans or where price changes are proportionally large"}, {"id": "v3q06c_b", "letter": "b", "text": "Elliott Wave rules such as the no-overlap rule change depending on which price scale is used"}, {"id": "v3q06c_c", "letter": "c", "text": "An arithmetic scale can distort the apparent shape of trendlines when price ranges span multiple magnitudes"}, {"id": "v3q06c_d", "letter": "d", "text": "Because trendline angles can differ between scales, analysts should recheck channel validity when switching from arithmetic to log scale, or vice versa"}], "correct": ["a", "c", "d"], "expEn": "Log scale is preferred for long-term or large-percentage moves because arithmetic scale can visually distort trendline angles; channels should be rechecked when switching scales, but the underlying Elliott rules themselves do not change with scale.", "expTh": "สเกลแบบ log เหมาะกับการวิเคราะห์คลื่นที่มีช่วงเวลานานหรือการเปลี่ยนแปลงราคาตามสัดส่วนที่มาก เพราะสเกลแบบเลขคณิตอาจบิดเบือนมุมของเส้นแนวโน้ม ควรตรวจสอบช่องแนวโน้มใหม่เมื่อเปลี่ยนสเกล แต่กฎของ Elliott Wave เองไม่เปลี่ยนแปลงตามสเกลที่ใช้"}, {"id": "v3q07", "text": "Regarding a 'running' correction (where the correction fails to make significant net progress against the prior trend), which observations are valid? (Select 2-3)", "choices": [{"id": "v3q07c_a", "letter": "a", "text": "It typically appears when the corrective structure sits at a fourth-wave position within a strongly trending market"}, {"id": "v3q07c_b", "letter": "b", "text": "It always signals an imminent trend reversal of the larger degree"}, {"id": "v3q07c_c", "letter": "c", "text": "The running characteristic is a feature only of multi-pattern combinations, never of a single simple correction like a running flat"}, {"id": "v3q07c_d", "letter": "d", "text": "It suggests the larger trend is strong and the correction remains largely sideways relative to its price origin"}], "correct": ["a", "d"], "expEn": "A running correction reflects strong underlying trend force and commonly occurs as wave 4 in a powerful trend; a running flat is itself a simple example of this behavior, and it does not by itself signal an imminent larger-degree reversal.", "expTh": "การปรับฐานแบบ running สะท้อนแรงเทรนด์ที่แข็งแกร่งอยู่เบื้องหลัง และมักพบเป็นคลื่น 4 ในเทรนด์ที่มีพลังมาก โดย running flat เองก็เป็นตัวอย่างของพฤติกรรมนี้ในรูปแบบคลื่นเดี่ยวได้เช่นกัน และไม่ได้เป็นสัญญาณบ่งชี้การกลับตัวขององศาใหญ่ในทันที"}, {"id": "v3q08", "text": "Which practices are valid when using Fibonacci ratios to analyze Wave 4 in relation to an extended Wave 3? (Select 2-3)", "choices": [{"id": "v3q08c_a", "letter": "a", "text": "Projecting Wave 4's likely retracement at approximately 38.2% of Wave 3"}, {"id": "v3q08c_b", "letter": "b", "text": "Checking whether Wave 4's extreme falls within the price territory of Wave 1, which would violate the no-overlap rule"}, {"id": "v3q08c_c", "letter": "c", "text": "Assuming Wave 4 must always take the form of a triangle whenever Wave 2 was a zigzag"}, {"id": "v3q08c_d", "letter": "d", "text": "Comparing Wave 4's time duration to Wave 2's duration as a secondary alternation check"}], "correct": ["a", "b", "d"], "expEn": "Common practice includes projecting a 38.2% retracement for wave 4, checking for a no-overlap violation against wave 1, and comparing wave 2/wave 4 durations; alternation is only a guideline, so wave 4's form is not fixed by wave 2's form.", "expTh": "แนวปฏิบัติทั่วไปได้แก่การประเมินการย่อตัวของคลื่น 4 ที่ราว 38.2% การตรวจสอบว่าคลื่น 4 ทับซ้อนคลื่น 1 หรือไม่ และการเปรียบเทียบระยะเวลาของคลื่น 2 กับคลื่น 4 แต่เนื่องจาก alternation เป็นเพียงแนวทาง รูปแบบของคลื่น 4 จึงไม่ได้ถูกกำหนดตายตัวจากรูปแบบของคลื่น 2"}, {"id": "v3q09", "text": "When two independent, valid wave counts (a primary and an alternate) both satisfy the three core Elliott rules on the same chart, which practices are appropriate? (Select 2-3)", "choices": [{"id": "v3q09c_a", "letter": "a", "text": "Discarding both counts entirely simply because they disagree on the current wave position"}, {"id": "v3q09c_b", "letter": "b", "text": "Maintaining both counts and monitoring which invalidation level is breached first"}, {"id": "v3q09c_c", "letter": "c", "text": "Assigning higher confidence to the count best supported by guidelines such as channeling, Fibonacci confluence, and wave personality"}, {"id": "v3q09c_d", "letter": "d", "text": "Documenting the specific price level that would invalidate each count so it is clear in advance which one would be discarded first"}], "correct": ["b", "c", "d"], "expEn": "Good practice is to hold both valid counts, weigh them using supporting guidelines, and pre-define invalidation levels for each; disagreement between two structurally valid counts is normal and not a reason to discard both.", "expTh": "แนวปฏิบัติที่ดีคือการเก็บทั้งสองแนวคิดที่ยังสมเหตุสมผลไว้ ให้น้ำหนักตามแนวทางสนับสนุนต่างๆ และกำหนดระดับราคาที่จะทำให้แต่ละแนวคิดเป็นโมฆะไว้ล่วงหน้า การที่แนวคิดสองแบบที่ถูกต้องตามโครงสร้างขัดแย้งกันเป็นเรื่องปกติ ไม่ใช่เหตุผลที่จะทิ้งทั้งสองแนวคิด"}, {"id": "v3q10", "text": "Regarding channeling technique applied to a Wave 4 triangle, which statements are correct? (Select 2-3)", "choices": [{"id": "v3q10c_a", "letter": "a", "text": "The triangle's boundary trendlines are irrelevant to estimating the subsequent thrust"}, {"id": "v3q10c_b", "letter": "b", "text": "A thrust target can be estimated by projecting the width of the triangle's widest leg from the breakout point"}, {"id": "v3q10c_c", "letter": "c", "text": "Triangles must always expand rather than contract when appearing at the Wave 4 position"}, {"id": "v3q10c_d", "letter": "d", "text": "Trendlines are drawn connecting the A-C and B-D endpoints to visualize the converging structure"}], "correct": ["b", "d"], "expEn": "Triangle boundaries are drawn A-C and B-D, and the post-triangle thrust is commonly estimated using the triangle's widest leg; contracting triangles (not expanding) are the most common form at wave 4.", "expTh": "เส้นขอบของสามเหลี่ยมลากผ่านจุด A-C และ B-D และการพุ่งตัวหลังสามเหลี่ยมมักประเมินจากความกว้างของขาที่กว้างที่สุด โดยสามเหลี่ยมแบบหดตัว (ไม่ใช่แบบขยาย) เป็นรูปแบบที่พบบ่อยที่สุดในตำแหน่งคลื่น 4"}, {"id": "v3q11", "text": "Which statements correctly describe alternation as applied across corrective combinations? (Select 2-3)", "choices": [{"id": "v3q11c_a", "letter": "a", "text": "Alternation guarantees that the second structure in a combination will always be shorter in time than the first"}, {"id": "v3q11c_b", "letter": "b", "text": "Alternation can also manifest in complexity, with a simpler correction potentially alternating with a more complex one"}, {"id": "v3q11c_c", "letter": "c", "text": "Alternation is a rule that, if violated, automatically invalidates a wave count"}, {"id": "v3q11c_d", "letter": "d", "text": "Alternation may appear in the difference between the first and second (or third) simple pattern within a combination, e.g., a flat followed by a zigzag"}], "correct": ["b", "d"], "expEn": "Alternation within combinations can show up as differing pattern types or differing complexity between component structures, but as a guideline it has no strict enforcement and does not fix relative time duration.", "expTh": "Alternation ในโครงสร้างคอมบิเนชันอาจปรากฏในรูปแบบที่แตกต่างกันหรือความซับซ้อนที่ต่างกันระหว่างองค์ประกอบ แต่เนื่องจากเป็นเพียงแนวทาง จึงไม่มีการบังคับที่ตายตัวและไม่ได้กำหนดระยะเวลาสัมพัทธ์ที่แน่นอน"}, {"id": "v3q12", "text": "As a Wave 5 diagonal triangle nears its apex, which observations support using Fibonacci confluence to locate a reversal target? (Select 2-3)", "choices": [{"id": "v3q12c_a", "letter": "a", "text": "Disregarding trendline convergence entirely since diagonals have no meaningfully defined boundaries"}, {"id": "v3q12c_b", "letter": "b", "text": "Overlapping a projected Wave 5 = Wave 1 relationship, common in diagonals, with the intersection of the converging trendlines"}, {"id": "v3q12c_c", "letter": "c", "text": "Confirming that the projected target aligns with a prior significant support or resistance level from a larger degree"}, {"id": "v3q12c_d", "letter": "d", "text": "Assuming the diagonal can never throw-over its trendline, so any close outside it immediately invalidates the pattern"}], "correct": ["b", "c"], "expEn": "Useful confluence checks include overlapping the common wave 5 = wave 1 diagonal relationship with the trendline apex and confirming alignment with prior significant support/resistance; a brief throw-over beyond the trendline is a recognized diagonal characteristic, not an automatic invalidation.", "expTh": "การตรวจสอบ confluence ที่มีประโยชน์ได้แก่การซ้อนทับความสัมพันธ์คลื่น 5 เท่ากับคลื่น 1 ซึ่งพบบ่อยใน diagonal เข้ากับจุดตัดของเส้นแนวโน้มที่บีบเข้าหากัน และการยืนยันว่าตรงกับแนวรับ/แนวต้านสำคัญจากองศาที่ใหญ่กว่า ส่วนการทะลุเส้นแนวโน้มเล็กน้อย (throw-over) เป็นลักษณะที่ยอมรับได้ของ diagonal ไม่ใช่สิ่งที่ทำให้รูปแบบเป็นโมฆะทันที"}, {"id": "v3q13", "text": "When applying multi-degree wave labeling to a Primary-degree correction composed of Intermediate-degree waves, which practices are correct? (Select 2-3)", "choices": [{"id": "v3q13c_a", "letter": "a", "text": "Degree labels can be assigned arbitrarily as long as the overall correction eventually ends in three waves"}, {"id": "v3q13c_b", "letter": "b", "text": "Each Intermediate wave within the correction should itself satisfy the rules appropriate to its own wave type (impulse or corrective)"}, {"id": "v3q13c_c", "letter": "c", "text": "Fibonacci relationships can be checked both within the Intermediate-degree sub-waves and across the whole Primary-degree structure"}, {"id": "v3q13c_d", "letter": "d", "text": "A Primary-degree correction can be composed of Intermediate-degree structures that are themselves combinations, flats, zigzags, or triangles"}], "correct": ["b", "c", "d"], "expEn": "Multi-degree analysis requires each sub-wave to independently satisfy its own structural rules, allows Fibonacci checks at multiple degrees, and permits any recognized corrective form at the Intermediate level; degree labeling is never arbitrary.", "expTh": "การวิเคราะห์หลายองศาต้องให้คลื่นย่อยแต่ละคลื่นเป็นไปตามกฎโครงสร้างของตัวเองอย่างอิสระ สามารถตรวจสอบความสัมพันธ์ฟีโบนักชีได้ในหลายองศา และอนุญาตให้องศา Intermediate เป็นรูปแบบปรับฐานที่ได้รับการยอมรับใดก็ได้ การติดป้ายองศาจึงไม่สามารถกำหนดขึ้นเองตามใจชอบได้"}, {"id": "v3q14", "text": "Which practices are valid when distinguishing a genuine Wave B within a flat correction from the start of a new impulsive Wave 1? (Select 2-3)", "choices": [{"id": "v3q14c_a", "letter": "a", "text": "Ignoring volume and momentum characteristics, since they never provide useful confirmation in this context"}, {"id": "v3q14c_b", "letter": "b", "text": "Examining whether the move retraces a proportion consistent with flat-type corrections, roughly 90% or more of the prior A wave"}, {"id": "v3q14c_c", "letter": "c", "text": "Checking whether the move subdivides into three waves (favoring a corrective B wave) versus five waves (favoring an impulsive Wave 1)"}, {"id": "v3q14c_d", "letter": "d", "text": "Assuming any upward move following a decline must automatically be Wave B, without checking its internal structure"}], "correct": ["b", "c"], "expEn": "Distinguishing a B wave from a new Wave 1 relies on checking internal subdivision (three vs. five waves) and retracement depth typical of flats; volume and momentum can provide useful secondary confirmation and should not be ignored.", "expTh": "การแยกแยะคลื่น B ออกจากคลื่น 1 ใหม่อาศัยการตรวจสอบการแบ่งย่อยภายใน (สามคลื่นหรือห้าคลื่น) และความลึกของการย่อตัวที่สอดคล้องกับแฟลต ส่วนปริมาณการซื้อขายและโมเมนตัมสามารถใช้เป็นหลักฐานสนับสนุนรองที่มีปร e duration, without reference to price behavior at the channel or Wave 3 level"}, {"id": "v3q19c_d", "letter": "d", "text": "Concluding truncation occurred only after price has already reversed by more than 61.8% of the entire wave sequence"}], "correct": ["a", "b"], "expEn": "Truncation is best confirmed by observing price fail to exceed both the wave 3 extreme and the channel boundary, along with weakening volume/momentum; it is identified at the point of failure to exceed wave 3, not by the size of a subsequent reversal.", "expTh": "Truncation ได้รับการยืนยันได้ดีที่สุดจากการสังเกตว่าราคาไม่สามารถทะลุทั้งจุดสุดขั้วของคลื่น 3 และเส้นขอบช่องแนวโน้มได้ พร้อมกับปริมาณการซื้อขายหรือโมเมนตัมที่อ่อนแรงลง โดยจุดที่ระบุ truncation คือจุดที่ไม่สามารถทะลุคลื่น 3 ได้ ไม่ใช่ขนาดของการกลับตัวที่เกิดขึ้นภายหลัง"}, {"id": "v3q20", "text": "When Fibonacci retracement, extension, and channeling tools disagree on a target zone for the end of a correction, which practices reflect best practice? (Select 2-3)", "choices": [{"id": "v3q20c_a", "letter": "a", "text": "Giving more analytical weight to the zone where multiple independent tools converge (confluence) rather than any single tool in isolation"}, {"id": "v3q20c_b", "letter": "b", "text": "Always following the Fibonacci extension level over channeling or retracement analysis in every case, regardless of context"}, {"id": "v3q20c_c", "letter": "c", "text": "Treating disagreement among the tools as proof that Elliott Wave analysis cannot be applied to the chart at all"}, {"id": "v3q20c_d", "letter": "d", "text": "Maintaining flexibility in the wave count and watching for confirming price or momentum signals as the market approaches candidate zones"}], "correct": ["a", "d"], "expEn": "Best practice weighs confluence zones more heavily and stays flexible while awaiting confirmation, rather than mechanically favoring one tool in all cases or abandoning the analysis outright when tools disagree.", "expTh": "แนวปฏิบัติที่ดีคือการให้น้ำ <script>
(function(){
"use strict";

var DATA = window.__CEWA21_DATA__;
var LS_PREFIX = "cewa21_";

/* ============================================================
   Mulberry32 seeded PRNG + deep-clone Fisher-Yates shuffle
   (functional requirement: never mutate the original question bank)
   ============================================================ */
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function deepClone(obj){ return JSON.parse(JSON.stringify(obj)); }
function seededShuffle(array, rng){
  var a = deepClone(array);
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ============================================================
   Canvas particle background (subtle, non-distracting)
   ============================================================ */
(function bgParticles(){
  var canvas = document.getElementById("bg-canvas");
  var ctx = canvas.getContext("2d");
  var particles = [];
  var W, H;
  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resize);
  resize();
  var count = Math.min(70, Math.floor((W*H)/22000));
  for(var i=0;i<count;i++){
    particles.push({
      x: Math.random()*W, y: Math.random()*H,
      vx: (Math.random()-0.5)*0.15, vy: (Math.random()-0.5)*0.15,
      r: Math.random()*1.6 + 0.4,
      hue: Math.random() < 0.5 ? "200,241,53" : "77,159,255",
      a: Math.random()*0.35 + 0.08
    });
  }
  function tick(){
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<particles.length;i++){
      var p = particles[i];
      p.x += p.vx; p.y += p.vy;
      if(p.x < 0) p.x = W; if(p.x > W) p.x = 0;
      if(p.y < 0) p.y = H; if(p.y > H) p.y = 0;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = "rgba("+p.hue+","+p.a+")";
      ctx.fill();
    }
    // faint connecting lines for nearby particles
    for(var i=0;i<particles.length;i++){
      for(var j=i+1;j<particles.length;j++){
        var dx = particles[i].x-particles[j].x, dy = particles[i].y-particles[j].y;
        var dist = Math.sqrt(dx*dx+dy*dy);
        if(dist < 110){
          ctx.strokeStyle = "rgba(140,155,165,"+(0.06*(1-dist/110))+")";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(tick);
  }
  tick();
})();

/* ============================================================
   Confetti (canvas) on PASS / CEWA MASTER
   ============================================================ */
function fireConfetti(){
  var canvas = document.getElementById("confetti-canvas");
  var ctx = canvas.getContext("2d");
  var W = canvas.width = window.innerWidth;
  var H = canvas.height = window.innerHeight;
  var colors = ["#c8f135", "#4dff91", "#4d9fff", "#ffd84d", "#ffffff"];
  var pieces = [];
  for(var i=0;i<160;i++){
    pieces.push({
      x: Math.random()*W, y: -20 - Math.random()*H*0.5,
      w: 5+Math.random()*6, h: 8+Math.random()*8,
      vx: (Math.random()-0.5)*3, vy: 2+Math.random()*3.5,
      rot: Math.random()*360, vr: (Math.random()-0.5)*10,
      color: colors[Math.floor(Math.random()*colors.length)],
      life: 0
    });
  }
  var maxLife = 220;
  function tick(){
    ctx.clearRect(0,0,W,H);
    var alive = false;
    for(var i=0;i<pieces.length;i++){
      var p = pieces[i];
      p.life++;
      if(p.life > maxLife) continue;
      alive = true;
      p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.vy += 0.02;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(0, 1 - p.life/maxLife);
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    }
    if(alive) requestAnimationFrame(tick);
    else ctx.clearRect(0,0,W,H);
  }
  tick();
}

/* ============================================================
   Custom modal (replaces window.confirm — required for LINE/
   in-app browser compatibility on Android)
   ============================================================ */
var modalResolve = null;
function showModal(title, msg, confirmLabel, cancelLabel){
  var overlay = document.getElementById("modal-overlay");
  document.getElementById("modal-title").textContent = title;
  document.getElementById("modal-msg").textContent = msg;
  var confirmBtn = document.querySelector('#modal-box [data-action="modal-confirm"]');
  var cancelBtn = document.querySelector('#modal-box [data-action="modal-cancel"]');
  confirmBtn.textContent = confirmLabel || "ยืนยัน";
  cancelBtn.style.display = cancelLabel === null ? "none" : "inline-block";
  cancelBtn.textContent = cancelLabel || "ยกเลิก";
  overlay.classList.add("active");
  return new Promise(function(resolve){ modalResolve = resolve; });
}
function hideModal(result){
  document.getElementById("modal-overlay").classList.remove("active");
  if(modalResolve){ modalResolve(result); modalResolve = null; }
}

/* ============================================================
   Application state
   ============================================================ */
var state = {
  screen: "start",
  variantKey: null,
  variant: null,
  order: [],          // shuffled+cloned question array for this attempt
  answers: {},        // qid -> array of selected letters
  currentIndex: 0,
  remainingSeconds: 0,
  timerId: null,
  lang: "en",
  results: null
};

function storageKey(variantKey){ return LS_PREFIX + "progress_" + variantKey; }

function saveProgress(){
  if(!state.variantKey) return;
  try{
    localStorage.setItem(storageKey(state.variantKey), JSON.stringify({
      order: state.order,
      answers: state.answers,
      currentIndex: state.currentIndex,
      remainingSeconds: state.remainingSeconds,
      ts: Date.now()
    }));
  }catch(e){ /* storage unavailable — fail silently, exam still works in-memory */ }
}
function loadProgress(variantKey){
  try{
    var raw = localStorage.getItem(storageKey(variantKey));
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function clearProgress(variantKey){
  try{ localStorage.removeItem(storageKey(variantKey)); }catch(e){}
}

  });

  if(window.gsap){
    gsap.to(".variant-card", {opacity:1, y:0, duration:0.55, stagger:0.12, ease:"power2.out"});
  } else {
    document.querySelectorAll(".variant-card").forEach(function(c){ c.style.opacity=1; c.style.transform="translateY(0)"; });
  }
}

/* ============================================================
   Exam flow
   ============================================================ */
function startVariant(key, resume){
  var v = DATA.variants[key];
  state.variantKey = key;
  state.variant = v;
  state.lang = "en";

  var saved = resume ? loadProgress(key) : null;
  if(saved){
    state.order = saved.order;
    state.answers = saved.answers;
    state.currentIndex = saved.currentIndex;
    state.remainingSeconds = saved.remainingSeconds;
  } else {
    var seed = (Date.now() ^ Math.floor(Math.random()*1e9)) >>> 0;
    var rng = mulberry32(seed);
    // deep clone + shuffle question order, and deep clone + shuffle each question's choices
    var shuffledQuestions = seededShuffle(v.questions, rng);
    shuffledQuestions = shuffledQuestions.map(function(q){
      var qc = deepClone(q);
      qc.choices = seededShuffle(qc.choices, rng);
      return qc;
    });
    state.order = shuffledQuestions;
    state.answers = {};
    state.currentIndex = 0;
    state.remainingSeconds = v.timeMin * 60;
    clearProgress(key);
  }

  goToScreen("exam");
  document.getElementById("hud").style.display = "flex";
  renderExamTopbar();
  renderJumpGrid();
  renderQuestion();
  startTimer();
}

function renderExamTopbar(){
  var v = state.variant;
  document.getElementById("exam-label").textContent = DATA.examTitle + " · " + v.label + " (" + v.labelTh + ")";
}

function renderJumpGrid(){
  var grid = document.getElementById("jumpgrid");
  grid.innerHTML = "";
  state.order.forEach(function(q, idx){
    var b = document.createElement("div");
    b.className = "jbtn" + (state.answers[q.id] && state.answers[q.id].length ? " answered" : "") + (idx === state.currentIndex ? " current" : "");
    b.textContent = (idx+1);
    b.setAttribute("data-action", "jump-to");
    b.setAttribute("data-index", idx);
    grid.appendChild(b);
  });
}

function renderQuestion(){
  var q = state.order[state.currentIndex];
  var total = state.order.length;
  document.getElementById("q-index").textContent = "Question " + (state.currentIndex+1) + " / " + total;
  document.getElementById("q-text").textContent = q.text;
  document.getElementById("q-hint").textContent = state.variant.type === "multi" ? "เลือกคำตอบที่ถูกต้อง 2-3 ข้อ · Select 2-3 correct answers" : "เลือกคำตอบที่ถูกต้องที่สุดเพียงข้อเดียว · Select the single best answer";

  var choicesEl = document.getElementById("choices");
  choicesEl.innerHTML = "";
  var selected = state.answers[q.id] || [];
  q.choices.forEach(function(c){
    var div = document.createElement("div");
    div.className = "choice" + (selected.indexOf(c.letter) > -1 ? " selected" : "");
    div.setAttribute("data-action", "select-choice");
    div.setAttribute("data-letter", c.letter);
    div.innerHTML = '<span class="letter">' + c.letter.toUpperCase() + '</span><span class="ctext">' + escapeHtml(c.text) + '</span>';
    choicesEl.appendChild(div);
  });

  document.getElementById("progress-fill").style.width = (((state.currentIndex+1)/total)*100) + "%";
  document.getElementById("btn-prev").disabled = state.currentIndex === 0;
  document.getElementById("btn-next").textContent = state.currentIndex === total-1 ? "เสร็จสิ้น →" : "ถัดไป →";

  renderJumpGrid();

  if(window.gsap){
    gsap.fromTo("#q-card", {opacity:0, y:16}, {opacity:1, y:0, duration:0.35, ease:"power2.out"});
  }
}

function toggleChoice(letter){
  var q = state.order[state.currentIndex];
  var isMulti = state.variant.type === "multi";
  var current = state.answers[q.id] || [];
  if(isMulti){
    var idx = current.indexOf(letter);
    if(idx > -1){ current.splice(idx,1); } else { current.push(letter); }
  } else {
    current = [letter];
  }
  state.answers[q.id] = current;
  saveProgress();
  renderQuestion();
}

function goNext(){
  var total = state.order.length;
  if(state.currentIndex < total-1){
    state.currentIndex++;
    saveProgress();
    renderQuestion();
  } else {
    requestSubmit();
  }
}
function goPrev(){
  if(state.currentIndex > 0){
    state.currentIndex--;
    saveProgress();
    renderQuestion();
  }
}
function jumpTo(idx){
  state.currentIndex = idx;
  saveProgress();
  renderQuestion();
}

/* ---------- Timer ---------- */
function startTimer(){
  updateHud();
  if(state.timerId) clearInterval(state.timerId);
  state.timerId = setInterval(function(){
    state.remainingSeconds--;
    if(state.remainingSeconds <= 0){
      state.remainingSeconds = 0;
      updateHud();
      clearInterval(state.timerId);
      showModal("หมดเวลา · Time's up", "เวลาทำข้อสอบหมดแล้ว ระบบจะส่งคำตอบให้อัตโนมัติ", "ดูผลคะแนน", null).then(function(){
        finishExam();
      });
      return;
    }
    updateHud();
    if(state.remainingSeconds % 5 === 0) saveProgress();
  }, 1000);
}
function updateHud(){
  var hud = document.getElementById("hud");
  var m = Math.floor(state.remainingSeconds/60);
  var s = state.remainingSeconds%60;
  document.getElementById("hud-time").textContent = (m<10?"0":"")+m + ":" + (s<10?"0":"")+s;
  hud.classList.remove("warn","danger");
  if(state.remainingSeconds <= 60) hud.classList.add("danger");
  else if(state.remainingSeconds <= 300) hud.classList.add("warn");
}

/* ---------- Submit / grading ---------- */
function requestSubmit(){
  var total = state.order.length;
  var answeredCount = Object.keys(state.answers).filter(function(k){ return state.answers[k] && state.answers[k].length; }).length;
  var unanswered = total - answeredCount;
  var msg = unanswered > 0
    ? "คุณยังตอบไม่ครบ " + unanswered + " ข้อ ต้องการส่งคำตอบตอนนี้เลยหรือไม่?"
    : "ต้องการส่งคำตอบและดูผลคะแนนหรือไม่?";
  showModal("ยืนยันการส่งคำตอบ · Submit exam?", msg, "ส่งคำตอบ", "ทำต่อ").then(function(ok){
    if(ok) finishExam();
  });
}

function arraysEqual(a,b){
  if(a.length !== b.length) return false;
  var sa = a.slice().sort(), sb = b.slice().sort();
  for(var i=0;i<sa.length;i++){ if(sa[i]!==sb[i]) return false; }
  return true;
}

function finishExam(){
  if(state.timerId) clearInterval(state.timerId);
  document.getElementById("hud").style.display = "none";

  var correctCount = 0;
  var reviewData = state.order.map(function(q){
    var userAns = state.answers[q.id] || [];
    var isCorrect = arraysEqual(userAns, q.correct);
    if(isCorrect) correctCount++;
    return { q: q, userAns: userAns, isCorrect: isCorrect };
  });

  var total = state.order.length;
  var pct = total ? Math.round((correctCount/total)*100) : 0;
  var tier = pct >= 90 ? "master" : (pct >= 80 ? "pass" : "fail");

  state.results = { correctCount: correctCount, total: total, pct: pct, tier: tier, review: reviewData };
  clearProgress(state.variantKey);
  goToScreen("results");
  renderResults();
}

/* ============================================================
   Results screen
   ============================================================ */
function renderResults(){
  var r = state.results;
  document.getElementById("result-pct").textContent = r.pct + "%";
  document.getElementById("result-frac").textContent = r.correctCount + " / " + r.total;

  var badge = document.getElementById("grade-badge");
  badge.className = "grade-badge " + r.tier;
  badge.textContent = r.tier === "master" ? "CEWA MASTER" : (r.tier === "pass" ? "PASS" : "FAIL");

  var ring = document.getElementById("ring-fill");
  var circumference = 2 * Math.PI * 94;
  ring.style.stroke = r.tier === "fail" ? "var(--red)" : (r.tier === "pass" ? "var(--lime)" : "var(--green)");
  ring.style.strokeDasharray = circumference;
  ring.style.strokeDashoffset = circumference;
  requestAnimationFrame(function(){
    setTimeout(function(){
      ring.style.strokeDashoffset = circumference * (1 - r.pct/100);
    }, 60);
  });

  if(r.tier === "pass" || r.tier === "master"){
    setTimeout(fireConfetti, 400);
  }

  renderReviewList();
}

function renderReviewList(){
  var list = document.getElementById("review-list");
  list.innerHTML = "";
  state.results.review.forEach(function(item, idx){
    var q = item.q;
    var div = document.createElement("div");
    div.className = "glass review-item";
    div.setAttribute("data-action", "toggle-review");
    div.setAttribute("data-index", idx);

    var userLetters = item.userAns.length ? item.userAns.map(function(l){return l.toUpperCase();}).join(", ") : "—";
    var correctLetters = q.correct.map(function(l){return l.toUpperCase();}).join(", ");

    var choiceLookup = {};
    q.choices.forEach(function(c){ choiceLookup[c.letter] = c.text; });

    var userPillsHtml = item.userAns.length ? item.userAns.map(function(l){
      return '<span class="ans-pill ' + (q.correct.indexOf(l)>-1 ? "correct":"wrong") + '">' + l.toUpperCase() + '. ' + escapeHtml(choiceLookup[l]) + '</span>';
    }).join("") : '<span class="ans-pill wrong">ไม่ได้ตอบ · No answer</span>';

    var correctPillsHtml = q.correct.map(function(l){
      return '<span class="ans-pill correct">' + l.toUpperCase() + '. ' + escapeHtml(choiceLookup[l]) + '</span>';
    }).join("");

    div.innerHTML =
      '<div class="review-head">' +
        '<span class="ri-status ' + (item.isCorrect?"correct":"wrong") + '">' + (item.isCorrect?"✓":"✕") + '</span>' +
        '<span class="ri-qtext">' + (idx+1) + '. ' + escapeHtml(q.text) + '</span>' +
        '<span class="chev">▾</span>' +
      '</div>' +
      '<div class="review-body">' +
        '<div class="row"><div class="lab">คำตอบของคุณ · Your answer</div>' + userPillsHtml + '</div>' +
        '<div class="row"><div class="lab">คำตอบที่ถูกต้อง · Correct answer</div>' + correctPillsHtml + '</div>' +
        '<div class="row"><div class="lab">คำอธิบาย · Explanation (' + (state.lang==='en'?'EN':'TH') + ')</div>' +
          '<div class="exp-box ' + (state.lang==='th'?'th':'') + '" data-exp-en="' + escapeAttr(q.expEn) + '" data-exp-th="' + escapeAttr(q.expTh) + '">' + escapeHtml(state.lang==='en'?q.expEn:q.expTh) + '</div>' +
        '</div>' +
      '</div>';
    list.appendChild(div);
  });
}
function escapeHtml(s){
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}
function escapeAttr(s){
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function setReviewLang(lang){
  state.lang = lang;
  document.querySelectorAll("#lang-toggle button").forEach(function(b){
    b.classList.toggle("active", b.getAttribute("data-lang") === lang);
  });
  document.querySelectorAll(".exp-box").forEach(function(box){
    var txt = lang === "en" ? box.getAttribute("data-exp-en") : box.getAttribute("data-exp-th");
    box.textContent = txt;
    box.classList.toggle("th", lang === "th");
  });
  // update the small language label per row
  document.querySelectorAll(".review-body .row:nth-child(3) .lab").forEach(function(lab){
    lab.textContent = "คำอธิบาย · Explanation (" + (lang==='en'?'EN':'TH') + ")";
  });
}

/* ============================================================
   Screen switching
   ============================================================ */
function goToScreen(name){
  state.screen = name;
  document.querySelectorAll(".screen").forEach(function(s){ s.classList.remove("active"); });
  document.getElementById("screen-" + name).classList.add("active");
  window.scrollTo({top:0, behavior:"smooth"});
  if(name === "start"){
    document.getElementById("hud").style.display = "none";
    renderStart();
  }
}

/* ============================================================
   Event delegation (data-* attributes — no inline onclick args)
   ============================================================ */
document.addEventListener("click", function(e){
  var el = e.target.closest("[data-action]");
  if(!el) return;
  var action = el.getAttribute("data-action");

  switch(action){
    case "select-variant": {
      var key = el.getAttribute("data-variant");
      var saved = loadProgress(key);
      if(saved){
        showModal("พบความคืบหน้าเดิม · Resume progress?", "พบข้อมูลการทำข้อสอบชุดนี้ค้างอยู่ ต้องการทำต่อจากเดิม หรือเริ่มใหม่?", "ทำต่อ", "เริ่มใหม่").then(function(resume){
          if(resume){ startVariant(key, true); }
          else { clearProgress(key); startVariant(key, false); }
        });
      } else {
        startVariant(key, false);
      }
      break;
    }
    case "select-choice":
      toggleChoice(el.getAttribute("data-letter"));
      break;
    case "next": goNext(); break;
    case "prev": goPrev(); break;
    case "jump-to": jumpTo(parseInt(el.getAttribute("data-index"),10)); break;
    case "request-submit": requestSubmit(); break;
    case "go-home":
      showModal("ออกจากข้อสอบ · Leave exam?", "ผลคะแนนของรอบนี้จะไม่ถูกบันทึกหลังจากนี้ ต้องการกลับหน้าหลักหรือไม่?", "กลับหน้าหลัก", "อยู่ต่อ").then(function(ok){
        if(ok) goToScreen("start");
      });
      break;
    case "retake":
      startVariant(state.variantKey, false);
      break;
    case "toggle-review": {
      var item = el.closest(".review-item");
      item.classList.toggle("open");
      break;
    }
    case "modal-confirm": hideModal(true); break;
    case "modal-cancel": hideModal(false); break;
  }

  if(el.hasAttribute("data-lang")){
    setReviewLang(el.getAttribute("data-lang"));
  }
});

/* Warn before accidental tab close mid-exam */
window.addEventListener("beforeunload", function(e){
  if(state.screen === "exam"){
    e.preventDefault();
    e.returnValue = "";
  }
});

/* ============================================================
   Boot
   ============================================================ */
renderStart();

})();

</script>
