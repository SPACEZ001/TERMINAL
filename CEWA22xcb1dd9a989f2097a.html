งคลื่น 3 ที่ทรงพลังกว่า"}, {"id": "v2q18", "text": "A contracting triangle's wave E briefly pierces the A-C trendline before reversing sharply. How should this be interpreted?", "choices": [{"id": "v2q18_a", "letter": "a", "text": "As evidence the triangle must be relabeled as an expanding triangle"}, {"id": "v2q18_b", "letter": "b", "text": "As a common 'throw-over' or overshoot of wave E, which does not necessarily invalidate the triangle as long as the overall pattern context still fits"}, {"id": "v2q18_c", "letter": "c", "text": "As proof the pattern is actually an impulsive wave 3"}, {"id": "v2q18_d", "letter": "d", "text": "As an automatic invalidation of the entire triangle count, with no exceptions"}], "correct": ["b"], "expEn": "Minor overshoots or 'throw-overs' of the E wave beyond the A-C trendline are a commonly observed variation in triangles and do not automatically invalidate the pattern, provided the rest of the structure (subwave counts, alternation of price behavior, context) still supports a triangle interpretation.", "expTh": "การที่คลื่น E เกินเส้นแนวโน้ม A-C เล็กน้อย (throw-over) เป็นความผันแปรที่พบได้ทั่วไปใน triangle และไม่ได้ทำให้การนับรูปแบบนี้เป็นโมฆะโดยอัตโนมัติ ตราบใดที่โครงสร้างส่วนที่เหลือ (จำนวนคลื่นย่อย พฤติกรรมราคาที่สลับกัน บริบทโดยรวม) ยังคงสนับสนุนการตีความว่าเป็น triangle"}, {"id": "v2q19", "text": "A analyst notices that a proposed wave 4 triangle has produced a thrust (wave 5) that fell dramatically short of the minimum measured target. What is the most reasonable next step?", "choices": [{"id": "v2q19_a", "letter": "a", "text": "Reassess whether the preceding pattern was correctly identified as a contracting triangle, since a shortfall this large may indicate a mislabeled or different corrective structure"}, {"id": "v2q19_b", "letter": "b", "text": "Automatically assume wave 5 will retroactively extend to meet the target regardless of price action"}, {"id": "v2q19_c", "letter": "c", "text": "Ignore the shortfall entirely, since triangle thrust projections are always unreliable and meaningless"}, {"id": "v2q19_d", "letter": "d", "text": "Conclude that Elliott Wave Principle is invalidated as a method"}], "correct": ["a"], "expEn": "Since the triangle-thrust measurement is a well-established guideline, a substantial shortfall is a signal to revisit the wave count — perhaps the pattern was not a genuine contracting triangle, or the degree/boundaries were mislabeled — rather than to dismiss the tool or force price to fit a stale target.", "expTh": "เนื่องจากการวัดระยะ thrust ของ triangle เป็นแนวทางที่ได้รับการยอมรับอย่างกว้างขวาง การที่ราคาต่ำกว่าเป้าหมายอย่างมีนัยสำคัญเป็นสัญญาณให้ทบทวนการนับคลื่นใหม่ — บางทีรูปแบบนั้นอาจไม่ใช่ contracting triangle ที่แท้จริง หรือระดับ/ขอบเขตถูกกำหนดผิด — มากกว่าจะทิ้งเครื่องมือนี้ไปหรือพยายามบังคับให้ราคาตรงกับเป้าหมายเดิม"}, {"id": "v2q20", "text": "Why is 'best fit, not certainty' considered a core interpretive principle of Elliott Wave analysis?", "choices": [{"id": "v2q20_a", "letter": "a", "text": "Because Elliott Wave counts are chosen at random among valid alternatives, with no analytical basis"}, {"id": "v2q20_b", "letter": "b", "text": "Because only one count is ever theoretically possible at any given time, eliminating any need for probability judgment"}, {"id": "v2q20_c", "letter": "c", "text": "Because multiple rule-valid counts can coexist, and the market ultimately confirms or invalidates a count only as new price data unfolds"}, {"id": "v2q20_d", "letter": "d", "text": "Because guidelines are just as strict as rules, so all valid counts must be identical"}], "correct": ["c"], "expEn": "Because guidelines (not just hard rules) shape wave labeling, and price action is often open to more than one rule-compliant interpretation at the time it is unfolding, Elliott analysts treat their preferred count as the most probable interpretation given current evidence, remaining ready to revise it as new price data confirms or invalidates it.", "expTh": "เนื่องจากแนวทาง (guidelines) ไม่ใช่แค่กฎเข้มงวด มีบทบาทกำหนดการติดป้ายคลื่น และการเคลื่อนไหวของราคามักเปิดให้ตีความได้มากกว่าหนึ่งแบบที่สอดคล้องกับกฎในขณะที่กำลังเกิดขึ้น นักวิเคราะห์เอลเลียตจึงถือว่าการนับคลื่นที่ตนเลือกเป็นการตีความที่น่าจะเป็นไปได้มากที่สุดจากหลักฐานปัจจุบัน พร้อมปรับปรุงเมื่อข้อมูลราคาใหม่ยืนยันหรือหักล้างมัน"}]}, "v3": {"label": "Level II · Part 2", "title": "Elliott Wave Analyst — Level II, Part 2", "questionCount": 20, "timeMinutes": 45, "type": "multi", "topics": "Rule vs. guideline discrimination, count validation, pattern comparison, trade-management application", "questions": [{"id": "v3q01", "text": "Select all statements that describe an INVIOLABLE Elliott Wave rule (not merely a guideline).", "choices": [{"id": "v3q01_a", "letter": "a", "text": "Wave 3 is never the shortest of waves 1, 3, and 5"}, {"id": "v3q01_b", "letter": "b", "text": "Wave 2 can never retrace more than 100% of wave 1"}, {"id": "v3q01_c", "letter": "c", "text": "Wave 4 does not overlap wave 1's price territory in a standard impulse"}, {"id": "v3q01_d", "letter": "d", "text": "Wave 4 typically alternates in form with wave 2"}], "correct": ["a", "b", "c"], "expEn": "The three inviolable rules of a standard impulse are: wave 2 cannot retrace beyond the start of wave 1, wave 3 cannot be the shortest of the three actionary waves, and wave 4 cannot overlap wave 1's price territory. Alternation between waves 2 and 4 is a guideline, not a rule, and can be absent without invalidating a count.", "expTh": "กฎที่ห้ามฝ่าฝืนสามข้อของคลื่นส่งแรงมาตรฐานคือ คลื่น 2 ห้ามย่อเลยจุดเริ่มต้นของคลื่น 1, คลื่น 3 ห้ามสั้นที่สุดในสามคลื่นส่งแรง, และคลื่น 4 ห้ามซ้อนทับเขตราคาของคลื่น 1 ส่วนการสลับกันระหว่างคลื่น 2 และคลื่น 4 เป็นเพียงแนวทาง ไม่ใช่กฎ และอาจไม่ปรากฏโดยไม่ทำให้การนับคลื่นเป็นโมฆะ"}, {"id": "v3q02", "text": "A correction unfolds as a 3-3-5 structure where wave C makes a new low beyond the end of wave A. Select all pattern types this is consistent with.", "choices": [{"id": "v3q02_a", "letter": "a", "text": "A standard zigzag"}, {"id": "v3q02_b", "letter": "b", "text": "An expanded (irregular) flat"}, {"id": "v3q02_c", "letter": "c", "text": "A running flat, if wave B also exceeded the start of wave A"}, {"id": "v3q02_d", "letter": "d", "text": "A regular flat where wave C simply extends slightly beyond wave A"}], "correct": ["b", "c"], "expEn": "A 3-3-5 correction where wave C exceeds wave A's extreme is consistent with an expanded flat. If wave B also exceeded wave A's starting point yet wave C still made a new extreme (rather than falling short), a running-flat variant is also possible. A zigzag has a 5-3-5 structure, and a regular flat's wave C stays close to, rather than decisively beyond, wave A.", "expTh": "คลื่นปรับฐานแบบ 3-3-5 ที่คลื่น C ทำจุดต่ำสุดใหม่เลยจุดสิ้นสุดของคลื่น A สอดคล้องกับ expanded flat หากคลื่น B ก็เลยจุดเริ่มต้นของคลื่น A ไปด้วย แต่คลื่น C ยังคงทำจุดสุดขั้วใหม่ (ไม่ใช่จบสั้นกว่า) ก็อาจเป็น running flat ได้เช่นกัน ส่วน zigzag มีโครงสร้าง 5-3-5 และ regular flat คลื่น C จะจบใกล้เคียงกับคลื่น A มากกว่าจะเลยไปอย่างชัดเจน"}, {"id": "v3q03", "text": "Select all characteristics that are typical of wave 3 in a healthy equity impulse.", "choices": [{"id": "v3q03_a", "letter": "a", "text": "Expanding volume as the advance progresses"}, {"id": "v3q03_b", "letter": "b", "text": "Widespread participation across market sectors"}, {"id": "v3q03_c", "letter": "c", "text": "The longest wave among 1, 3, and 5 in most cases"}, {"id": "v3q03_d", "letter": "d", "text": "The weakest momentum reading of the entire impulse"}], "correct": ["a", "b", "c"], "expEn": "Wave 3 is characteristically strong: it usually shows expanding volume, tends to be the longest of the three actionary waves, and typically exhibits broad sector participation as the trend becomes widely recognized. It is not the weakest wave in momentum terms — that description more often fits wave 5 relative to wave 3.", "expTh": "คลื่น 3 มีลักษณะเฉพาะที่แข็งแกร่ง มักแสดงวอลุ่มที่ขยายตัว มักเป็นคลื่นที่ยาวที่สุดในสามคลื่นส่งแรง และมักมีการมีส่วนร่วมของภาคส่วนตลาดที่กว้างขวางเมื่อเทรนด์เป็นที่รับรู้อย่างแพร่หลาย มันไม่ใช่คลื่นที่มีโมเมนตัมอ่อนแอที่สุด — ลักษณะนั้นมักเข้ากับคลื่น 5 เมื่อเทียบกับคลื่น 3 มากกว่า"}, {"id": "v3q04", "text": "Select all statements that correctly describe a diagonal triangle (of either the leading or ending variety).", "choices": [{"id": "v3q04_a", "letter": "a", "text": "Wave 4 is permitted to overlap wave 1's price territory"}, {"id": "v3q04_b", "letter": "b", "text": "Its boundary trendlines converge, forming a wedge shape"}, {"id": "v3q04_c", "letter": "c", "text": "It always contains exactly three subwaves total"}, {"id": "v3q04_d", "letter": "d", "text": "Each of its five legs subdivides into three waves (or, in some leading diagonals, a mix including fives)"}], "correct": ["a", "b", "d"], "expEn": "Diagonal triangles are wedge-shaped with converging trendlines, and uniquely permit wave 4 to overlap wave 1. They contain five legs (not three), and per Elliott Wave Principle, ending diagonals subdivide 3-3-3-3-3 while leading diagonals can subdivide with a mix of fives and threes depending on the specific variant.", "expTh": "Diagonal triangle มีรูปทรงลิ่มที่เส้นแนวโน้มบีบเข้าหากัน และอนุญาตให้คลื่น 4 ซ้อนทับคลื่น 1 ได้เป็นกรณีพิเศษ ประกอบด้วย 5 ขา (ไม่ใช่ 3 ขา) และตามหลักการเอลเลียต ending diagonal จะแบ่งเป็น 3-3-3-3-3 ในขณะที่ leading diagonal อาจแบ่งแบบผสมทั้งห้าและสามคลื่นย่อยขึ้นอยู่กับรูปแบบย่อย"}, {"id": "v3q05", "text": "A proposed wave count shows wave B retracing 105% of wave A, followed by a wave C that only reaches 60% of wave A's length before reversing. Select all valid conclusions.", "choices": [{"id": "v3q05_a", "letter": "a", "text": "This structure is impossible under any recognized Elliott Wave pattern"}, {"id": "v3q05_b", "letter": "b", "text": "This is consistent with a running flat, given wave B's excursion beyond wave A's start"}, {"id": "v3q05_c", "letter": "c", "text": "The overall pattern likely favors a strong resumption of the prior larger trend once the correction ends"}, {"id": "v3q05_d", "letter": "d", "text": "Wave C falling short of wave A signals a weak, low-momentum corrective structure"}], "correct": ["b", "c", "d"], "expEn": "Wave B exceeding wave A's origin (105%) is the hallmark of a running (or expanded) flat variant, and a short wave C (only 60% of A) indicates a weak, low-momentum correction — often a sign the underlying larger trend remains strong and is poised to reassert itself once the correction concludes.", "expTh": "คลื่น B ที่เกินจุดเริ่มต้นของคลื่น A (105%) เป็นลักษณะเด่นของ running (หรือ expanded) flat ส่วนคลื่น C ที่สั้น (เพียง 60% ของ A) บ่งชี้ถึงคลื่นปรับฐานที่อ่อนแรงและมีโมเมนตัมต่ำ ซึ่งมักเป็นสัญญาณว่าเทรนด์ใหญ่ที่เป็นฐานยังคงแข็งแกร่งและพร้อมกลับมาอีกครั้งเมื่อการปรับฐานสิ้นสุด"}, {"id": "v3q06", "text": "Select all Fibonacci relationships commonly cited as guidelines (not rules) for projecting wave 5's length when wave 3 is the extended wave.", "choices": [{"id": "v3q06_a", "letter": "a", "text": "Wave 5 approximately 0.382 times the total length of waves 1 through 3"}, {"id": "v3q06_b", "letter": "b", "text": "Wave 5 approximately equal in length to wave 1"}, {"id": "v3q06_c", "letter": "c", "text": "Wave 5 must always be exactly 61.8% of wave 3's length, with no exceptions"}, {"id": "v3q06_d", "letter": "d", "text": "Wave 5 approximately 1.618 times the length of wave 1"}], "correct": ["a", "b", "d"], "expEn": "When wave 3 is extended, common guideline-based projections for wave 5 include approximate equality with wave 1, 1.618 times wave 1, or roughly 0.382 of the net distance traveled in waves 1 through 3. None of these are inviolable rules, and no such 'always exactly 61.8% of wave 3' relationship is a recognized standard guideline.", "expTh": "เมื่อคลื่น 3 ยืดขยาย แนวทางที่นิยมใช้ในการประมาณคลื่น 5 ได้แก่ ความยาวใกล้เคียงกับคลื่น 1, 1.618 เท่าของคลื่น 1 หรือประมาณ 0.382 ของระยะทางสุทธิที่เคลื่อนที่ในคลื่น 1 ถึง 3 ทั้งหมดนี้ไม่ใช่กฎที่ห้ามฝ่าฝืน และไม่มีความสัมพันธ์แบบ 'ต้องเท่ากับ 61.8% ของคลื่น 3 เสมอ' เป็นแนวทางมาตรฐานที่ได้รับการยอมรับ"}, {"id": "v3q07", "text": "Select all reasons an analyst might reject a proposed wave-3-as-shortest-actionary-wave labeling on a chart.", "choices": [{"id": "v3q07_a", "letter": "a", "text": "The count must instead be relabeled, since 'wave 3 shortest' cannot stand in a standard impulse"}, {"id": "v3q07_b", "letter": "b", "text": "It contradicts the typical volume/momentum personality expected of a genuine wave 3"}, {"id": "v3q07_c", "letter": "c", "text": "It violates the inviolable rule that wave 3 cannot be the shortest of waves 1, 3, and 5"}, {"id": "v3q07_d", "letter": "d", "text": "It is stylistically unconventional, though technically permitted under Elliott rules"}], "correct": ["a", "c"], "expEn": "Wave 3 being the shortest of the three actionary waves breaks an inviolable rule outright — it is not merely unconventional or a matter of style, and it cannot be reconciled by appealing to guidelines. The count must be relabeled entirely, since this configuration is never valid in a standard impulse.", "expTh": "การที่คลื่น 3 สั้นที่สุดในสามคลื่นส่งแรงเป็นการฝ่าฝืนกฎที่ห้ามฝ่าฝืนโดยตรง ไม่ใช่เพียงความไม่ปกติทางสไตล์หรือเรื่องของแนวทาง และไม่สามารถแก้ไขได้ด้วยการอ้างอิงแนวทางอื่น การนับคลื่นต้องถูกเปลี่ยนป้ายกำกับใหม่ทั้งหมด เนื่องจากรูปแบบนี้ไม่เคยถูกต้องในคลื่นส่งแรงมาตรฐาน"}, {"id": "v3q08", "text": "Select all statements that correctly distinguish a double three from a triple three correction.", "choices": [{"id": "v3q08_a", "letter": "a", "text": "A double three contains two simple corrective patterns joined by one X wave; a triple three contains three simple patterns joined by two X waves"}, {"id": "v3q08_b", "letter": "b", "text": "A triple three always ends with a zigzag as its final leg, never a triangle"}, {"id": "v3q08_c", "letter": "c", "text": "Both are labeled using the sequence W-X-Y (double) or W-X-Y-X-Z (triple)"}, {"id": "v3q08_d", "letter": "d", "text": "Both structures are classified as complex corrections, as opposed to simple corrections like a single zigzag or flat"}], "correct": ["a", "c", "d"], "expEn": "A double three links two simple corrective patterns with one X wave (W-X-Y); a triple three links three simple patterns with two X waves (W-X-Y-X-Z). Both are complex corrections. However, the final leg of a triple three is very commonly a triangle rather than being restricted to a zigzag.", "expTh": "Double three เชื่อมรูปแบบปรับฐานพื้นฐานสองรูปแบบด้วยคลื่น X หนึ่งตัว (W-X-Y) ส่วน triple three เชื่อมสามรูปแบบด้วยคลื่น X สองตัว (W-X-Y-X-Z) ทั้งสองจัดเป็นคลื่นปรับฐานแบบซับซ้อน อย่างไรก็ตาม ขาสุดท้ายของ triple three มักเป็น triangle บ่อยครั้ง ไม่ได้จำกัดอยู่แค่ zigzag เท่านั้น"}, {"id": "v3q09", "text": "An analyst is evaluating whether a five-wave rally is genuinely impulsive (motive) or actually a corrective wave C. Select all pieces of evidence that would support the 'genuine impulse' interpretation.", "choices": [{"id": "v3q09_a", "letter": "a", "text": "The rally is immediately preceded by a clear three-wave A-B corrective decline, positioning it as a wave C"}, {"id": "v3q09_b", "letter": "b", "text": "Volume expands notably during wave 3 of the rally"}, {"id": "v3q09_c", "letter": "c", "text": "Wave 4 of the rally does not overlap wave 1's price territory"}, {"id": "v3q09_d", "letter": "d", "text": "Momentum readings strengthen through wave 3 and only diverge at wave 5, consistent with typical impulse personality"}], "correct": ["b", "c", "d"], "expEn": "Non-overlap of wave 4, expanding wave-3 volume, and a wave-5 momentum signature consistent with a genuine impulse all support a true motive-wave interpretation. Being preceded by an A-B decline actually supports the opposite conclusion — that the five-wave rally is a wave C of a larger correction, not a fresh impulsive wave 1.", "expTh": "การไม่ซ้อนทับของคลื่น 4 วอลุ่มที่ขยายตัวชัดเจนในคลื่น 3 และลักษณะโมเมนตัมของคลื่น 5 ที่สอดคล้องกับคลื่นส่งแรงแท้จริง ล้วนสนับสนุนการตีความว่าเป็นคลื่นส่งแรงจริง ในทางกลับกัน การที่มีคลื่นลง A-B แบบ 3 คลื่นนำหน้า กลับสนับสนุนข้อสรุปตรงกันข้าม คือคลื่นขึ้น 5 คลื่นนี้เป็นคลื่น C ของคลื่นปรับฐานที่ใหญ่กว่า ไม่ใช่คลื่น 1 ใหม่ที่เป็นคลื่นส่งแรง"}, {"id": "v3q10", "text": "Select all valid uses of the Elliott Wave channeling technique.", "choices": [{"id": "v3q10_a", "letter": "a", "text": "Drawing a trendline through the ends of waves 2 and 4, then a parallel line off the extreme of wave 3 (or wave 1) to help forecast where wave 5 may end"}, {"id": "v3q10_b", "letter": "b", "text": "Adjusting the channel by redrawing the base trendline through wave 4 if price closes outside the original parallel line before wave 5 completes"}, {"id": "v3q10_c", "letter": "c", "text": "Using channel breaks as one supporting signal (not a stand-alone rule) that a wave may be ending or a count may need revision"}, {"id": "v3q10_d", "letter": "d", "text": "Replacing all Fibonacci-based price targets entirely, since channeling alone is always sufficient"}], "correct": ["a", "b", "c"], "expEn": "Channeling connects wave 2 and wave 4 endpoints with a trendline, projects a parallel line off wave 3 (or wave 1) to estimate wave 5's likely terminus, and can be redrawn through wave 4 if price initially closes outside the projected channel. Channel breaks are a useful supporting signal, not proof on their own, and channeling is meant to complement — not replace — Fibonacci-based targets.", "expTh": "เทคนิคการวาดช่องแนวโน้มคือการลากเส้นผ่านจุดสิ้นสุดของคลื่น 2 และคลื่น 4 จากนั้นลากเส้นขนานผ่านจุดสุดขั้วของคลื่น 3 (หรือคลื่น 1) เพื่อประมาณจุดจบที่เป็นไปได้ของคลื่น 5 และสามารถวาดเส้นฐานใหม่ผ่านคลื่น 4 ได้หากราคาปิดนอกเส้นขนานเดิมก่อนคลื่น 5 จะจบ การทะลุช่องแนวโน้มเป็นสัญญาณสนับสนุนที่มีประโยชน์ ไม่ใช่หลักฐานที่สมบูรณ์ในตัวเอง และการวาดช่องแนวโน้มมีไว้เสริม ไม่ใช่แทนที่เป้าหมายราคาที่อิงฟีโบนักชี"}, {"id": "v3q11", "text": "Select all statements that correctly describe the typical market 'personality' of wave A within a larger A-B-C correction.", "choices": [{"id": "v3q11_a", "letter": "a", "text": "It always retraces at least 61.8% of the entire preceding impulse"}, {"id": "v3q11_b", "letter": "b", "text": "It commonly shows the first signs of a shift in underlying momentum, even if not yet widely recognized"}, {"id": "v3q11_c", "letter": "c", "text": "It is frequently mistaken for just another pullback within the still-dominant prior trend"}, {"id": "v3q11_d", "letter": "d", "text": "It typically subdivides into either five waves (if the correction is a zigzag) or three waves (if it is a flat or triangle)"}], "correct": ["b", "c", "d"], "expEn": "Wave A often looks, at first, like a routine pullback within the ongoing larger trend, even though momentum indicators frequently show early signs of change. There is no rule requiring wave A to retrace a minimum of 61.8% of the prior impulse. Its internal subdivision depends on the correction type — five waves in a zigzag, three waves in a flat or triangle.", "expTh": "คลื่น A มักดูเหมือนเป็นเพียงการย่อตัวตามปกติภายในเทรนด์ใหญ่ที่ยังดำเนินอยู่ในช่วงแรก แม้ตัวชี้วัดโมเมนตัมมักแสดงสัญญาณการเปลี่ยนแปลงตั้งแต่เนิ่นๆ ก็ตาม ไม่มีกฎใดกำหนดให้คลื่น A ต้องย่อขั้นต่ำ 61.8% ของคลื่นส่งแรงก่อนหน้า การแบ่งคลื่นย่อยภายในขึ้นอยู่กับประเภทคลื่นปรับฐาน คือห้าคลื่นใน zigzag หรือสามคลื่นใน flat หรือ triangle"}, {"id": "v3q12", "text": "A contracting triangle is identified in the wave 4 position. Select all statements that correctly describe expectations for the subsequent wave 5 'thrust'.", "choices": [{"id": "v3q12_a", "letter": "a", "text": "The triangle in the wave 4 position typically signals that the overall move is nearing its final stage"}, {"id": "v3q12_b", "letter": "b", "text": "The minimum thrust distance is often estimated using the width of the triangle's widest leg"}, {"id": "v3q12_c", "letter": "c", "text": "The thrust is expected to be unusually slow and drawn-out compared to earlier motive waves in the sequence"}, {"id": "v3q12_d", "letter": "d", "text": "The thrust should move in the same direction as the trend of one larger degree (i.e., the direction of waves 1 through 3)"}], "correct": ["a", "b", "d"], "expEn": "A triangle in the wave 4 slot typically precedes a thrust in the direction of the larger trend, with a minimum distance commonly projected from the triangle's widest leg. Triangles usually signal the pattern is approaching its final stage, but the ensuing thrust is often relatively quick and sharp rather than slow and drawn-out.", "expTh": "Triangle ในตำแหน่งคลื่น 4 มักตามมาด้วย thrust ไปในทิศทางของเทรนด์ใหญ่กว่า โดยระยะทางขั้นต่ำมักประมาณจากขาที่กว้างที่สุดของ triangle triangle มักบ่งชี้ว่ารูปแบบกำลังเข้าใกล้ระยะสุดท้าย แต่ thrust ที่ตามมามักค่อนข้างรวดเร็วและรุนแรง มากกว่าจะช้าและยืดเยื้อ"}, {"id": "v3q13", "text": "Select all scenarios that would correctly invalidate a proposed count for a standard (non-diagonal) impulse.", "choices": [{"id": "v3q13_a", "letter": "a", "text": "Wave 5 shows negative momentum divergence versus wave 3"}, {"id": "v3q13_b", "letter": "b", "text": "Wave 3 is shorter in price than both wave 1 and wave 5"}, {"id": "v3q13_c", "letter": "c", "text": "Wave 4's low sits just above wave 1's high, with no overlap at all"}, {"id": "v3q13_d", "letter": "d", "text": "Wave 2 retraces exactly 100.5% of wave 1, moving fractionally below wave 1's starting point"}], "correct": ["b", "d"], "expEn": "Wave 2 retracing beyond 100% of wave 1, and wave 3 being the shortest of the three actionary waves, both break inviolable rules and invalidate a standard impulse count. Wave 4 staying clear of wave 1 (no overlap) is exactly what the rule requires, and negative momentum divergence on wave 5 is a normal guideline-level observation, not a rule violation.", "expTh": "คลื่น 2 ที่ย่อเกิน 100% ของคลื่น 1 และคลื่น 3 ที่สั้นที่สุดในสามคลื่นส่งแรง ล้วนฝ่าฝืนกฎที่ห้ามฝ่าฝืนและทำให้การนับคลื่นส่งแรงมาตรฐานเป็นโมฆะ ส่วนคลื่น 4 ที่ไม่ซ้อนทับคลื่น 1 เลยคือสิ่งที่กฎกำหนดไว้พอดี และ divergence เชิงลบของโมเมนตัมบนคลื่น 5 เป็นเพียงข้อสังเกตระดับแนวทาง ไม่ใช่การฝ่าฝืนกฎ"}, {"id": "v3q14", "text": "Select all statements that correctly apply the alternation guideline within a single impulse wave.", "choices": [{"id": "v3q14_a", "letter": "a", "text": "Alternation is an inviolable rule, so any impulse where waves 2 and 4 look similar must be relabeled"}, {"id": "v3q14_b", "letter": "b", "text": "If wave 2 is a sharp (zigzag-type) correction, wave 4 is more likely to unfold as a sideways, complex correction such as a flat or triangle"}, {"id": "v3q14_c", "letter": "c", "text": "If wave 2 is a time-consuming sideways correction, wave 4 is more likely to be a quicker, sharper correction"}, {"id": "v3q14_d", "letter": "d", "text": "Alternation is a probabilistic tendency, useful for anticipating wave 4's likely character once wave 2's character is known"}], "correct": ["b", "c", "d"], "expEn": "Alternation describes a tendency, not a rule: sharp wave 2 corrections tend to pair with sideways wave 4 corrections and vice versa, which analysts use as a probabilistic guide. Because it is a guideline, an impulse where waves 2 and 4 happen to look similar is not automatically invalid.", "expTh": "การสลับ (alternation) อธิบายถึงแนวโน้ม ไม่ใช่กฎ คลื่น 2 ที่ปรับฐานแบบรุนแรงมักจับคู่กับคลื่น 4 ที่ปรับฐานแบบออกด้านข้าง และในทางกลับกัน ซึ่งนักวิเคราะห์ใช้เป็นแนวทางเชิงความน่าจะเป็น เนื่องจากเป็นเพียงแนวทาง คลื่นส่งแรงที่คลื่น 2 และคลื่น 4 มีลักษณะคล้ายกันจึงไม่ได้เป็นโมฆะโดยอัตโนมัติ"}, {"id": "v3q15", "text": "A market produces an unusually long and powerful wave that some analysts label wave 3, while others argue it should be labeled wave C of a corrective structure one degree larger. Select all considerations relevant to resolving this ambiguity.", "choices": [{"id": "v3q15_a", "letter": "a", "text": "Whether the wave immediately preceding it was itself a clear three-wave (A-B) corrective structure"}, {"id": "v3q15_b", "letter": "b", "text": "The color used to plot the wave on the analyst's charting software"}, {"id": "v3q15_c", "letter": "c", "text": "Whether the internal subdivision of the long wave consists of five clearly impulsive subwaves"}, {"id": "v3q15_d", "letter": "d", "text": "Whether volume and momentum characteristics match the personality typically expected of a wave 3 versus a wave C"}], "correct": ["a", "c", "d"], "expEn": "Distinguishing a wave 3 from a wave C hinges on real structural and behavioral evidence: what preceded the wave (a corrective A-B favors labeling it wave C), whether it subdivides impulsively into five waves (consistent with either interpretation, but required for both), and whether volume/momentum personality better matches a genuine wave 3 or a wave C. Chart color is irrelevant to the analysis.", "expTh": "การแยกแยะคลื่น 3 จากคลื่น C ขึ้นอยู่กับหลักฐานเชิงโครงสร้างและพฤติกรรมที่แท้จริง คือคลื่นที่นำหน้ามันคืออะไร (คลื่นปรับฐาน A-B แบบ 3 คลื่นสนับสนุนการติดป้ายว่าเป็นคลื่น C) คลื่นนั้นแบ่งเป็น 5 คลื่นย่อยแบบส่งแรงหรือไม่ (สอดคล้องกับทั้งสองการตีความแต่จำเป็นสำหรับทั้งคู่) และลักษณะวอลุ่ม/โมเมนตัมเข้ากับคลื่น 3 แท้จริงหรือคลื่น C มากกว่ากัน สีที่ใช้พล็อตกราฟไม่มีความเกี่ยวข้องกับการวิเคราะห์เลย"}, {"id": "v3q16", "text": "Select all statements that correctly describe how wave degree should be handled when publishing a wave count.", "choices": [{"id": "v3q16_a", "letter": "a", "text": "Mixing degree conventions inconsistently (e.g., using Minor-degree numerals to label a Primary-degree wave) can create serious confusion about implied timeframes and targets"}, {"id": "v3q16_b", "letter": "b", "text": "Degree labels are cosmetic only and can be swapped freely without affecting the analytical meaning of the count"}, {"id": "v3q16_c", "letter": "c", "text": "The same numeral or letter style should be used consistently for one specific degree throughout the analysis"}, {"id": "v3q16_d", "letter": "d", "text": "A Minor degree count should nest logically inside its parent Intermediate degree count, without contradicting the larger structure"}], "correct": ["a", "c", "d"], "expEn": "Consistent, degree-specific notation prevents ambiguity: a given numeral/letter style should map to one degree throughout an analysis, and each smaller-degree count should nest logically within its larger-degree parent. Degree labels are not merely cosmetic — inconsistent use can seriously mislead readers about the implied timeframe and price targets.", "expTh": "สัญลักษณ์ที่มีความสม่ำเสมอเฉพาะแต่ละระดับช่วยป้องกันความคลุมเครือ รูปแบบตัวเลข/ตัวอักษรหนึ่งชุดควรสอดคล้องกับระดับเดียวตลอดการวิเคราะห์ และการนับคลื่นระดับเล็กกว่าควรซ้อนอยู่ภายในระดับใหญ่กว่าอย่างมีเหตุผล ป้ายกำกับระดับคลื่นไม่ใช่เพียงเรื่องความสวยงาม การใช้ที่ไม่สม่ำเสมออาจทำให้ผู้อ่านเข้าใจผิดเกี่ยวกับกรอบเวลาและเป้าหมายราคาที่สื่อถึงได้อย่างมาก"}, {"id": "v3q17", "text": "Select all valid applications of Fibonacci extension ratios (such as 1.618 or 2.618) in Elliott Wave trading.", "choices": [{"id": "v3q17_a", "letter": "a", "text": "Guaranteeing the exact price at which any wave will terminate, with no possibility of variance"}, {"id": "v3q17_b", "letter": "b", "text": "Providing one probabilistic input among several (alongside channeling, momentum, and pattern context) for setting profit targets"}, {"id": "v3q17_c", "letter": "c", "text": "Projecting a likely price target for wave C of a zigzag based on the length of wave A"}, {"id": "v3q17_d", "letter": "d", "text": "Projecting a likely price target for an extended wave 3 based on the length of wave 1"}], "correct": ["b", "c", "d"], "expEn": "Fibonacci extensions are commonly used to project targets for an extended wave 3 (relative to wave 1) and for wave C of a zigzag (relative to wave A), and are best treated as one probabilistic input among several tools rather than a guarantee. No Fibonacci ratio provides a certain, exact price outcome.", "expTh": "การยืดขยายฟีโบนักชีมักถูกใช้เพื่อประมาณเป้าหมายของคลื่น 3 ที่ยืดขยาย (เทียบกับคลื่น 1) และคลื่น C ของ zigzag (เทียบกับคลื่น A) และควรถือเป็นข้อมูลเชิงความน่าจะเป็นหนึ่งในหลายเครื่องมือ ไม่ใช่การรับประกัน ไม่มีอัตราส่วนฟีโบนักชีใดให้ผลลัพธ์ราคาที่แน่นอนตายตัว"}, {"id": "v3q18", "text": "A trader sees what appears to be a completed five-wave decline on a lower timeframe and considers entering long. Select all additional checks consistent with disciplined Elliott Wave-based trade management.", "choices": [{"id": "v3q18_a", "letter": "a", "text": "Confirming the proposed wave 5 did not violate any inviolable rules relative to waves 1 through 4"}, {"id": "v3q18_b", "letter": "b", "text": "Placing a stop-loss beyond the point that would invalidate the proposed wave count if breached"}, {"id": "v3q18_c", "letter": "c", "text": "Assuming the count is certain and using maximum position size, since five waves down always mean the decline is complete"}, {"id": "v3q18_d", "letter": "d", "text": "Checking whether the larger-degree trend (one or two degrees higher) still favors further downside, which could mean this is only a lower-degree wave within a larger decline"}], "correct": ["a", "b", "d"], "expEn": "Sound Elliott-based trade management includes verifying no inviolable rules were broken, checking the higher-degree context (since a five-wave decline could simply be one motive leg within a still-unfolding larger downtrend), and placing stops at the level that would invalidate the count. Treating any count as certain and maximizing size contradicts the probabilistic, best-fit nature of wave analysis.", "expTh": "การบริหารการเทรดตามหลักเอลเลียตอย่างมีวินัยรวมถึงการตรวจสอบว่าไม่มีกฎที่ห้ามฝ่าฝืนถูกละเมิด การตรวจสอบบริบทของเทรนด์ระดับที่ใหญ่กว่า (เนื่องจากคลื่นลง 5 คลื่นอาจเป็นเพียงขาส่งแรงหนึ่งในเทรนด์ขาลงที่ใหญ่กว่าซึ่งยังดำเนินอยู่) และการวางจุดตัดขาดทุนที่ระดับซึ่งจะทำให้การนับคลื่นเป็นโมฆะ การถือว่าการนับคลื่นใดแน่นอนและใช้ขนาดโพซิชันสูงสุดขัดกับธรรมชาติเชิงความน่าจะเป็นและ 'best fit' ของการวิเคราะห์คลื่น"}, {"id": "v3q19", "text": "Select all statements correctly describing why 'guidelines' can be violated in a valid Elliott Wave count while 'rules' cannot.", "choices": [{"id": "v3q19_a", "letter": "a", "text": "Guidelines and rules carry identical analytical weight and are used interchangeably by convention"}, {"id": "v3q19_b", "letter": "b", "text": "Rules define the minimum structural conditions that, if broken, mean the pattern cannot be the labeled wave type at all"}, {"id": "v3q19_c", "letter": "c", "text": "Guidelines describe statistical tendencies observed across many historical examples, not conditions required for structural validity"}, {"id": "v3q19_d", "letter": "d", "text": "A count can satisfy every rule while still deviating from one or more guidelines and remain a valid, if lower-probability, interpretation"}], "correct": ["b", "c", "d"], "expEn": "Rules are strict structural requirements — violating one means the labeled pattern is simply wrong. Guidelines summarize common tendencies (such as alternation or typical proportion) that raise or lower the probability of a given interpretation without determining validity outright, so a rule-compliant count can still diverge from guidelines and remain valid, just less probable.", "expTh": "กฎเป็นข้อกำหนดเชิงโครงสร้างที่เข้มงวด การฝ่าฝืนข้อใดข้อหนึ่งหมายความว่ารูปแบบที่ติดป้ายไว้ผิดพลาดโดยสิ้นเชิง แนวทางสรุปแนวโน้มที่พบบ่อย (เช่นการสลับหรือสัดส่วนทั่วไป) ซึ่งเพิ่มหรือลดความน่าจะเป็นของการตีความหนึ่งๆ โดยไม่ได้กำหนดความถูกต้องโดยตรง ดังนั้นการนับคลื่นที่สอดคล้องกับกฎทั้งหมดยังคงเบี่ยงเบนจากแนวทางได้และยังคงถูกต้อง เพียงแต่มีความน่าจะเป็นต่ำกว่า"}, {"id": "v3q20", "text": "Select all statements that correctly compare a zigzag and a flat correction.", "choices": [{"id": "v3q20_a", "letter": "a", "text": "A zigzag has a 5-3-5 internal structure, while a flat has a 3-3-5 internal structure"}, {"id": "v3q20_b", "letter": "b", "text": "A zigzag typically retraces less of the prior impulse in price than a flat, in the sense that a flat's wave B often reaches close to 100% of wave A while a zigzag's wave B does not"}, {"id": "v3q20_c", "letter": "c", "text": "Both patterns always subdivide their wave C into exactly five impulsive subwaves"}, {"id": "v3q20_d", "letter": "d", "text": "A flat's wave A always retraces at least 61.8% of the impulse it corrects, while a zigzag's wave A never does"}], "correct": ["a", "b", "c"], "expEn": "Zigzags (5-3-5) and flats (3-3-5) differ in internal structure, and flats characteristically feature a wave B that retraces close to the full length of wave A (unlike a zigzag's typically more moderate wave B). Both patterns subdivide wave C into five subwaves. There is no rule fixing a minimum retracement depth of 61.8% for wave A in either pattern type.", "expTh": "Zigzag (5-3-5) และ flat (3-3-5) มีโครงสร้างภายในต่างกัน และ flat มีลักษณะเฉพาะคือคลื่น B ย่อกลับใกล้เคียงความยาวเต็มของคลื่น A (ต่างจากคลื่น B ของ zigzag ที่มักย่อในระดับปานกลางกว่า) ทั้งสองรูปแบบแบ่งคลื่น C เป็น 5 คลื่นย่อยเหมือนกัน ไม่มีกฎใดกำหนดความลึกขั้นต่ำของการย่อที่ 61.8% สำหรับคลื่น A ในรูปแบบใดทั้งสอง"}]}}, "grading": {"fail": 80, "pass": 90}}</script>

// ---------- Seeded PRNG (Mulberry32) + non-mutating Fisher-Yates ----------
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffledCopy(arr, rand){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(rand() * (i+1));
    var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}

  var actions = document.getElementById('modalActions');
  actions.innerHTML = '';

    var b = document.createElement('button');
    b.className = 'btn ' + (btn.style || '');
    b.textContent = btn.label;
    b.addEventListener('click', function(){
      overlay.style.display = 'none';
      if(btn.onClick) btn.onClick();
    });
    actions.appendChild(b);
  });
  overlay.style.display = 'flex';
}

function renderSelectScreen(){

      '<div class="vc-meta"><span><b>'+ v.questionCount +'</b> '+ I18N[lang].questions +'</span><span><b>'+ v.timeMinutes +'</b> '+ I18N[lang].minutes +'</span></div>' +

      '<div class="vc-start">'+ I18N[lang].start +' &rarr;</div>';

  });
  if(window.gsap){
    gsap.fromTo('.variant-card', {y:18, opacity:0}, {y:0, opacity:1, duration:0.5, stagger:0.08, ease:'power2.out'});
    gsap.fromTo('.hero', {y:-14, opacity:0}, {y:0, opacity:1, duration:0.6, ease:'power2.out'});
  }
}

function startVariant(key){
  var v = EXAM.variants[key];
  state.variantKey = key;
  var rand = mulberry32(Date.now() % 2147483647);
  state.questions = shuffledCopy(v.questions, rand);
  state.answers = {};
  state.index = 0;
  state.timeLeft = v.timeMinutes * 60;
  state.totalTime = v.timeMinutes * 60;
  state.startTime = Date.now();
  document.getElementById('examVariantTitle').textContent = v.title;
  document.getElementById('examVariantSub').textContent = v.label + ' · ' + v.questionCount + ' ' + I18N[lang].questions;
  showScreen('examScreen');
  renderQuestion();
  startTimer();
}

function startTimer(){
  clearInterval(state.timerId);
  updateTimerDisplay();
  state.timerId = setInterval(function(){
    state.timeLeft--;
    updateTimerDisplay();
    if(state.timeLeft <= 0){
      clearInterval(state.timerId);
      showModal({
        title: I18N[lang].timeUpTitle,
        body: I18N[lang].timeUpBody,
        buttons: [{label: I18N[lang].ok, style:'', onClick: submitExam}]
      });
    }
  }, 1000);
}
function updateTimerDisplay(){
  var el = document.getElementById('timerDisplay');
  var m = Math.floor(Math.max(0,state.timeLeft) / 60);
  var s = Math.max(0,state.timeLeft) % 60;
  el.textContent = m + ':' + (s < 10 ? '0'+s : s);
  el.classList.toggle('low', state.timeLeft <= 60);
}

// ---------- Exam question rendering ----------
function renderQuestion(){
  var v = EXAM.variants[state.variantKey];
  var q = state.questions[state.index];
  var host = document.getElementById('questionHost');
  var isMulti = v.type === 'multi';
  var selected = state.answers[q.id] || [];

  var html = '<div class="glass qcard">';
  html += '<div class="qnum">' + v.label + ' &middot; ' + (state.index+1) + ' / ' + state.questions.length + '</div>';
  html += '<div class="qtext">' + escapeHtml(q.text) + '</div>';
  if(isMulti) html += '<div class="multi-hint">' + I18N[lang].multi + '</div>';
  q.choices.forEach(function(c){
    var isSel = selected.indexOf(c.letter) !== -1;
    html += '<div class="choice'+(isSel?' selected':'')+'" data-action="choose" data-qid="'+q.id+'" data-letter="'+c.letter+'" data-multi="'+isMulti+'">';
    html += '<div class="letter">'+c.letter.toUpperCase()+'</div>';
    html += '<div class="ctext">'+ escapeHtml(c.text) +'</div>';
    html += '</div>';
  });
  html += '</div>';
  host.innerHTML = html;

  document.getElementById('progressFill').style.width = (((state.index+1)/state.questions.length)*100) + '%';
  document.getElementById('prevBtn').disabled = state.index === 0;
  var nextBtn = document.getElementById('nextBtn');
  var isLast = state.index === state.questions.length - 1;
  nextBtn.querySelector('span') ? null : null;
  nextBtn.innerHTML = '<span>' + (isLast ? (lang==='th' ? 'ส่งข้อสอบ' : 'Submit') : I18N[lang].next) + '</span>';
  nextBtn.setAttribute('data-action', isLast ? 'submit' : 'next');

  if(window.gsap){ gsap.fromTo('.qcard', {opacity:0, y:10}, {opacity:1, y:0, duration:0.35, ease:'power2.out'}); }
}

function escapeHtml(str){
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function chooseAnswer(qid, letter, isMulti){
  var current = state.answers[qid] || [];
  if(isMulti){
    var idx = current.indexOf(letter);
    if(idx === -1) current = current.concat([letter]); else { current = current.slice(); current.splice(idx,1); }
  } else {
    current = [letter];
  }
  state.answers[qid] = current;
  renderQuestion();
}

function goNext(){
  if(state.index < state.questions.length - 1){ state.index++; renderQuestion(); }
}
function goPrev(){
  if(state.index > 0){ state.index--; renderQuestion(); }
}

function confirmSubmit(){
  showModal({
    title: I18N[lang].submitConfirmTitle,
    body: I18N[lang].submitConfirmBody,
    buttons: [
      {label: I18N[lang].cancel, style:'ghost'},
      {label: I18N[lang].submit, style:'', onClick: submitExam}
    ]
  });
}

function submitExam(){
  clearInterval(state.timerId);
  showScreen('resultScreen');
  renderResult();
}

// ---------- Results ----------
function computeScore(){
  var correctCount = 0;
  state.questions.forEach(function(q){
    var given = (state.answers[q.id] || []).slice().sort();
    var correct = q.correct.slice().sort();
    if(given.length === correct.length && given.every(function(l,i){ return l === correct[i]; })){
      correctCount++;
    }
  });
  return correctCount;
}

function renderResult(){
  var total = state.questions.length;
  var correct = computeScore();
  var pct = Math.round((correct/total)*100);
  var elapsed = state.totalTime - Math.max(0,state.timeLeft);
  var tierKey, tierClass;
  if(pct >= 90){ tierKey='master'; tierClass='tier-master'; }
  else if(pct >= 80){ tierKey='pass'; tierClass='tier-pass'; }
  else { tierKey='fail'; tierClass='tier-fail'; }

  var tierEl = document.getElementById('resultTier');
  tierEl.textContent = I18N[lang][tierKey];
  tierEl.className = 'result-tier ' + tierClass;
  document.getElementById('resultScore').textContent = pct + '%';
  var v = EXAM.variants[state.variantKey];
  document.getElementById('resultSub').textContent = v.title;
  document.getElementById('statCorrect').textContent = correct;
  document.getElementById('statWrong').textContent = total - correct;
  var m = Math.floor(elapsed/60), s = elapsed%60;
  document.getElementById('statTime').textContent = m + ':' + (s<10?'0'+s:s);

  if(tierKey !== 'fail' && window.__confettiFired !== state.variantKey + '_' + Date.now()){
    fireConfetti();
  }
  if(window.gsap){ gsap.fromTo('.result-card', {opacity:0, scale:0.96}, {opacity:1, scale:1, duration:0.5, ease:'back.out(1.4)'}); }
}

// ---------- Review ----------
function renderReview(){
  var host = document.getElementById('reviewHost');
  var html = '';
  state.questions.forEach(function(q, i){
    var given = state.answers[q.id] || [];
    html += '<div class="glass review-item">';
    html += '<div class="rq">' + (i+1) + '. ' + escapeHtml(q.text) + '</div>';
    q.choices.forEach(function(c){
      var isCorrect = q.correct.indexOf(c.letter) !== -1;
      var isGiven = given.indexOf(c.letter) !== -1;
      var cls = '';
      if(isCorrect) cls = 'correct';
      else if(isGiven && !isCorrect) cls = 'incorrect';
      html += '<div class="rchoice '+cls+'"><span class="rletter">'+c.letter.toUpperCase()+'.</span><span>'+escapeHtml(c.text)+(isGiven?'  ('+(lang==='th'?'เลือก':'selected')+')':'')+'</span></div>';
    });
    if(given.length === 0){
      html += '<div class="rchoice"><span>'+I18N[lang].unanswered+'</span></div>';
    }
    html += '<div class="rexp"><b>'+I18N[lang].explanation+'</b>' + escapeHtml(lang==='th' ? q.expTh : q.expEn) + '</div>';
    html += '</div>';
  });
  host.innerHTML = html;
}

// ---------- Particle background ----------
function initParticles(){
  var canvas = document.getElementById('particleCanvas');
  var ctx = canvas.getContext('2d');
  var particles = [];
  var W,H;
  function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  var colors = ['57,245,216','139,123,255','255,95,196'];
  for(var i=0;i<60;i++){
    particles.push({
      x: Math.random()*W, y: Math.random()*H,
      r: Math.random()*1.6 + 0.4,
      vx: (Math.random()-0.5)*0.15, vy: (Math.random()-0.5)*0.15,
      c: colors[i % colors.length], a: Math.random()*0.5 + 0.15
    });
  }
  function tick(){
    ctx.clearRect(0,0,W,H);
    particles.forEach(function(p){
      p.x += p.vx; p.y += p.vy;
      if(p.x < 0) p.x = W; if(p.x > W) p.x = 0;
      if(p.y < 0) p.y = H; if(p.y > H) p.y = 0;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = 'rgba('+p.c+','+p.a+')';
      ctx.fill();
    });
    requestAnimationFrame(tick);
  }
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){ tick(); } else { ctx.clearRect(0,0,W,H); }
}

// ---------- Confetti (canvas, on pass) ----------
function fireConfetti(){
  var canvas = document.getElementById('confettiCanvas');
  canvas.style.display = 'block';
  var ctx = canvas.getContext('2d');
  var W = canvas.width = window.innerWidth;
  var H = canvas.height = window.innerHeight;
  var colors = ['#39f5d8','#8b7bff','#ff5fc4','#ffd15c','#3ce89b'];
  var pieces = [];
  for(var i=0;i<140;i++){
    pieces.push({
      x: Math.random()*W, y: -20 - Math.random()*H*0.4,
      w: 6+Math.random()*6, h: 8+Math.random()*10,
      vy: 2+Math.random()*3, vx: (Math.random()-0.5)*2.4,
      rot: Math.random()*360, vr: (Math.random()-0.5)*10,
      color: colors[Math.floor(Math.random()*colors.length)]
    });
  }
  var frame = 0;
  function tick(){
    frame++;
    ctx.clearRect(0,0,W,H);
    var alive = false;
    pieces.forEach(function(p){
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      if(p.y < H+20) alive = true;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI/180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    });
    if(alive && frame < 260){ requestAnimationFrame(tick); }
    else { canvas.style.display = 'none'; ctx.clearRect(0,0,W,H); }
  }
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){ tick(); } else { canvas.style.display='none'; }
}

// ---------- Event delegation (data-* attributes; avoids inline onclick string-escaping bugs) ----------
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-action]');
  if(!el) return;
  var action = el.getAttribute('data-action');
  if(action === 'selectVariant'){ startVariant(el.getAttribute('data-variant')); }
  else if(action === 'choose'){ chooseAnswer(el.getAttribute('data-qid'), el.getAttribute('data-letter'), el.getAttribute('data-multi')==='true'); }
  else if(action === 'next'){ goNext(); }
  else if(action === 'prev'){ goPrev(); }
  else if(action === 'submit'){ confirmSubmit(); }
  else if(action === 'review'){ showScreen('reviewScreen'); renderReview(); }
  else if(action === 'backToResult'){ showScreen('resultScreen'); renderResult(); }
  else if(action === 'retry'){ startVariant(state.variantKey); }
  else if(action === 'home'){
    showModal({
      title: I18N[lang].exitConfirmTitle,
      body: I18N[lang].exitConfirmBody,
      buttons: [
        {label: I18N[lang].stay, style:'ghost'},
        {label: I18N[lang].leave, style:'danger', onClick: function(){ clearInterval(state.timerId); showScreen('selectScreen'); renderSelectScreen(); }}
      ]
    });
  }
});

// ---------- Init ----------
applyI18n();
document.getElementById('examTitleHeading').textContent = EXAM.meta.examTitle;
document.getElementById('examSubtitleText').textContent = EXAM.meta.examSubtitle;
initParticles();
showScreen('selectScreen');
renderSelectScreen();

})();
</script>
