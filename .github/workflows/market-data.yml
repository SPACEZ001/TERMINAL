name: market-data

# Keeps data/market.json fresh so SPACEZ_TERMINAL.html always has numbers to
# show, with no API key and no CORS proxy involved. The page still layers
# browser-side live quotes on top of this snapshot.

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 min (GitHub queues these, expect drift)
  workflow_dispatch:          # run it by hand from the Actions tab
    inputs:
      test_alerts:
        description: 'ส่งข้อความตัวอย่างทุกแบบไป Telegram (โหมดทดสอบ)'
        type: boolean
        default: false
  push:
    paths:
      - 'scripts/fetch_market.py'
      - 'scripts/alerts_telegram.py'
      - '.github/workflows/market-data.yml'

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Secrets are blank when unset, which is how the alert step below knows
      # to skip itself entirely rather than run half-configured.
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Optional repository Variables; blank falls back to the script defaults.
      ALERT_ENABLE: ${{ vars.ALERT_ENABLE }}
      ALERT_MOVE_PCT: ${{ vars.ALERT_MOVE_PCT }}
      ALERT_DAILY_HOUR_UTC: ${{ vars.ALERT_DAILY_HOUR_UTC }}
      ALERT_MAX_TURN: ${{ vars.ALERT_MAX_TURN }}
      ALERT_OWNER: ${{ vars.ALERT_OWNER }}
      # Only ever true for a hand-started run with the box ticked; a
      # scheduled run leaves it blank. A test send never touches the
      # saved state, so it cannot make a real alert go missing later.
      ALERT_TEST: ${{ inputs.test_alerts }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install --quiet --upgrade yfinance

      - name: Build snapshot
        run: python scripts/fetch_market.py

      # Skipped while the token secret is unset, so no state file is written
      # before the bot exists - the first real run can then introduce itself
      # instead of starting mid-conversation.
      - name: Send Telegram alerts
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        continue-on-error: true
        run: python scripts/alerts_telegram.py

      # Pushing plain `git push` from the default branch works for a normal
      # run, but fails two ways that are not real problems:
      #   - re-running an older run checks out that commit, so HEAD is behind
      #     (and detached) and the push is rejected as non-fast-forward
      #   - the 30-minute schedule can race the backtest job, which pushes to
      #     the same branch
      # Both are fixed by naming the target branch explicitly and rebasing
      # onto whatever landed in the meantime. The data written here is always
      # freshly fetched by this run, so replaying it on top is correct.
      - name: Commit if changed
        run: |
          git config user.name  "spacez-market-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain data/market.json data/alerts_state.json)" ]; then
            echo "no change"
            exit 0
          fi

          git add data/market.json
          [ -f data/alerts_state.json ] && git add data/alerts_state.json
          git commit -m "data: market snapshot $(date -u '+%Y-%m-%d %H:%M UTC')"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main (attempt $attempt)"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "could not rebase cleanly"
              break
            fi
          done

          echo "::error::could not push the snapshot after 3 attempts"
          exit 1
